name: Sincronía · restore Sánchez Robles and da Silva Catela

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-sanchez-catela.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-sanchez-catela-source-locked
  cancel-in-progress: false

jobs:
  restore-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify source-specific authorship and immutable originals
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_sanchez_catela
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly two documented Sincronía authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-sanchez-catela-before.json
          python3 -m scripts.cucsh.restore_sincronia_sanchez_catela \
            --input /tmp/cucsh-sanchez-catela-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit only two author fields and no corpus loss
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-sanchez-catela-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-sanchez-catela-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-sanchez-catela-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_sanchez_catela import SOURCES

          old=json.loads(Path("/tmp/cucsh-sanchez-catela-before.json").read_text(encoding="utf-8"))
          new=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={r["id"]:r for r in old["records"]}
          after={r["id"]:r for r in new["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[rid for rid in before if before[rid]!=after[rid]]
          assert len(changed)==2 and set(changed)==set(SOURCES),changed
          for rid in changed:
              original,updated=before[rid],after[rid]
              expected=SOURCES[rid]
              assert original["journal"]==updated["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert original[field]==updated[field],(rid,field)
              assert original.get("legacyTitleEncodingEvidence")==updated.get("legacyTitleEncodingEvidence")
              assert {k for k in set(original)|set(updated)
                      if original.get(k)!=updated.get(k)}=={"authors","legacyAuthorEvidence"}
              assert updated["authors"]==[{"name":expected["author"],"sourceName":expected["author"]}]
              evidence=updated["legacyAuthorEvidence"]
              assert evidence["sourceArticleUrl"]==expected["url"]
              assert evidence["matchedIndexedIssue"]==expected["issue"]
              assert evidence["matchedIndexedYear"]==expected["year"]
              assert evidence["urlMatchLevel"]==expected["evidence"]["urlMatchLevel"]
              assert evidence["publicationVersionCaveat"]

          report=json.loads(Path("/tmp/sincronia-sanchez-catela-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==55
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==53
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert len(report["unresolvedIssue50UrlMappings"])==1
          print("SINCRONIA_SANCHEZ_CATELA_STRICT_PASS",len(changed),55)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore source-verified Sánchez Robles and da Silva Catela Sincronía bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Preserve historical quality and author review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-sanchez-catela
          path: |
            /tmp/sincronia-sanchez-catela-history.json
            /tmp/sincronia-sanchez-catela-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
