name: Build Protrepsis historical supplement

on:
  push:
    branches:
      - feature/protrepsis-historico-1-14-20261112
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build historical corpus
        run: |
          python3 \
            scripts/cucsh/protrepsis_historical.py \
            --output /tmp/protrepsis-historical.json

      - name: Build merged CUCSH snapshot
        run: |
          cp \
            /tmp/protrepsis-historical.json \
            src/data/protrepsis-historical.json

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/cucsh")
          import harvest

          base_path = Path("src/data/cucsh-filosofia.json")
          out_path = Path("/tmp/cucsh-filosofia.json")
          supplement_path = Path("src/data/protrepsis-historical.json")

          base = json.loads(base_path.read_text(encoding="utf-8"))
          historical = harvest.load_historical_protrepsis(supplement_path)

          protrepsis = [
              record
              for record in base["records"]
              if record.get("journal") == "Protrepsis"
          ]
          others = [
              record
              for record in base["records"]
              if record.get("journal") != "Protrepsis"
          ]

          merged, added, enriched = harvest.merge_historical_protrepsis(
              protrepsis,
              historical,
          )

          records = others + merged
          records.sort(
              key=lambda record: (
                  record.get("journal") or "",
                  record.get("year") or 0,
                  record.get("doi") or "",
                  record.get("sourceId") or "",
              )
          )

          dataset = {
              "schemaVersion": 1,
              "provider": "CUCSH Filosofía",
              "records": records,
          }

          out_path.write_text(
              json.dumps(dataset, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("historical supplement =", len(historical))
          print("historical added =", added)
          print("historical enriched =", enriched)
          print("Protrepsis before =", len(protrepsis))
          print("Protrepsis after =", len(merged))
          print("TOTAL before =", len(base["records"]))
          print("TOTAL after =", len(records))
          PY

      - name: Validate historical unit tests
        run: |
          python3 tests/test_protrepsis_historical.py

      - name: Validate Python
        run: |
          python3 -m py_compile \
            scripts/cucsh/protrepsis_historical.py \
            scripts/cucsh/harvest.py \
            scripts/cucsh/validate_update.py

      - name: Validate merged snapshot
        run: |
          python3 \
            scripts/cucsh/validate_update.py \
            --before src/data/cucsh-filosofia.json \
            --after /tmp/cucsh-filosofia.json

      - name: Run repository tests
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Inspect corpus
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          historical = json.loads(
              Path("/tmp/protrepsis-historical.json").read_text(encoding="utf-8")
          )
          merged = json.loads(
              Path("/tmp/cucsh-filosofia.json").read_text(encoding="utf-8")
          )

          counts = Counter(
              record["journal"]
              for record in merged["records"]
          )

          print("historical records =", len(historical["records"]))
          print("historical issues =", historical["coverage"]["issues"])
          print("merged journals =", dict(counts))
          print("merged total =", len(merged["records"]))

          enriched = [
              record
              for record in merged["records"]
              if (
                  record.get("journal") == "Protrepsis"
                  and record.get("historicalSource") == "OpenAlex"
              )
          ]

          print("historical enriched records =", len(enriched))

          assert len(historical["records"]) == 77
          assert historical["coverage"]["issueRange"] == "1–14"
          assert counts["Protrepsis"] >= 303
          assert counts["Quadripartita Ratio"] >= 88
          assert len(enriched) == len(historical["records"])
          PY

      - name: Write generated corpus to branch
        shell: bash
        run: |
          cp /tmp/protrepsis-historical.json src/data/protrepsis-historical.json
          cp /tmp/cucsh-filosofia.json src/data/cucsh-filosofia.json

          git diff --check

          if git diff --quiet -- \
            src/data/protrepsis-historical.json \
            src/data/cucsh-filosofia.json
          then
            echo "Generated corpus already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/data/protrepsis-historical.json \
            src/data/cucsh-filosofia.json

          git commit \
            -m "Add Protrepsis historical issues 1-14"

          git push origin HEAD:${{ github.ref_name }}

      - name: Upload generated corpus
        uses: actions/upload-artifact@v4
        with:
          name: protrepsis-historical
          path: |
            /tmp/protrepsis-historical.json
            /tmp/cucsh-filosofia.json
          if-no-files-found: error
          retention-days: 7
