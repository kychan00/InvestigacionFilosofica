name: Sincronía · finalize curated metadata

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-curated-final.txt"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-curated-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curated-final:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Python unit tests must not leave __pycache__ files in the guarded worktree.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frozen curated patch
        run: |
          python3 scripts/cucsh/finalize_sincronia_curated.py \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/cucsh-filosofia.json
          mv /tmp/cucsh-filosofia.json src/data/cucsh-filosofia.json

      - name: Validate exact postconditions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          assert len(data["records"]) == 1845
          sin=[r for r in data["records"] if r.get("journal")=="Sincronía"]
          assert sum("�" in str(r.get("title") or "") for r in sin) == 0

          mateo=next(r for r in sin if r["id"]=="cucsh:sincronia-legacy:759c7e05d547a0bf70b2")
          assert mateo["title"].startswith("Estructura mundial de la pobreza")
          assert mateo["authors"][0]["name"]=="Miguel Ángel Mateo Pérez"
          assert mateo["legacyAccessStatus"]["status"]=="original-page-unavailable"

          granillo=next(r for r in sin if r["id"]=="cucsh:sincronia-legacy:cd448284ffc7d9036889")
          assert granillo["authors"][0]["name"]=="Lilia Granillo Vázquez"
          print("SINCRONIA_CURATED_FINAL_VALIDATION_PASS", len(data["records"]))
          PY

      - name: Run targeted and application tests
        run: |
          python3 -m unittest tests/test_cucsh_sincronia_curated_final.py
          npm test

      - name: Commit only verified dataset changes
        run: |
          git diff --check
          git status --short
          test -z "$(git status --short | grep -v '^ M src/data/cucsh-filosofia.json$')" || {
            echo "Unexpected files changed"
            exit 1
          }
          if git diff --quiet -- src/data/cucsh-filosofia.json; then
            echo "No curated changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Finalize source-verified Sincronía historical metadata"
          git push origin HEAD:feature/cucsh-sincronia
