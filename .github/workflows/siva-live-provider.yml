name: SIVA · live Wikimedia provider smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/siva-live-provider.yml'
      - 'scripts/qa/author-portrait-live-smoke.mjs'
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Real CORS, license, download and decode
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/siva-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/assets/territory-kant.jpg -o /dev/null && break; sleep 1; done
          node scripts/qa/author-portrait-live-smoke.mjs
