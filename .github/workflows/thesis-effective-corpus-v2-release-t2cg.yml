name: Thesis Effective Corpus V2 Release T2CG

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/thesis-effective-corpus-v2-release-t2cg.yml"
      - "release-manifest.json"
      - "scripts/thesis/build_effective_corpus_release_manifest_v2.py"
      - "scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py"
      - "scripts/thesis/build_thesis_demo_index_v1.py"
      - "scripts/thesis/build_thesis_atlas_v1.py"
      - "scripts/thesis/config/effective-corpus-release-t2cg-v2.json"
      - "scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json"
      - "scripts/thesis/config/thesis-atlas-v1.json"
      - "scripts/thesis/config/thesis-atlas-t2cg-v2.json"
      - "tests/test_thesis_effective_corpus_release_t2cg.py"
      - "tesis.html"
      - "atlas.html"
      - "js/thesis-demo.js"
      - "js/thesis-atlas.js"
      - "docs/THESIS_EFFECTIVE_CORPUS_RELEASE_T2CG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frozen Atlas numeric stack
        run: python -m pip install -r scripts/thesis/requirements-atlas-v1.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run release and UI regressions
        run: |
          python -m py_compile \
            scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py \
            scripts/thesis/build_thesis_demo_index_v1.py \
            scripts/thesis/build_thesis_atlas_v1.py
          python -m unittest tests.test_thesis_effective_corpus_release_t2cg -v
          python -m unittest tests.test_thesis_effective_corpus_v2_candidate_t2cf -v
          npm test

      - name: Verify T2CF human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          contract=json.loads(
              Path("scripts/thesis/config/effective-corpus-release-t2cg-v2.json")
              .read_text(encoding="utf-8")
          )
          expected=contract["candidate"]
          actual=json.loads(subprocess.check_output([
              "gh","api",
              f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{expected['approvedPullRequest']}"
          ],text=True))
          assert actual["merged"] is True
          assert actual["merge_commit_sha"]==expected["mergeCommitSha"]
          assert actual["head"]["sha"]==expected["approvedHeadSha"]
          assert actual["base"]["ref"]=="main"
          print("T2CF approval verified:",expected["approvedPullRequest"])
          PY

      - name: Fetch immutable V1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2cg-base artifacts/t2cg-dry
          mkdir -p /tmp/t2cg-base artifacts/t2cg-dry/release
          gh release download thesis-effective-corpus-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/t2cg-base
          python scripts/thesis/build_effective_corpus_release_manifest_v1.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2bz-v1.json \
            --release-dir /tmp/t2cg-base

      - name: Recompose V2 and build release evidence
        run: |
          ROOT=artifacts/t2cg-dry/release
          python scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py \
            --base /tmp/t2cg-base/effective-corpus.json.gz \
            --contract scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json \
            --registry scripts/thesis/config/program-authority-v1.json \
            --output-corpus "${ROOT}/effective-corpus.json" \
            --output-gzip "${ROOT}/effective-corpus.json.gz" \
            --output-report "${ROOT}/effective-corpus-report.json" \
            --output-json-sha "${ROOT}/effective-corpus.json.sha256" \
            --output-gzip-sha "${ROOT}/effective-corpus.json.gz.sha256"

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            build-manifest \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --corpus-json "${ROOT}/effective-corpus.json" \
            --corpus-gzip "${ROOT}/effective-corpus.json.gz" \
            --report "${ROOT}/effective-corpus-report.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --generated-from-sha "${GITHUB_SHA}" \
            --workflow-run "${GITHUB_RUN_ID}" \
            --created-at "2026-11-04T00:00:00Z" \
            --output-manifest "${ROOT}/manifest.json" \
            --output-json-sha "${ROOT}/effective-corpus.json.sha256" \
            --output-gzip-sha "${ROOT}/effective-corpus.json.gz.sha256"

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --release-dir "${ROOT}" \
            --root-release-manifest release-manifest.json

      - name: Build public thesis index from V2
        run: |
          python scripts/thesis/build_thesis_demo_index_v1.py \
            --corpus-gzip artifacts/t2cg-dry/release/effective-corpus.json.gz \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --output artifacts/t2cg-dry/demo-v1/index.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/t2cg-dry/demo-v1/index.json").read_text())
          assert data["sourceRelease"]=="thesis-effective-corpus-v2"
          assert data["totalIncluded"]==len(data["records"])==566
          assert data["totalCanonical"]==27580
          indexed={row["id"]:row for row in data["records"]}
          for work_id in (
              "thesis:work:00027577",
              "thesis:work:00027578",
              "thesis:work:00027579",
              "thesis:work:00027580",
          ):
              assert work_id in indexed
              assert indexed[work_id]["sourceUrl"],work_id
          print("V2 public index verified:",len(data["records"]))
          PY

      - name: Build experimental Atlas from V2
        run: |
          python scripts/thesis/build_thesis_atlas_v1.py \
            --corpus-gzip artifacts/t2cg-dry/release/effective-corpus.json.gz \
            --release-contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --registry scripts/thesis/config/program-authority-v1.json \
            --atlas-contract scripts/thesis/config/thesis-atlas-t2cg-v2.json \
            --output-dir artifacts/t2cg-dry/atlas-v1

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/t2cg-dry/atlas-v1")
          data=json.loads((root/"index.json").read_text())
          manifest=json.loads((root/"manifest.json").read_text())
          assert data["sourceRelease"]=="thesis-effective-corpus-v2"
          assert len(data["nodes"])==566
          assert manifest["nodes"]==566
          assert manifest["pdfCopies"]==0
          assert data["referenceOnly"] is True
          print("V2 Atlas verified:",len(data["nodes"]))
          PY

      - name: Enforce reference-only dry-run artifact
        run: |
          if find artifacts/t2cg-dry -type f \
            \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.djvu' -o -iname '*.bin' \) \
            | grep -q .; then
            echo "Forbidden full-text artifact found" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-effective-corpus-v2-release-dry-run-t2cg
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/t2cg-dry/release/effective-corpus.json.gz
            artifacts/t2cg-dry/release/effective-corpus.json.sha256
            artifacts/t2cg-dry/release/effective-corpus.json.gz.sha256
            artifacts/t2cg-dry/release/effective-corpus-report.json
            artifacts/t2cg-dry/release/manifest.json
            artifacts/t2cg-dry/demo-v1/index.json
            artifacts/t2cg-dry/atlas-v1/index.json
            artifacts/t2cg-dry/atlas-v1/manifest.json
