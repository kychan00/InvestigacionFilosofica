name: Thesis Historia Arquitectura Authority V32

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/historia-arquitectura-authority-v32-baseline-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "tests/test_thesis_historia_arquitectura_authority_v32.py"
      - "tests/test_thesis_canonical_corpus.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "docs/THESIS_HISTORIA_ARQUITECTURA_AUTHORITY_V32.md"
      - ".github/workflows/thesis-historia-arquitectura-authority-v32.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_historia_arquitectura_authority_v32.py" -v
          python -m unittest discover -s tests -p "test_thesis_canonical_corpus.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-historia-arquitectura-v32
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-historia-arquitectura-v32
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-historia-arquitectura-v32/canonical-confidence.json \
            --output-report artifacts/thesis-historia-arquitectura-v32/confidence-report.json

      - name: Reproject Program Authority V32 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-historia-arquitectura-v32")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          (root / "canonical-v32.json").write_text(
              json.dumps(projected, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "projection-v32.json").write_text(
              json.dumps(projection, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "queue-v32.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate V32 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root = Path("artifacts/thesis-historia-arquitectura-v32")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "historia-arquitectura-authority-v32-baseline-v1.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v32.json").read_text())
          projection = json.loads((root / "projection-v32.json").read_text())
          queue = json.loads((root / "queue-v32.json").read_text())
          scope = json.loads(
              Path("scripts/thesis/config/scope-boundary-matrix-v1.json").read_text()
          )
          expected = baseline["expected"]

          assert baseline["registryRevision"] == "2026-11-02.v32"
          assert int(registry["registryRevision"].rsplit(".v", 1)[1]) >= 32
          assert scope["policyRevision"] == baseline["scopePolicyRevision"]
          assert len(corpus["works"]) == 27576

          selected = [
              w
              for w in corpus["works"]
              if w.get("programRef") == baseline["programRef"]
          ]
          assert len(selected) == expected["works"]

          blocked = [
              w
              for w in selected
              if (w.get("programMetadataEvidence") or {}).get(
                  "authorityApplicability"
              ) == "blocked"
          ]
          assert len(blocked) == expected["blockedWorks"]

          assert Counter(
              w.get("academicUnitRaw") for w in selected
          ) == Counter(expected["academicUnits"])
          assert Counter(
              w.get("admissionStatus") for w in selected
          ) == Counter(expected["admissionStatuses"])

          years = sorted(
              int(str((w.get("date") or {}).get("value"))[:4])
              for w in selected
              if (w.get("date") or {}).get("quality") == "valid"
              and str((w.get("date") or {}).get("value") or "")[:4].isdigit()
          )
          assert years[0] == expected["observedYears"]["min"]
          assert years[-1] == expected["observedYears"]["max"]

          base = [
              w
              for w in corpus["works"]
              if w.get("programRef") == expected["baseProgramRef"]
          ]
          assert len(base) == expected["baseProgramWorks"]
          assert Counter(
              w.get("admissionStatus") for w in base
          ) == Counter({expected["baseProgramAdmissionState"]: len(base)})

          conservation = [
              w
              for w in corpus["works"]
              if w.get("programRef") == expected["conservationHistoricalRef"]
          ]
          assert len(conservation) == expected["conservationHistoricalWorks"]
          assert expected["conservationHistoricalAdmissionState"] == "review"
          assert Counter(
              w.get("admissionStatus") for w in conservation
          ) == Counter({"include": len(conservation)})

          expected_global = dict(expected["globalProjectedAdmission"])
          # V33: historical Licenciatura en la Docencia del Inglés REVIEW -> INCLUDE.
          expected_global["include"] += 1
          expected_global["review"] -= 1
          # V34: Gestión y Desarrollo Cultural REVIEW -> INCLUDE.
          expected_global["include"] += 40
          expected_global["review"] -= 40
          # V35: Conservación del Patrimonio Edificado REVIEW -> INCLUDE.
          expected_global["include"] += 5
          expected_global["review"] -= 5
          assert projection["projectedAdmission"] == expected_global
          assert sum(projection["projectedAdmission"].values()) == 27576

          target_key = "maestria en historia de la arquitectura mexicana"
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["items"]
          )
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["humanitiesActionItems"]
          )

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "historyArchitectureWorks": len(selected),
              "historyArchitectureAdmission": dict(
                  Counter(w.get("admissionStatus") for w in selected)
              ),
              "baseMcaWorks": len(base),
              "baseMcaAdmission": dict(
                  Counter(w.get("admissionStatus") for w in base)
              ),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "nextHumanitiesAction": queue["nextHumanitiesAction"],
          }
          (root / "v32-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V32 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-historia-arquitectura-authority-v32
          path: artifacts/thesis-historia-arquitectura-v32/
          if-no-files-found: error
          retention-days: 14
