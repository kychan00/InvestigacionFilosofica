name: Sincronía Wayback availability probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-wayback-availability.txt"

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Probe exact archived issue entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import urllib.parse
          import urllib.request

          from scripts.cucsh.sincronia_legacy import (
              HISTORICAL_ISSUE_URLS,
              EARLY_ISSUE_FILENAMES,
          )

          targets={
              number:(
                  HISTORICAL_ISSUE_URLS[number],
                  EARLY_ISSUE_FILENAMES[number][1],
              )
              for number in [
                  *range(1,19),
                  51,
              ]
          }

          def probe(item):
              number,(url,year)=item
              api=(
                  "https://archive.org/wayback/available?"
                  + urllib.parse.urlencode({
                      "url":url,
                      "timestamp":f"{year}1231",
                  })
              )
              req=urllib.request.Request(
                  api,
                  headers={"User-Agent":"Mozilla/5.0 InvestigacionFilosofica/0.1"},
              )
              try:
                  with urllib.request.urlopen(req,timeout=10) as response:
                      payload=json.loads(response.read().decode("utf-8","replace"))
                  closest=(payload.get("archived_snapshots") or {}).get("closest") or {}
                  if closest.get("available"):
                      return number,url,closest,None
                  return number,url,None,None
              except Exception as exc:
                  return number,url,None,repr(exc)

          found={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for number,url,closest,error in ex.map(probe,targets.items()):
                  if closest:
                      found[number]={
                          "original":url,
                          "timestamp":closest.get("timestamp"),
                          "snapshot":closest.get("url"),
                          "status":closest.get("status"),
                      }
                      print("WAYBACK_FOUND",number,url,closest)
                  elif error:
                      print("WAYBACK_ERROR",number,url,error)

          print("WAYBACK_SUMMARY",json.dumps(found,ensure_ascii=False,sort_keys=True))
          print("WAYBACK_MISSING",sorted(set(targets)-set(found)))
          PY
