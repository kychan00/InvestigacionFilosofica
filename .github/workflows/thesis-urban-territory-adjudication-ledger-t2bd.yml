name: Thesis urban territory adjudication ledger T2BD

on:
  pull_request:
    paths:
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/build_boundary_work_review_queue_v1.py"
      - "scripts/thesis/build_boundary_adjudication_ledger_v1.py"
      - "scripts/thesis/config/boundary-work-review-policy-v1.json"
      - "scripts/thesis/config/urban-territory-adjudication-batch-001-v1.json"
      - "scripts/thesis/config/urban-territory-adjudication-ledger-baseline-v1.json"
      - "tests/test_thesis_program_curation_queue.py"
      - "tests/test_thesis_boundary_work_review_queue.py"
      - "tests/test_thesis_boundary_adjudication_ledger.py"
      - "docs/THESIS_URBAN_TERRITORY_ADJUDICATION_LEDGER_V1.md"
      - ".github/workflows/thesis-urban-territory-adjudication-ledger-t2bd.yml"
      - ".github/workflows/thesis-real-harvest.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_boundary_adjudication_ledger.py" -v
          python -m unittest discover -s tests -p "test_thesis_boundary_work_review_queue.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v

      - name: Compile builders
        run: |
          python -m py_compile scripts/thesis/build_boundary_adjudication_ledger_v1.py
          python -m py_compile scripts/thesis/build_boundary_work_review_queue_v1.py
          python -m py_compile scripts/thesis/build_program_curation_queue_v1.py

      - name: Download frozen full corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-t2bd artifacts/thesis-urban-territory-adjudication
          mkdir -p /tmp/thesis-t2bd artifacts/thesis-urban-territory-adjudication
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-t2bd.zip
          unzip -q /tmp/thesis-t2bd.zip -d /tmp/thesis-t2bd

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-t2bd/canonical-corpus.json.gz \
            --source-records /tmp/thesis-t2bd/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-urban-territory-adjudication/canonical-confidence.json \
            --output-report artifacts/thesis-urban-territory-adjudication/confidence-report.json

      - name: Build work review queue
        run: |
          python scripts/thesis/build_boundary_work_review_queue_v1.py \
            --canonical-corpus artifacts/thesis-urban-territory-adjudication/canonical-confidence.json \
            --reference-year 2026 \
            --output-dir artifacts/thesis-urban-territory-adjudication/work-review

      - name: Build adjudication ledger batch 001
        run: |
          python scripts/thesis/build_boundary_adjudication_ledger_v1.py \
            --work-review-queue artifacts/thesis-urban-territory-adjudication/work-review/boundary-work-review-queue.json \
            --batch scripts/thesis/config/urban-territory-adjudication-batch-001-v1.json \
            --output-dir artifacts/thesis-urban-territory-adjudication/ledger

      - name: Build full program curation queue
        run: |
          python scripts/thesis/build_program_curation_queue_v1.py \
            --observed-authorities /tmp/thesis-t2bd/observed-authorities.json \
            --canonical-corpus artifacts/thesis-urban-territory-adjudication/canonical-confidence.json \
            --output-dir artifacts/thesis-urban-territory-adjudication/program-curation \
            --top 30

      - name: Validate T2BD historical ledger under T2BQ policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-urban-territory-adjudication")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "urban-territory-adjudication-ledger-baseline-v1.json"
              ).read_text()
          )
          batch = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "urban-territory-adjudication-batch-001-v1.json"
              ).read_text()
          )
          registry = json.loads(
              Path("scripts/thesis/config/program-authority-v1.json").read_text()
          )
          scope = json.loads(
              Path(
                  "scripts/thesis/config/scope-boundary-matrix-v1.json"
              ).read_text()
          )
          confidence = json.loads(
              (root / "confidence-report.json").read_text()
          )
          work_review = json.loads(
              (root / "work-review/boundary-work-review-queue.json").read_text()
          )
          ledger = json.loads(
              (root / "ledger/adjudication-ledger.json").read_text()
          )
          curation = json.loads(
              (
                  root
                  / "program-curation/program-curation-queue.json"
              ).read_text()
          )
          expected = baseline["expected"]
          dcts_ref = baseline["programRef"]
          cognition_ref = "program:udg:doc-cognicion-aprendizaje"

          # Historical T2BD baseline is retained verbatim.
          assert baseline["programAuthorityRevision"] == "2026-11-02.v34"
          assert baseline["scopePolicyRevision"] == "2026-11-02.v4"
          assert baseline["programMetadataEvidenceRevision"] == "2026-11-02.v4"
          assert baseline["workReviewPolicyRevision"] == "2026-11-02.urban-v1"

          # The active batch follows the current shared work-review policy
          # without changing any DCTS adjudication.
          assert batch["originWorkReviewPolicyRevision"] == "2026-11-02.urban-v1"
          assert batch["workReviewPolicyRevision"] == "2026-11-03.boundary-v4"
          assert work_review["policyRevision"] == batch["workReviewPolicyRevision"]

          assert int(registry["registryRevision"].rsplit(".v",1)[1]) >= 44
          assert scope["policyRevision"] == "2026-11-02.v5"
          assert (
              confidence["programMetadataEvidenceRevision"]
              == "2026-11-02.v5"
          )

          dcts_authority = next(
              p for p in registry["programs"] if p["id"] == dcts_ref
          )
          cognition_authority = next(
              p for p in registry["programs"] if p["id"] == cognition_ref
          )
          assert dcts_authority["admissionState"] == "review"
          assert dcts_authority["observedCount"] == 152
          assert cognition_authority["admissionState"] == "review"
          assert cognition_authority["observedCount"] == 4

          wr = expected["workReview"]
          assert work_review["metrics"]["programs"] == 4
          assert work_review["metrics"]["workItems"] == wr["works"] + 29
          assert work_review["metrics"]["projectedAdmission"] == {
              "review": wr["works"] + 29
          }
          assert work_review["metrics"]["pendingPrimarySourceReview"] == (
              wr["pendingPrimarySourceReview"] + 29
          )
          assert work_review["metrics"]["automaticAdmissionDecisions"] == 0
          assert work_review["metrics"]["admissionChanges"] == 0

          dcts_work_items = [
              item for item in work_review["items"]
              if item["programRef"] == dcts_ref
          ]
          cognition_work_items = [
              item for item in work_review["items"]
              if item["programRef"] == cognition_ref
          ]
          assert len(dcts_work_items) == 152
          assert len(cognition_work_items) == 4
          assert all(
              item["projectedAdmissionStatus"] == "review"
              for item in dcts_work_items + cognition_work_items
          )

          pc = expected["programCuration"]
          metrics = curation["metrics"]
          # T2BD uses its own frozen historical observed-authorities snapshot.
          # V47 resolves the one-work Teoría/Crítica row in that snapshot.
          # Its queue remains one item/work above canonical full T2BU (6/14).
          # Adjudication semantics and work-review counts remain unchanged.
          assert metrics["humanitiesActionQueueItems"] == 6
          assert metrics["humanitiesActionWorks"] == 14
          assert metrics["workReviewQueueItems"] == 4
          assert metrics["workReviewWorks"] == 181

          dcts = next(
              item for item in curation["items"]
              if item["normalizedKey"]
              == "doctorado en ciudad territorio y sustentabilidad"
          )
          cognition = next(
              item for item in curation["items"]
              if item["normalizedKey"]
              == "doctorado en cognicion y aprendizaje"
          )
          for item in (dcts, cognition):
              assert item["queueState"] == "review"
              assert item["curationLane"] == "work-level-review"
              assert item["workReview"]["policyRevision"] == (
                  "2026-11-03.boundary-v3"
              )
              assert item["workReview"]["programLevelConclusion"] == (
                  "program-level-scope-review-exhausted"
              )
              assert item["evidenceNeeds"] == [
                  "work-level-primary-source-adjudication",
                  "explicit-human-validation",
              ]

          assert dcts["count"] == 152
          assert cognition["count"] == 4
          assert all(
              item["normalizedKey"] not in {
                  "doctorado en ciudad territorio y sustentabilidad",
                  "doctorado en cognicion y aprendizaje",
                  "doctorado en derechos humanos",
              }
              for item in curation["humanitiesActionItems"]
          )
          assert {
              item["normalizedKey"] for item in curation["workReviewItems"]
          } == {
              "doctorado en ciudad territorio y sustentabilidad",
              "doctorado en cognicion y aprendizaje",
              "doctorado en derechos humanos",
          }

          bl = expected["batchLedger"]
          assert ledger["batchId"] == baseline["batchId"]
          assert ledger["programRef"] == dcts_ref
          assert ledger["metrics"]["batchWorks"] == bl["works"]
          assert (
              ledger["metrics"]["primarySourceAccess"]
              == bl["primarySourceAccess"]
          )
          assert (
              ledger["metrics"]["adjudicationStates"]
              == bl["adjudicationStates"]
          )
          assert (
              ledger["metrics"]["candidateDecisions"]
              == bl["candidateDecisions"]
          )
          assert ledger["metrics"]["humanValidation"] == bl["humanValidation"]
          assert ledger["metrics"]["admissionChanges"] == bl["admissionChanges"]
          assert all(
              entry["projectedAdmissionStatus"] == "review"
              for entry in ledger["entries"]
          )
          assert all(
              entry["primarySourceAccess"] == "restricted"
              for entry in ledger["entries"]
          )
          assert all(
              entry["candidateDecision"] is None
              for entry in ledger["entries"]
          )
          assert all(
              entry["humanValidationStatus"] == "required"
              for entry in ledger["entries"]
          )
          assert all(
              entry["admissionChangeRequested"] is False
              for entry in ledger["entries"]
          )

          summary = {
              "phase": "T2BD-regression-under-T2BQ",
              "currentProgramAuthorityRevision": registry["registryRevision"],
              "currentScopePolicyRevision": scope["policyRevision"],
              "currentMetadataConfidenceRevision": confidence[
                  "programMetadataEvidenceRevision"
              ],
              "currentWorkReviewPolicyRevision": work_review["policyRevision"],
              "dctsWorkReviewWorks": len(dcts_work_items),
              "cognitionWorkReviewWorks": len(cognition_work_items),
              "humanitiesActionQueueItems": metrics[
                  "humanitiesActionQueueItems"
              ],
              "humanitiesActionWorks": metrics["humanitiesActionWorks"],
              "workReviewQueueItems": metrics["workReviewQueueItems"],
              "workReviewWorks": metrics["workReviewWorks"],
              "batchLedger": ledger["metrics"],
          }
          (root / "t2bd-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload T2BD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-urban-territory-adjudication-ledger-t2bd
          path: artifacts/thesis-urban-territory-adjudication/
          if-no-files-found: error
          retention-days: 14
