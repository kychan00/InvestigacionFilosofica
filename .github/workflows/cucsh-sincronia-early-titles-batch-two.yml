name: Sincronía · restore four independently sourced historical titles

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-early-titles-batch-two.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-four-source-verified-titles
  cancel-in-progress: false

jobs:
  verified-four:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test four frozen bibliographic mappings and update safeguards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_early_titles_batch_two
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore four independently sourced article identities
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-four-before.json
          python3 -m scripts.cucsh.restore_sincronia_early_titles_batch_two \
            --input /tmp/cucsh-four-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify strict historical records, original URLs and author counts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-four-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("/tmp/cucsh-four-before.json").read_text())
          patched=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          prev={r["id"]:r for r in original["records"]}
          now={r["id"]:r for r in patched["records"]}
          assert len(prev)==len(now)==1845
          assert list(prev)==list(now)
          changes=[key for key in prev if prev[key]!=now[key]]
          assert len(changes)==4,changes
          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence"
          }
          for key in changes:
              b=prev[key]; a=now[key]
              assert b["journal"]==a["journal"]=="Sincronía"
              assert not b.get("authors") and len(a["authors"])==1
              for field in set(b)|set(a):
                  if field not in permitted:
                      assert b.get(field)==a.get(field),(key,field)
              assert a["legacyIndexMislabelEvidence"]["sourceArticleUrl"]==b["urls"]["canonical"]
              assert b["legacyAccessStatus"]==a["legacyAccessStatus"]
          audit=json.loads(Path("/tmp/sincronia-four-pending-authors.json").read_text())
          assert audit["totalSincroniaRecords"]==1454
          assert audit["pendingAuthorRecords"]==106
          assert audit["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FOUR_VERIFIED_TITLES_NO_LOSS_PASS",len(changes),106)
          PY
      - name: Run full application and search regression tests
        run: |
          npm ci
          npm test
      - name: Commit verified dataset only to development branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore four source-verified Sincronía 2000–2001 article titles"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload source-aware quality and pending review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-four-early-titles-${{ github.run_id }}
          path: |
            /tmp/sincronia-four-historical-quality.json
            /tmp/sincronia-four-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
