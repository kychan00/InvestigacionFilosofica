name: Sincronía · restore seven original works and eight contributors

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-seven-eight-contributors.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-seven-eight-contributors
  cancel-in-progress: false

jobs:
  restore-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test seven source signatures, original metadata and dual authorship
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_seven_eight_contributors
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly seven signed works and eight credited people
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-seven-before.json
          python3 -m scripts.cucsh.restore_sincronia_seven_eight_contributors \
            --input /tmp/sincronia-seven-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Strict corpus integrity and remaining bibliography audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-seven-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-seven-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-seven-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_seven_eight_contributors import SOURCES

          baseline=json.loads(Path("/tmp/sincronia-seven-before.json").read_text(encoding="utf-8"))
          updated=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in baseline["records"]}
          a={r["id"]:r for r in updated["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==7 and set(changed)==set(SOURCES),changed
          assert sum(len(SOURCES[rid]["authors"]) for rid in changed)==8
          for rid in changed:
              old,new=b[rid],a[rid]
              src=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":n,"sourceName":n} for n in src["authors"]]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceUrl"]==src["snapshot"]
              assert ev["sourceArticleUrl"]==src["url"]
              assert ev["sourceArticleTitle"]==src["sourceArticleTitle"]
              assert ev["sourcePrintedByline"]==src["printedByline"]
              assert ev["matchedIndexedIssue"]==src["issue"]
              assert ev["matchedIndexedYear"]==src["year"]
              assert ev["verifiedAuthors"]==src["authors"]
              assert ev["originalAvailabilityPreserved"]
              assert ev["titleIdentityCaveat"]

          duo=a["cucsh:sincronia-legacy:b79324bd7275d6009db8"]
          assert [x["name"] for x in duo["authors"]]==["Jason Powell","Ian Cook"]
          interview=a["cucsh:sincronia-legacy:e904a85e0a828a3eb2e9"]
          assert [x["name"] for x in interview["authors"]]==["Floriano Martins"]
          assert interview["legacyAuthorEvidence"]["sourceIntervieweeNotCoauthor"]=="Alfredo Fressia"

          report=json.loads(Path("/tmp/sincronia-seven-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==20
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==18
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==0
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert len(report["unresolvedIssue50UrlMappings"])==1
          print("SINCRONIA_SEVEN_WORKS_EIGHT_PEOPLE_PASS",len(changed),20)
          PY
      - name: Full application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus JSON to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected changed files"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore seven original Sincronía articles with eight verified contributors"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and author review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-seven-eight-contributors
          path: |
            /tmp/sincronia-seven-history.json
            /tmp/sincronia-seven-pending.json
          retention-days: 30
          if-no-files-found: warn
