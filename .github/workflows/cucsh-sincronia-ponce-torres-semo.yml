name: Sincronía · recover Ponce Martínez Torres and Semo

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-ponce-torres-semo.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-ponce-torres-semo-verification
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify three documented bylines and frozen source identities
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_ponce_torres_semo
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three historically cited authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-pts-before.json
          python3 -m scripts.cucsh.restore_sincronia_ponce_torres_semo \
            --input /tmp/cucsh-pts-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate unchanged historical fields and no lost works
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-pts-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-pts-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-pts-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_ponce_torres_semo import SOURCES

          before_json=json.loads(Path("/tmp/cucsh-pts-before.json").read_text(encoding="utf-8"))
          after_json=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={row["id"]:row for row in before_json["records"]}
          after={row["id"]:row for row in after_json["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[rid for rid in before if before[rid]!=after[rid]]
          assert len(changed)==3 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=before[rid],after[rid]
              expected=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for key in ("title","year","issueNumber","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[key]==new[key],(rid,key)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":expected["author"],"sourceName":expected["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceArticleUrl"]==expected["url"]
              assert ev["verifiedTitle"]==expected["title"]
              assert ev["matchedIndexedIssue"]==expected["issue"]
              assert ev["matchedIndexedYear"]==expected["year"]
              assert ev["urlMatchLevel"]==expected["evidence"]["urlMatchLevel"]
              assert ev["publicationVersionCaveat"]

          report=json.loads(Path("/tmp/sincronia-pts-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==52
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==50
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert len(report["unresolvedIssue50UrlMappings"])==1
          print("SINCRONIA_PTS_STRICT_PASS",len(changed),52)
          PY
      - name: Run full app regression
        run: |
          npm ci
          npm test
      - name: Commit only validated corpus to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore verified Ponce, Martínez Torres, and Semo Sincronía bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload author queue and archival-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-pts
          path: |
            /tmp/sincronia-pts-historical-quality.json
            /tmp/sincronia-pts-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
