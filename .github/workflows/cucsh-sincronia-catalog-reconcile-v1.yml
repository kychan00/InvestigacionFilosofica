name: Sincronía · external bibliographic catalogue reconciliation

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-catalog-reconcile-v1.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-catalog-reconciliation-v1
  cancel-in-progress: false

jobs:
  bibliographic-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify catalogue identity safeguards
        run: |
          python3 -m py_compile scripts/cucsh/reconcile_sincronia_catalogs.py
          python3 -m unittest tests.test_cucsh_sincronia_catalog_recon

      - name: Reconcile only historical incomplete metadata by ISSN and issue
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-catalog.json
          python3 -u -m scripts.cucsh.reconcile_sincronia_catalogs \
            --before /tmp/cucsh-before-catalog.json \
            --after /tmp/cucsh-catalog-candidate.json \
            --report /tmp/sincronia-catalog-evidence.json \
            2>&1 | tee /tmp/sincronia-catalog-run.log

      - name: Strict non-destructive validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-catalog.json \
            --after /tmp/cucsh-catalog-candidate.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input /tmp/cucsh-catalog-candidate.json \
            --output /tmp/sincronia-catalog-quality.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path("/tmp/cucsh-before-catalog.json").read_text())
          after=json.loads(Path("/tmp/cucsh-catalog-candidate.json").read_text())
          assert len(before["records"])==len(after["records"])==1841
          original={r["id"]:r for r in before["records"]}
          updated={r["id"]:r for r in after["records"]}
          assert original.keys()==updated.keys()
          for key,prior in original.items():
              now=updated[key]
              for immutable in ("id","journal","year","issueNumber","urls","sourceId","doi"):
                  assert prior.get(immutable)==now.get(immutable),(key,immutable)
              if prior.get("journal")!="Sincronía":
                  assert prior==now,key
              if prior.get("authors"):
                  assert prior["authors"]==now.get("authors"),key
          print("SINCRONIA_CATALOG_NO_LOSS_PASS",len(updated))
          PY

      - name: Full application and federated-search regression
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/cucsh-catalog-candidate.json src/data/cucsh-filosofia.json
          npm ci
          npm test

      - name: Commit only validated metadata to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          if git diff --cached --quiet; then
            echo "No new source-verified catalogue metadata found"
          else
            test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
            git diff --cached --check
            git commit -m "Reconcile verified Sincronía metadata against bibliographic catalogues"
            git push origin HEAD:feature/cucsh-sincronia
          fi

      - name: Save source evidence and unresolved cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-catalog-evidence-${{ github.run_id }}
          path: |
            /tmp/sincronia-catalog-evidence.json
            /tmp/sincronia-catalog-quality.json
            /tmp/sincronia-catalog-run.log
          if-no-files-found: warn
          retention-days: 30
