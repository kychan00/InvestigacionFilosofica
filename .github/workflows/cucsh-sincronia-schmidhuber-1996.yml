name: Sincronía · restore Schmidhuber 1996 with damaged original URL

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-schmidhuber-1996.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-schmidhuber-broken-1996
  cancel-in-progress: false

jobs:
  recover-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test exact damaged index ID, page title triangulation and frozen source
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_schmidhuber_historical
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore only historically triangulated author with archive caveats
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-schmid-before.json
          python3 -m scripts.cucsh.restore_sincronia_schmidhuber_historical \
            --input /tmp/sincronia-schmid-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit unchanged original indexed fields and full bibliography queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-schmid-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-schmid-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-schmid-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_schmidhuber_historical import (
              WORK_ID, ORIGINAL_TITLE, ORIGINAL_URL, ORIGINAL_STATUS,
              PRIMARY_SNAPSHOT, PRIMARY_HISTORIC_URL, RECOVERED_TITLE,
          )

          before_data=json.loads(Path("/tmp/sincronia-schmid-before.json").read_text(encoding="utf-8"))
          after_data=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before_data["records"]}
          a={r["id"]:r for r in after_data["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          delta=[rid for rid in b if b[rid]!=a[rid]]
          assert delta==[WORK_ID],delta
          old,new=b[WORK_ID],a[WORK_ID]
          for key in ("journal","title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
              assert old[key]==new[key],key
          assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
          assert new["journal"]=="Sincronía"
          assert new["title"]==ORIGINAL_TITLE==","
          assert new["urls"]["canonical"]==ORIGINAL_URL
          assert new["legacyAccessStatus"]["status"]==ORIGINAL_STATUS
          assert new["issueNumber"]==1 and new["year"]==1996
          assert {k for k in set(old)|set(new)
                  if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
          assert [x["name"] for x in new["authors"]]==["Guillermo Schmidhuber de la Mora"]
          ev=new["legacyAuthorEvidence"]
          assert ev["sourceUrl"]==PRIMARY_SNAPSHOT
          assert ev["sourceArchivedHistoricalUrl"]==PRIMARY_HISTORIC_URL
          assert ev["sourceArticleUrl"]==ORIGINAL_URL
          assert ev["sourceArticleTitle"]==RECOVERED_TITLE
          assert ev["sourceExactOriginalUrlWasNotCaptured"] is True
          assert ev["sourceIndependentCitationVenueDate"]=="Sincronía (Invierno 1996): 1–7"
          assert ev["sourceSupportingCitationYear"]==1996
          assert ev["matchedIndexedYear"]==1996
          assert ev["matchedIndexedIssue"]==1
          assert ev["titleAndUrlIdentityCaveat"]
          assert ev["originalAvailabilityPreserved"]

          report=json.loads(Path("/tmp/sincronia-schmid-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==12
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==10
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==0
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_SCHMIDHUBER_1996_PROVENANCE_PASS",len(delta),12)
          PY
      - name: Run complete app regression
        run: |
          npm ci
          npm test
      - name: Commit only source-verified original corpus to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Recover documented Schmidhuber Sincronía Winter 1996 attribution"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical and pending author evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-schmidhuber-1996
          path: |
            /tmp/sincronia-schmid-history.json
            /tmp/sincronia-schmid-pending.json
          retention-days: 30
          if-no-files-found: warn
