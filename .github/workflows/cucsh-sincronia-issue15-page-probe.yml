name: Sincronía issue 15 page timestamp probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-issue15-page.txt"

permissions:
  contents: read

jobs:
  issue15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch summer00 at sibling-page crawl timestamps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import urllib.request
          from html.parser import HTMLParser

          original="http://fuentes.csh.udg.mx/CUCSH/Sincronia/summer00.htm"
          timestamps=[
              "20160413174430",
              "20161216005449",
              "20170506165836",
              "20170523034241",
          ]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.href=None
                  self.parts=[]
                  self.links=[]
                  self.title=[]
                  self.in_title=False
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="a":
                      self.href=dict(attrs).get("href")
                      self.parts=[]
                  if tag.lower()=="title":
                      self.in_title=True
              def handle_data(self,data):
                  if self.href is not None:
                      self.parts.append(data)
                  if self.in_title:
                      self.title.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=="a" and self.href is not None:
                      self.links.append((self.href," ".join(self.parts).strip()))
                      self.href=None
                      self.parts=[]
                  if tag.lower()=="title":
                      self.in_title=False

          for ts in timestamps:
              for modifier in ("id_",""):
                  url=f"https://web.archive.org/web/{ts}{modifier}/{original}"
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 InvestigacionFilosofica/0.1"})
                  try:
                      with urllib.request.urlopen(req,timeout=15) as response:
                          data=response.read()
                          final=response.geturl()
                          status=response.status
                  except Exception as exc:
                      print("ISSUE15_FETCH_ERROR",ts,modifier,repr(exc))
                      continue

                  parser=P()
                  parser.feed(data.decode("latin-1","replace"))
                  parser.close()
                  print("ISSUE15_FETCH_OK",ts,modifier,status,len(data),repr(final),repr(" ".join(parser.title).strip()))
                  for href,text in parser.links:
                      low=(href+" "+text).lower()
                      if (
                          "sincronia" in low
                          or href.lower().endswith((".htm",".html"))
                      ):
                          print("ISSUE15_LINK",repr(href),repr(html.unescape(text)))
                  raise SystemExit(0)

          raise SystemExit("No issue-15 page could be recovered from sibling crawl timestamps")
          PY
