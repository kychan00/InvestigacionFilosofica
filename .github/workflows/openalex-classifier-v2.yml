name: Audit OpenAlex philosophy classifier v2

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb huggingface_hub

      - name: Run classifier v2
        run: |
          python scripts/openalex/sample_philosophy_classifier_v2.py

      - name: Upload classifier sample
        uses: actions/upload-artifact@v4
        with:
          name: openalex-philosophy-classifier-v2
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/openalex/philosophy-classifier-v2.parquet
