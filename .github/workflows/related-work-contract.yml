name: Related Works contract

on:
  push:
    paths:
      - "src/core/related-work-contract.js"
      - "tests/related-work-contract.test.mjs"
      - "benchmark/related-works/**"
      - "docs/RELATED_WORKS_*.md"
      - "docs/record-related-works-architecture-v1.md"
      - ".github/workflows/related-work-contract.yml"
  pull_request:
    paths:
      - "src/core/related-work-contract.js"
      - "tests/related-work-contract.test.mjs"
      - "benchmark/related-works/**"
      - "docs/RELATED_WORKS_*.md"
      - "docs/record-related-works-architecture-v1.md"
      - ".github/workflows/related-work-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Related Works V1 contract and fixtures
        run: node --test tests/related-work-contract.test.mjs
