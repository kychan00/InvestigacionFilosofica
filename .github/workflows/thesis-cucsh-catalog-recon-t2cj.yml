name: Thesis CUCSH catalog recon T2CJ

on:
  pull_request:
    paths:
      - "scripts/thesis/probe_cucsh_thesis_catalog_v1.py"
      - "tests/test_thesis_cucsh_catalog_recon_v1.py"
      - "docs/THESIS_CUCSH_CATALOG_RECON_T2CJ.md"
      - ".github/workflows/thesis-cucsh-catalog-recon-t2cj.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test reference-only catalog parser
        run: |
          python -m py_compile scripts/thesis/probe_cucsh_thesis_catalog_v1.py
          python -m unittest tests.test_thesis_cucsh_catalog_recon_v1 -v

      - name: Probe live CUCSH thesis catalog
        run: |
          rm -rf artifacts/t2cj
          mkdir -p artifacts/t2cj
          python scripts/thesis/probe_cucsh_thesis_catalog_v1.py \
            --output artifacts/t2cj/catalog-report.json

      - name: Enforce metadata-only recon artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          path=Path("artifacts/t2cj/catalog-report.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          assert data["schemaVersion"]=="thesis-cucsh-catalog-recon-v1"
          assert data["referenceOnly"] is True
          assert data["rawHtmlPersisted"] is False
          assert data["metrics"]["safeLinks"] > 0
          assert data["htmlBytes"] > 0

          allowed={"biblioteca.cucsh.udg.mx","www.biblioteca.cucsh.udg.mx"}
          forbidden=(".pdf","/bitstream","/download")
          for row in data["safeLinks"]:
              assert urlparse(row["url"]).hostname in allowed
              lower=row["url"].lower()
              assert not any(token in lower for token in forbidden), lower

          assert list(Path("artifacts/t2cj").rglob("*.html")) == []
          assert list(Path("artifacts/t2cj").rglob("*.pdf")) == []
          print(json.dumps(data["metrics"], ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-cucsh-catalog-recon-t2cj
          path: artifacts/t2cj/catalog-report.json
          if-no-files-found: error
          retention-days: 14
