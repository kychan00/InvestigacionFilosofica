name: Sincronía · attribute six Bolivian interviews to Kathy Leonard

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-six-leonard-interviews.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-six-leonard-bolivian-interviews
  cancel-in-progress: false

jobs:
  restore-six:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test interview collection source, interviewer role and frozen index
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_six_kathy_leonard_interviews
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore six interviewer credits only
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-leonard-six-before.json
          python3 -m scripts.cucsh.restore_sincronia_six_kathy_leonard_interviews \
            --input /tmp/sincronia-leonard-six-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit exact six changes and unmodified 1845-work bibliography
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-leonard-six-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-leonard-six-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-leonard-six-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_six_kathy_leonard_interviews import ENTRIES

          olddata=json.loads(Path("/tmp/sincronia-leonard-six-before.json").read_text(encoding="utf-8"))
          newdata=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in olddata["records"]}
          a={r["id"]:r for r in newdata["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==6 and set(changed)==set(ENTRIES),changed
          for rid in changed:
              old,new=b[rid],a[rid]
              source=ENTRIES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {f for f in set(old)|set(new)
                      if old.get(f)!=new.get(f)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":"Kathy Leonard","sourceName":"Kathy Leonard"}]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceArticleUrl"]==source["filename"].join([
                  "http://fuentes.csh.udg.mx/CUCSH/Sincronia/",""
              ])
              assert ev["sourceCaptureTimestamp"]==source["capture"]
              assert ev["sourceIntervieweeNotCoauthor"]==source["interviewee"]
              assert ev["creditedRole"]=="interviewer"
              assert ev["sourcePrintedAuthorOnThisPage"] is False
              assert ev["originalIndexedLabelIsIntervieweeNotByline"]
              assert ev["sourceLaterBookAuthor"]=="Kathy S. Leonard"
              assert ev["sourceLaterBookPublicationYear"]==2001
              assert ev["sourceAuthorCollectionIntroByline"]=="Introducción de Kathy Leonard"
              assert ev["matchedIndexedYear"]==1998
              assert ev["matchedIndexedIssue"]==7
              assert ev["publicationVersionCaveat"]
              assert ev["originalAvailabilityPreserved"]

          report=json.loads(Path("/tmp/sincronia-leonard-six-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==6
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==4
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==0
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_SIX_LEONARD_INTERVIEWS_VERIFIED",len(changed),6)
          PY
      - name: Full application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified bibliography JSON to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Attribute six Bolivian Sincronía interviews to Kathy Leonard with full provenance"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and remaining byline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-leonard-six-interviews
          path: |
            /tmp/sincronia-leonard-six-history.json
            /tmp/sincronia-leonard-six-pending.json
          retention-days: 30
          if-no-files-found: warn
