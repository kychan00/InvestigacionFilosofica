name: Sincronía · restore Reyes Sigala Torres Pires signed originals

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-four-issue11-13.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-four-issue11-13-primary
  cancel-in-progress: false

jobs:
  restore-four:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test original bylines and immutable legacy work identities
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_reyes_sigala_torres_pires
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly four original signed bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-four-11-13-before.json
          python3 -m scripts.cucsh.restore_sincronia_reyes_sigala_torres_pires \
            --input /tmp/sincronia-four-11-13-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate no losses, four author-only changes and source-specific caveats
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-four-11-13-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-11-13-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-11-13-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_reyes_sigala_torres_pires import SOURCES

          original=json.loads(Path("/tmp/sincronia-four-11-13-before.json").read_text(encoding="utf-8"))
          modified=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={r["id"]:r for r in original["records"]}
          after={r["id"]:r for r in modified["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[rid for rid in before if before[rid]!=after[rid]]
          assert len(changed)==4 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=before[rid],after[rid]
              source=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new) if old.get(k)!=new.get(k)}=={
                  "authors","legacyAuthorEvidence"
              }
              assert new["authors"]==[{"name":source["author"],"sourceName":source["author"]}]
              evidence=new["legacyAuthorEvidence"]
              assert evidence["sourceUrl"]==source["snapshot"]
              assert evidence["sourceArticleUrl"]==source["url"]
              assert evidence["sourcePrintedByline"]==source["printedByline"]
              assert evidence["sourceArticleTitle"]==source["sourceArticleTitle"]
              assert evidence["matchedIndexedIssue"]==source["issue"]
              assert evidence["matchedIndexedYear"]==source["year"]
              assert evidence["originalAvailabilityPreserved"]
              assert evidence["titleIdentityCaveat"]
          report=json.loads(Path("/tmp/sincronia-four-11-13-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==32
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==30
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FOUR_ISSUE11_13_SIGNED_PASS",len(changed),32)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified source corpus change to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected changes in worktree"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore signed Reyes, Sigala, Torres and Pires Sincronía bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload corpus quality and pending byline audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-four-issue11-13
          path: |
            /tmp/sincronia-four-11-13-history.json
            /tmp/sincronia-four-11-13-pending.json
          retention-days: 30
          if-no-files-found: warn
