name: Thesis MEF program resolution T2DB\n\non:\n  pull_request:\n    paths:\n      - "scripts/thesis/config/mef-program-resolution-t2db.json"\n      - "scripts/thesis/validate_mef_program_resolution_t2db.py"\n      - "scripts/thesis/config/mef-post-aleph-corroboration-t2da.json"\n      - "tests/test_thesis_mef_program_resolution_t2db.py"\n      - "docs/THESIS_MEF_PROGRAM_RESOLUTION_T2DB.md"\n      - ".github/workflows/thesis-mef-program-resolution-t2db.yml"\n\npermissions:\n  contents: read\n\njobs:\n  validate-ledger:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v6\n      - uses: actions/setup-python@v6\n        with:\n          python-version: "3.13"\n\n      - name: Validate MEF programme authority resolution\n        run: |\n          python -m py_compile scripts/thesis/validate_mef_program_resolution_t2db.py\n          python -m unittest tests.test_thesis_mef_program_resolution_t2db -v\n          python scripts/thesis/validate_mef_program_resolution_t2db.py \\n            --input scripts/thesis/config/mef-program-resolution-t2db.json \\n            --t2da scripts/thesis/config/mef-post-aleph-corroboration-t2da.json\n