name: Sincronía · restore signed Mandell Aguayo Zinser issue four

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-three-issue4-primary.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-three-original-issue4-signed
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify three exact original signatures and book-review role
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_three_issue4_primary
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three signed issue-four authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-three-issue4-before.json
          python3 -m scripts.cucsh.restore_sincronia_three_issue4_primary \
            --input /tmp/sincronia-three-issue4-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate immutable source fields, zero loss and 13-author queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-three-issue4-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-issue4-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-issue4-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_three_issue4_primary import SOURCES

          olddata=json.loads(Path("/tmp/sincronia-three-issue4-before.json").read_text(encoding="utf-8"))
          newdata=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in olddata["records"]}
          a={r["id"]:r for r in newdata["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          modified=[rid for rid in b if b[rid]!=a[rid]]
          assert len(modified)==3 and set(modified)==set(SOURCES),modified
          for rid in modified:
              before,after=b[rid],a[rid]
              source=SOURCES[rid]
              assert before["journal"]==after["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert before[field]==after[field],(rid,field)
              assert before.get("legacyTitleEncodingEvidence")==after.get("legacyTitleEncodingEvidence")
              assert {k for k in set(before)|set(after)
                      if before.get(k)!=after.get(k)}=={"authors","legacyAuthorEvidence"}
              assert after["authors"]==[{"name":source["author"],"sourceName":source["author"]}]
              ev=after["legacyAuthorEvidence"]
              assert ev["sourceUrl"]==source["snapshot"]
              assert ev["sourceArticleUrl"]==source["url"]
              assert ev["sourcePrintedByline"]==source["printedByline"]
              assert ev["sourceArticleTitle"]==source["sourceArticleTitle"]
              assert ev["matchedIndexedIssue"]==source["issue"]
              assert ev["matchedIndexedYear"]==source["year"]
              assert ev["originalAvailabilityPreserved"]
              assert ev["sourceEditionCaveat"]

          mandell=a["cucsh:sincronia-legacy:2126d56c91012923e100"]
          assert mandell["authors"]==[{"name":"Daniel Mandell","sourceName":"Daniel Mandell"}]
          assert mandell["legacyAuthorEvidence"]["reviewedBookAuthorNotReviewer"]=="Gregory H. Nobles"
          assert mandell["year"]==1997
          assert mandell["legacyAuthorEvidence"]["sourceOriginalEmailDate"]=="1998-01-09"

          report=json.loads(Path("/tmp/sincronia-three-issue4-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==13
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==11
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==0
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_THREE_SIGNED_ISSUE4_PASS",len(modified),13)
          PY
      - name: Run complete app regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to original feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree files"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore signed Mandell Aguayo and Zinser issue-four Sincronía works"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and remaining author audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-three-original-issue4
          path: |
            /tmp/sincronia-three-issue4-history.json
            /tmp/sincronia-three-issue4-pending.json
          retention-days: 30
          if-no-files-found: warn
