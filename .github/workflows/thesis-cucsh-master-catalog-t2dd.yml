name: Thesis CUCSH master catalog T2DD

on:
  pull_request:
    paths:
      - "scripts/thesis/scan_cucsh_master_catalog_mef_targets_t2dd.py"
      - "scripts/thesis/recover_cucsh_philosophy_masters_t2cv.py"
      - "scripts/thesis/probe_cucsh_thesis_catalog_v1.py"
      - "scripts/thesis/config/mef-program-resolution-t2db.json"
      - "tests/test_thesis_cucsh_master_catalog_t2dd.py"
      - "docs/THESIS_CUCSH_MASTER_CATALOG_T2DD.md"
      - ".github/workflows/thesis-cucsh-master-catalog-t2dd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-cucsh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test CUCSH catalogue guards
        run: |
          python -m py_compile scripts/thesis/scan_cucsh_master_catalog_mef_targets_t2dd.py
          python -m unittest tests.test_thesis_cucsh_master_catalog_t2dd -v

      - name: Scan complete CUCSH master catalogue
        run: |
          mkdir -p artifacts/t2dd
          python scripts/thesis/scan_cucsh_master_catalog_mef_targets_t2dd.py \
            --input scripts/thesis/config/mef-program-resolution-t2db.json \
            --output artifacts/t2dd/mef-cucsh-master-catalog-resolution-t2dd.json \
            --delay 0.03 \
            --max-pages 320
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("artifacts/t2dd/mef-cucsh-master-catalog-resolution-t2dd.json")
          data=json.loads(path.read_text(encoding="utf-8"))

          assert data["schemaVersion"]=="thesis-mef-cucsh-master-catalog-resolution-t2dd-v1"
          assert data["referenceOnly"] is True
          assert data["rawHtmlPersisted"] is False
          assert data["downloadsThesisFiles"] is False
          assert data["catalogReferenceDoesNotEqualPhysicalHolding"] is True
          assert data["negativeResultMeansNonexistence"] is False
          assert data["scan"]["completed"] is True
          assert data["metrics"]["targets"]==2
          assert data["metrics"]["physicalHoldingsConfirmed"]==0
          assert data["metrics"]["publicRecordsAdded"]==0

          print(json.dumps({
              "scan": data["scan"],
              "metrics": data["metrics"],
              "results": [
                  {
                      "author": row["author"],
                      "status": row["status"],
                      "programConflict": row["programConflict"],
                      "exact": len(row["exactTitleAuthor"]),
                      "titleOnly": len(row["titleOnly"]),
                      "authorOnly": len(row["authorOnly"]),
                  }
                  for row in data["results"]
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload reference-only CUCSH catalogue resolution
        uses: actions/upload-artifact@v4
        with:
          name: thesis-cucsh-master-catalog-t2dd
          path: artifacts/t2dd/mef-cucsh-master-catalog-resolution-t2dd.json
          if-no-files-found: error
          retention-days: 14
