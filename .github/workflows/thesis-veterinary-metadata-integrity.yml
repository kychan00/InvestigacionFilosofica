name: Thesis veterinary metadata integrity

on:
  pull_request:
    paths:
      - "scripts/thesis/audit_program_metadata_integrity_v2.py"
      - "scripts/thesis/build_program_metadata_conflict_registry_v1.py"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/audit_program_metadata_evidence_confidence_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/program-metadata-evidence-confidence-v1.json"
      - "scripts/thesis/config/program-metadata-evidence-confidence-baseline-v1.json"
      - "scripts/thesis/config/veterinary-program-metadata-integrity-baseline-v1.json"
      - "scripts/thesis/config/veterinary-program-metadata-conflict-registry-baseline-v1.json"
      - "scripts/thesis/config/veterinary-program-alias-integrity-baseline-v1.json"
      - "scripts/thesis/config/veterinary-program-authority-v26-baseline-v1.json"
      - "tests/test_thesis_veterinary_metadata_conflict_protection.py"
      - "tests/test_thesis_program_metadata_conflict_registry.py"
      - "tests/test_thesis_program_metadata_evidence_confidence.py"
      - "tests/test_thesis_veterinary_program_authority_v26.py"
      - "docs/THESIS_PROGRAM_METADATA_INTEGRITY_VETERINARY_V3.md"
      - "docs/THESIS_PROGRAM_AUTHORITY_VETERINARY_V26.md"
      - ".github/workflows/thesis-veterinary-metadata-integrity.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile
        run: |
          python -m py_compile \
            scripts/thesis/build_canonical_corpus_v1.py \
            scripts/thesis/audit_program_metadata_integrity_v2.py \
            scripts/thesis/build_program_metadata_conflict_registry_v1.py \
            scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            scripts/thesis/build_program_curation_queue_v1.py \
            scripts/thesis/audit_program_metadata_evidence_confidence_v1.py \
            scripts/thesis/audit_program_coverage_v1.py

      - name: Unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_thesis_veterinary_metadata_conflict_protection.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_metadata_conflict_registry.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_metadata_evidence_confidence.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_veterinary_program_authority_v26.py" \
            -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-veterinary-metadata
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-veterinary-metadata
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Build four veterinary integrity audits
        run: |
          python scripts/thesis/audit_program_metadata_integrity_v2.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --program-key "licenciatura en medicina veterinaria zootecnista" \
            --legacy-accession-day "2015-09-09" \
            --output-dir artifacts/thesis-veterinary-metadata/primary

          python scripts/thesis/audit_program_metadata_integrity_v2.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --program-key "licenciatura en medico veterinario y zootecnista" \
            --legacy-accession-day "2015-09-09" \
            --output-dir artifacts/thesis-veterinary-metadata/medico-veterinario

          python scripts/thesis/audit_program_metadata_integrity_v2.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --program-key "licenciatura en veterinario y zootecnista" \
            --legacy-accession-day "2015-09-09" \
            --output-dir artifacts/thesis-veterinary-metadata/veterinario

          python scripts/thesis/audit_program_metadata_integrity_v2.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --program-key "licenciatura en medicina veterinaria y zootecnia" \
            --output-dir artifacts/thesis-veterinary-metadata/medicina-veterinaria-zootecnia

      - name: Validate veterinary integrity baselines
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-veterinary-metadata")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "veterinary-program-alias-integrity-baseline-v1.json"
              ).read_text()
          )
          primary_baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "veterinary-program-metadata-integrity-baseline-v1.json"
              ).read_text()
          )

          dirs = {
              "licenciatura en medicina veterinaria zootecnista": "primary",
              "licenciatura en medico veterinario y zootecnista": "medico-veterinario",
              "licenciatura en veterinario y zootecnista": "veterinario",
              "licenciatura en medicina veterinaria y zootecnia": "medicina-veterinaria-zootecnia",
          }

          reports = {}
          for key, dirname in dirs.items():
              report = json.loads(
                  (
                      root
                      / dirname
                      / "program-metadata-integrity-audit.json"
                  ).read_text()
              )
              reports[key] = report

              assert (
                  report["schemaVersion"]
                  == "thesis-program-metadata-integrity-audit-v2"
              )
              assert (
                  report["decisionConstraint"]
                  == baseline["decisionConstraint"]
              )
              assert report["targetProgramKey"] == key
              assert report["authorityDecision"] == "hold"

              expected = baseline["groups"][key]
              metrics = report["metrics"]

              for scalar in [
                  "observedWorks",
                  "sourceProgramAgreementWorks",
                  "sourceProgramDisagreementWorks",
                  "exactTitleCrossProgramConflictWorks",
                  "exactTitleAuthorCrossProgramConflictWorks",
                  "structuralConflictWorks",
                  "warningOnlyWorks",
                  "noDetectedConflictWorks",
              ]:
                  assert metrics[scalar] == expected[scalar], (
                      key,
                      scalar,
                      metrics[scalar],
                      expected[scalar],
                  )

              assert metrics["observedUnits"] == expected["observedUnits"]
              assert metrics["validYearSpan"] == expected["validYearSpan"]
              assert metrics["accessionDays"] == expected["accessionDays"]
              assert (
                  metrics["sourceFieldPresence"]
                  == expected["sourceFieldPresence"]
              )

          primary = reports[
              "licenciatura en medicina veterinaria zootecnista"
          ]
          assert primary["conclusion"] == primary_baseline["expectedConclusion"]
          assert (
              primary["metrics"]["structuralConflictProgramKeys"]
              == primary_baseline[
                  "expectedStructuralConflictProgramKeys"
              ]
          )
          assert (
              primary["cohortAnalysis"]["legacy"]
              == primary_baseline["expectedLegacyCohort"]
          )
          assert (
              primary["cohortAnalysis"]["other"]
              == primary_baseline["expectedOtherCohort"]
          )
          assert (
              primary["cohortAnalysis"]["concentration"]
              == primary_baseline["requiredConcentration"]
          )

          aggregate_works = sum(
              report["metrics"]["observedWorks"]
              for report in reports.values()
          )
          aggregate_structural = sum(
              report["metrics"]["structuralConflictWorks"]
              for report in reports.values()
          )
          assert aggregate_works == baseline["aggregate"]["observedWorks"]
          assert (
              aggregate_structural
              == baseline["aggregate"]["structuralConflictWorks"]
          )

          print(json.dumps({
              "aggregateWorks": aggregate_works,
              "aggregateStructuralConflicts": aggregate_structural,
              "groups": {
                  key: report["metrics"]
                  for key, report in reports.items()
              },
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build veterinary item-level conflict registry
        run: |
          python scripts/thesis/build_program_metadata_conflict_registry_v1.py \
            --integrity-audit artifacts/thesis-veterinary-metadata/primary/program-metadata-integrity-audit.json \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-dir artifacts/thesis-veterinary-metadata/conflict-registry

      - name: Validate veterinary conflict registry baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path(
                  "artifacts/thesis-veterinary-metadata/"
                  "conflict-registry/"
                  "program-metadata-conflict-registry.json"
              ).read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "veterinary-program-metadata-conflict-registry-baseline-v1.json"
              ).read_text()
          )

          assert registry["decisionConstraint"] == baseline["decisionConstraint"]
          assert registry["authorityDecision"] == baseline["authorityDecision"]
          assert registry["metrics"] == baseline["expectedMetrics"]

          actual_pairs = {
              pair["pairId"]: {
                  "pairId": pair["pairId"],
                  "targetProviderRecordId": pair["target"]["providerRecordId"],
                  "targetHandle": pair["target"]["handle"],
                  "alternateProviderRecordId": pair["alternate"]["providerRecordId"],
                  "alternateHandle": pair["alternate"]["handle"],
                  "alternateProgramKey": pair["alternate"]["programKey"],
              }
              for pair in registry["pairs"]
          }
          expected_pairs = {
              pair["pairId"]: pair
              for pair in baseline["expectedPairs"]
          }
          assert actual_pairs == expected_pairs

          print(json.dumps({
              "metrics": registry["metrics"],
              "pairs": registry["pairs"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Reproject Metadata Confidence V3 on frozen full baseline
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-veterinary-metadata/canonical-reprojected.json \
            --output-report artifacts/thesis-veterinary-metadata/reprojection-report.json

          python scripts/thesis/build_program_curation_queue_v1.py \
            --observed-authorities /tmp/thesis-full-baseline/observed-authorities.json \
            --canonical-corpus artifacts/thesis-veterinary-metadata/canonical-reprojected.json \
            --output-dir artifacts/thesis-veterinary-metadata/queue \
            --top 30

          python scripts/thesis/audit_program_metadata_evidence_confidence_v1.py \
            --canonical-corpus artifacts/thesis-veterinary-metadata/canonical-reprojected.json \
            --queue artifacts/thesis-veterinary-metadata/queue/program-curation-queue.json \
            --output-dir artifacts/thesis-veterinary-metadata/confidence-audit

      - name: Validate frozen full Metadata Confidence V3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-veterinary-metadata")
          report = json.loads(
              (
                  root
                  / "confidence-audit"
                  / "program-metadata-confidence-audit.json"
              ).read_text()
          )
          reprojection = json.loads(
              (root / "reprojection-report.json").read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "program-metadata-evidence-confidence-baseline-v1.json"
              ).read_text()
          )
          registry = json.loads(
              Path(
                  "scripts/thesis/config/program-authority-v1.json"
              ).read_text()
          )

          assert registry["registryRevision"] == "2026-11-02.v30"
          assert reprojection["metrics"]["works"] == 27576
          assert reprojection["metrics"]["multiSourceWorks"] == 0
          assert (
              report["programMetadataEvidenceRevision"]
              == baseline["policyRevision"]
              == "2026-11-02.v4"
          )
          assert (
              report["metrics"]["confidenceStates"]
              == baseline["expectedConfidenceStates"]
          )
          assert (
              report["metrics"]["authorityApplicability"]
              == baseline["expectedAuthorityApplicability"]
          )

          for rule_id, expected in baseline["expectedRules"].items():
              assert (
                  report["metrics"]["ruleMatches"].get(rule_id, 0)
                  == expected["matchedWorks"]
              )

          queue_rows = {
              row["normalizedKey"]: row
              for row in report["metadataReviewQueueItems"]
          }
          for key, expected in (
              baseline["expectedMetadataReviewPrograms"].items()
          ):
              row = queue_rows[key]
              evidence = row["programMetadataEvidence"]
              assert row["queueState"] == expected["queueState"]
              assert row["curationLane"] == expected["curationLane"]
              assert evidence["blockedWorks"] == expected["blockedWorks"]
              assert (
                  evidence["confidenceStates"]
                  == expected["confidenceStates"]
              )
              assert (
                  evidence["authorityApplicability"]
                  == expected["authorityApplicability"]
              )

          assert report["metrics"]["violations"] == 0
          assert report["violations"] == []

          print(json.dumps({
              "registryRevision": registry["registryRevision"],
              "reprojection": reprojection["metrics"],
              "confidence": report["metrics"],
              "metadataReviewQueueItems": report[
                  "metadataReviewQueueItems"
              ],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Reproject Veterinary Program Authority V26 over frozen full baseline
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")

          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-veterinary-metadata")
          corpus = json.loads(
              (root / "canonical-reprojected.json").read_text()
          )
          observed = json.loads(
              Path(
                  "/tmp/thesis-full-baseline/observed-authorities.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          program_ref = "program:udg:lic-medicina-veterinaria-zootecnia"
          selected = [
              work
              for work in projected["works"]
              if work.get("programRef") == program_ref
          ]

          by_raw = {}
          for work in selected:
              key = canonical.normalize_key(work.get("programRaw"))
              row = by_raw.setdefault(
                  key,
                  {
                      "works": 0,
                      "blockedWorks": 0,
                      "authorityApplicableWorks": 0,
                      "projectedAdmissionStatuses": Counter(),
                  },
              )
              row["works"] += 1
              evidence = work.get("programMetadataEvidence") or {}
              if evidence.get("authorityApplicability") == "blocked":
                  row["blockedWorks"] += 1
              else:
                  row["authorityApplicableWorks"] += 1
              row["projectedAdmissionStatuses"][
                  work.get("admissionStatus") or "unknown"
              ] += 1

          serial_by_raw = {
              key: {
                  **row,
                  "projectedAdmissionStatuses": dict(
                      row["projectedAdmissionStatuses"].most_common()
                  ),
              }
              for key, row in by_raw.items()
          }

          statuses = Counter(
              work.get("admissionStatus") or "unknown"
              for work in selected
          )
          blocked = sum(
              1
              for work in selected
              if (
                  (work.get("programMetadataEvidence") or {}).get(
                      "authorityApplicability"
                  )
                  == "blocked"
              )
          )

          held_key = "licenciatura en veterinario y zootecnista"
          held = [
              work
              for work in projected["works"]
              if canonical.normalize_key(work.get("programRaw")) == held_key
          ]
          held_statuses = Counter(
              work.get("admissionStatus") or "unknown"
              for work in held
          )
          held_program_refs = Counter(
              work.get("programRef") or "<null>"
              for work in held
          )

          queue_rows = {
              item["normalizedKey"]: item
              for item in queue["items"]
          }

          payload = {
              "registryRevision": registry["registryRevision"],
              "programRef": program_ref,
              "observedWorks": len(selected),
              "blockedWorks": blocked,
              "authorityApplicableWorks": len(selected) - blocked,
              "projectedAdmissionStatuses": dict(statuses.most_common()),
              "rawGroups": serial_by_raw,
              "queueItems": {
                  key: queue_rows.get(key)
                  for key in [
                      "licenciatura en medicina veterinaria zootecnista",
                      "licenciatura en medico veterinario y zootecnista",
                      "licenciatura en medicina veterinaria y zootecnia",
                      held_key,
                  ]
              },
              "heldGroup": {
                  "normalizedKey": held_key,
                  "works": len(held),
                  "programRefs": dict(held_program_refs.most_common()),
                  "projectedAdmissionStatuses": dict(
                      held_statuses.most_common()
                  ),
              },
              "programRefWorks": projection["programRefWorks"].get(
                  program_ref,
                  0,
              ),
              "gateBlockers": [
                  item
                  for item in projection["gateBlockers"]
                  if item.get("programRef") == program_ref
              ],
              "globalProjectedAdmission": projection["projectedAdmission"],
          }

          Path(
              "artifacts/thesis-veterinary-metadata/"
              "v26-authority-reprojection.json"
          ).write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

      - name: Validate frozen full Veterinary Program Authority V26 baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "veterinary-program-authority-v26-baseline-v1.json"
              ).read_text()
          )
          report = json.loads(
              Path(
                  "artifacts/thesis-veterinary-metadata/"
                  "v26-authority-reprojection.json"
              ).read_text()
          )
          expected = baseline["expectedFull"]

          assert baseline["registryRevision"] == "2026-11-02.v26"
          assert report["registryRevision"] == "2026-11-02.v30"
          assert report["programRef"] == baseline["programRef"]
          assert report["observedWorks"] == expected["observedWorks"]
          assert report["blockedWorks"] == expected["blockedWorks"]
          assert (
              report["authorityApplicableWorks"]
              == expected["authorityApplicableWorks"]
          )
          assert (
              report["projectedAdmissionStatuses"]
              == expected["projectedAdmissionStatuses"]
          )
          assert report["programRefWorks"] == expected["observedWorks"]
          assert expected["globalProjectedAdmission"] == {
              "include": 428,
              "review": 832,
              "quarantine": 22310,
              "exclude": 4004,
              "reject-source": 2,
          }
          # The V26 baseline stays frozen; active V30 additionally
          # applies Civil Engineering V28, Communication V29, and resolves
          # the DELL Lingüística Aplicada orientation in V30.
          assert report["globalProjectedAdmission"] == {
              "include": 429,
              "review": 764,
              "quarantine": 18964,
              "exclude": 7417,
              "reject-source": 2,
          }

          for key, group_expected in expected["rawGroups"].items():
              actual = report["rawGroups"][key]
              assert actual["works"] == group_expected["works"]
              assert (
                  actual["blockedWorks"]
                  == group_expected["blockedWorks"]
              )
              assert (
                  actual["authorityApplicableWorks"]
                  == group_expected["authorityApplicableWorks"]
              )
              assert (
                  actual["projectedAdmissionStatuses"]
                  == group_expected["projectedAdmissionStatuses"]
              )

          primary_key = "licenciatura en medicina veterinaria zootecnista"
          primary = report["queueItems"][primary_key]
          primary_expected = expected["rawGroups"][primary_key]
          assert primary is not None
          assert primary["queueState"] == primary_expected["queueState"]
          assert (
              primary["curationLane"]
              == primary_expected["curationLane"]
          )
          assert primary["authority"]["id"] == baseline["programRef"]
          assert primary["authority"]["admissionState"] == "exclude"
          assert (
              primary["programMetadataEvidence"]["blockedWorks"]
              == primary_expected["blockedWorks"]
          )

          for key in [
              "licenciatura en medico veterinario y zootecnista",
              "licenciatura en medicina veterinaria y zootecnia",
          ]:
              assert (
                  report["queueItems"][key] is not None
              ) == expected["rawGroups"][key][
                  "expectedQueuePresenceAfterProjection"
              ]

          held_expected = expected["heldUnresolvedGroup"]
          held = report["heldGroup"]
          assert held["normalizedKey"] == held_expected["normalizedKey"]
          assert held["works"] == held_expected["works"]
          assert held["programRefs"] == {"<null>": held_expected["works"]}
          assert (
              held["projectedAdmissionStatuses"]
              == held_expected["projectedAdmissionStatuses"]
          )

          held_queue = report["queueItems"][held_expected["normalizedKey"]]
          assert held_queue is not None
          assert held_queue["queueState"] == held_expected["queueState"]
          assert held_queue["authority"] is None

          assert len(report["gateBlockers"]) == expected["blockedWorks"]
          assert all(
              item["projectedAdmissionStatus"] == "quarantine"
              for item in report["gateBlockers"]
          )
          assert all(
              item["programAdmissionState"] == "exclude"
              for item in report["gateBlockers"]
          )

          print(json.dumps({
              "baseline": "closed",
              "authority": report,
          }, indent=2, ensure_ascii=False))
          PY

      - name: Upload veterinary audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-veterinary-metadata-integrity-v3
          path: artifacts/thesis-veterinary-metadata/
          if-no-files-found: error
          retention-days: 14
