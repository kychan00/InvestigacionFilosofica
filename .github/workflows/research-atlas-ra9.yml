name: Research Atlas RA9 · main search integration

on:
  pull_request:
    paths:
      - "index.html"
      - "js/app.js"
      - "js/research-atlas-embed.js"
      - "js/research-atlas-flow.js"
      - "css/research-atlas-embed.css"
      - "css/research-atlas-flow.css"
      - "src/core/research-atlas-view.js"
      - "tests/research-atlas-main-integration.test.mjs"
      - "scripts/qa/research-atlas-main-smoke.mjs"
      - "scripts/qa/research-atlas-main-hegel-smoke.mjs"
      - "scripts/qa/research-atlas-main-dinora-smoke.mjs"
      - "scripts/qa/research-atlas-main-load-more-smoke.mjs"
      - "docs/RESEARCH_ATLAS_MAIN_INTEGRATION_RA9.md"
      - "docs/RESEARCH_ATLAS_REACT_FLOW_TEMPORAL.md"
      - ".github/workflows/research-atlas-ra9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-search-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Validate RA9 integration contract
        run: |
          node --check js/research-atlas-flow.js
          node --check js/research-atlas-embed.js
          node --test tests/research-atlas-main-integration.test.mjs

      - name: Validate Research Atlas RA1 through RA8
        run: |
          node --test tests/research-atlas-contract.test.mjs
          node --test tests/research-atlas-assembler.test.mjs
          node --test tests/research-atlas-authority.test.mjs
          node --test tests/research-atlas-related.test.mjs
          node --test tests/research-atlas-layout.test.mjs
          node --test tests/research-atlas-view.test.mjs
          node --test tests/research-atlas-lexical.test.mjs
          node --test tests/research-atlas-live.test.mjs
          node --test tests/research-atlas-page.test.mjs
          node --test tests/research-atlas-product-gate.test.mjs

      - name: Install browser smoke tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build local browser dependencies
        run: npm run build:duckdb

      - name: Serve the site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/research-atlas-ra9-http.log 2>&1 &
          echo $! > /tmp/research-atlas-ra9-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/research-atlas-ra9-http.log
          exit 1

      - name: Verify Results Atlas shared-response toggle
        run: node scripts/qa/research-atlas-main-smoke.mjs

      - name: Verify real Hegel Qwen author focus and links
        run: node scripts/qa/research-atlas-main-hegel-smoke.mjs

      - name: Verify generic Dinora author focus from result authors
        run: node scripts/qa/research-atlas-main-dinora-smoke.mjs

      - name: Verify load-more waits for expanded Qwen topology
        run: node scripts/qa/research-atlas-main-load-more-smoke.mjs

      - name: Run complete regression suite
        run: npm test

      - name: Upload RA9 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-atlas-ra9-main-search
          path: artifacts/research-atlas-ra9/
          if-no-files-found: ignore
