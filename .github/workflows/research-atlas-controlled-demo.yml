name: Research Atlas · controlled demo

on:
  pull_request:
    paths:
      - "research-atlas.html"
      - "js/research-atlas.js"
      - "css/research-atlas.css"
      - "benchmark/research-atlas/v3/authority-fixture.json"
      - "benchmark/research-atlas/v4/related-work-fixture.json"
      - "tests/research-atlas-controlled-demo.test.mjs"
      - "scripts/qa/research-atlas-controlled-demo-smoke.mjs"
      - ".github/workflows/research-atlas-controlled-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Validate controlled demo graph
        run: node --test tests/research-atlas-controlled-demo.test.mjs

      - name: Install browser smoke tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build local browser dependencies
        run: npm run build:duckdb

      - name: Serve the site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/research-atlas-demo-http.log 2>&1 &
          echo $! > /tmp/research-atlas-demo-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/research-atlas.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/research-atlas-demo-http.log
          exit 1

      - name: Verify controlled demo on phone tablet desktop
        run: node scripts/qa/research-atlas-controlled-demo-smoke.mjs

      - name: Run complete regression suite
        run: npm test

      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-atlas-controlled-demo
          path: artifacts/research-atlas-controlled-demo/
          if-no-files-found: ignore
