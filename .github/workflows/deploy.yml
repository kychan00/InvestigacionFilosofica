name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  deploy:
    needs:
      - test

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build DuckDB browser assets
        run: npm run build:duckdb

      - name: Build and audit Qwen3 browser assets
        run: npm run build:qwen3-browser

      - name: Prepare site
        run: |
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.venv-hf/' \
            --exclude 'artifacts/' \
            --exclude '_site/'

      - name: Attach remote author indexes when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data/authors

          for version in author-index-v1 author-index-v2; do
            if gh release view "${version}" >/dev/null 2>&1; then
              mkdir -p "/tmp/${version}"

              gh release download "${version}" \
                --pattern "${version}.tar.gz*" \
                --dir "/tmp/${version}"

              cd "/tmp/${version}"
              shasum -a 256 -c "${version}.tar.gz.sha256"
              tar -xzf "${version}.tar.gz" \
                -C "${GITHUB_WORKSPACE}/_site/data/authors"
            else
              echo "Remote ${version} has not been published yet."
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
