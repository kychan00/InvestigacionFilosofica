name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  thesis-corpus-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate V2 release tooling
        run: |
          python -m py_compile \
            scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py \
            scripts/thesis/build_effective_corpus_release_manifest_v2.py
          python -m unittest \
            tests/test_thesis_effective_corpus_v2_candidate_t2cf.py -v
          python -m unittest \
            tests/test_thesis_effective_corpus_release_t2cg.py -v

      - name: Fetch and verify immutable Effective Corpus V1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2cg-base artifacts/t2cg
          mkdir -p /tmp/t2cg-base artifacts/t2cg
          gh release download thesis-effective-corpus-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/t2cg-base

          python scripts/thesis/build_effective_corpus_release_manifest_v1.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2bz-v1.json \
            --release-dir /tmp/t2cg-base \
            --root-release-manifest /dev/null 2>/dev/null || \
          python scripts/thesis/build_effective_corpus_release_manifest_v1.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2bz-v1.json \
            --release-dir /tmp/t2cg-base

      - name: Recompose exact Effective Corpus V2
        run: |
          python scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py \
            --base /tmp/t2cg-base/effective-corpus.json.gz \
            --contract scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json \
            --registry scripts/thesis/config/program-authority-v1.json \
            --output-corpus artifacts/t2cg/effective-corpus.json \
            --output-gzip artifacts/t2cg/effective-corpus.json.gz \
            --output-report artifacts/t2cg/effective-corpus-report.json \
            --output-json-sha artifacts/t2cg/effective-corpus.json.sha256 \
            --output-gzip-sha artifacts/t2cg/effective-corpus.json.gz.sha256

          echo "f8792c73471f2a54bb4ec8b38d41f4b366b16caedb4a29286f704e85c8038e13  artifacts/t2cg/effective-corpus.json" | sha256sum -c -
          echo "f3a162b8de5fe371898dcf60afbf2b6383b444d56bd5709a3d4634e813255b01  artifacts/t2cg/effective-corpus.json.gz" | sha256sum -c -

      - name: Build immutable V2 release manifest
        run: |
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            build-manifest \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --corpus-json artifacts/t2cg/effective-corpus.json \
            --corpus-gzip artifacts/t2cg/effective-corpus.json.gz \
            --report artifacts/t2cg/effective-corpus-report.json \
            --repository "${GITHUB_REPOSITORY}" \
            --generated-from-sha "${GITHUB_SHA}" \
            --workflow-run "${GITHUB_RUN_ID}" \
            --created-at "${CREATED_AT}" \
            --output-manifest artifacts/t2cg/manifest.json \
            --output-json-sha artifacts/t2cg/effective-corpus.json.sha256 \
            --output-gzip-sha artifacts/t2cg/effective-corpus.json.gz.sha256

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --release-dir artifacts/t2cg \
            --root-release-manifest release-manifest.json

      - name: Publish or verify immutable Effective Corpus V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=thesis-effective-corpus-v2
          TITLE="Thesis effective corpus v2 · T2CG"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Immutable thesis release ${TAG} already exists; verifying instead of overwriting."
          else
            gh release create "${TAG}" \
              artifacts/t2cg/effective-corpus.json.gz \
              artifacts/t2cg/effective-corpus.json.sha256 \
              artifacts/t2cg/effective-corpus.json.gz.sha256 \
              artifacts/t2cg/effective-corpus-report.json \
              artifacts/t2cg/manifest.json \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "Immutable T2CG release of the UdeG Humanities effective thesis corpus V2. Reconstructed from immutable V1 plus the independently approved T2CC/T2CE/T2CF lineage; reference-only and fail-closed."
          fi

          rm -rf /tmp/t2cg-published
          mkdir -p /tmp/t2cg-published
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/t2cg-published

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --release-dir /tmp/t2cg-published \
            --root-release-manifest release-manifest.json

      - name: Upload V2 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: thesis-effective-corpus-release-v2-main
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/t2cg/effective-corpus.json.gz
            artifacts/t2cg/effective-corpus.json.sha256
            artifacts/t2cg/effective-corpus.json.gz.sha256
            artifacts/t2cg/effective-corpus-report.json
            artifacts/t2cg/manifest.json


  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python for thesis Atlas
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frozen Atlas numeric stack
        run: python -m pip install -r scripts/thesis/requirements-atlas-v1.txt

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  deploy:
    needs:
      - thesis-corpus-release
      - test

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python for thesis Atlas
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frozen Atlas numeric stack
        run: python -m pip install -r scripts/thesis/requirements-atlas-v1.txt

      - name: Install dependencies
        run: npm ci

      - name: Build DuckDB browser assets
        run: npm run build:duckdb

      - name: Build and audit Qwen3 browser assets
        run: npm run build:qwen3-browser

      - name: Prepare site
        run: |
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.venv-hf/' \
            --exclude 'artifacts/' \
            --exclude '_site/'

      - name: Attach remote author indexes when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data/authors

          for version in author-index-v1 author-index-v2 author-index-v3; do
            if gh release view "${version}" \
              --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1; then
              mkdir -p "/tmp/${version}"

              gh release download "${version}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${version}.tar.gz*" \
                --dir "/tmp/${version}"

              cd "/tmp/${version}"
              shasum -a 256 -c "${version}.tar.gz.sha256"
              # v3 uses the existing author-index-v2 directory format.
              # Replace old shards as one atomic staged copy so legacy
              # alias buckets cannot remain next to updated metadata.
              if [ "${version}" = "author-index-v3" ]; then
                mkdir -p "/tmp/${version}/extracted"
                tar -xzf "${version}.tar.gz" \
                  -C "/tmp/${version}/extracted"
                test -f "/tmp/${version}/extracted/author-index-v2/manifest.json"
                rm -rf "${GITHUB_WORKSPACE}/_site/data/authors/author-index-v2"
                cp -a "/tmp/${version}/extracted/author-index-v2" \
                  "${GITHUB_WORKSPACE}/_site/data/authors/"
              else
                tar -xzf "${version}.tar.gz" \
                  -C "${GITHUB_WORKSPACE}/_site/data/authors"
              fi
            else
              echo "Remote ${version} has not been published yet."
            fi
          done

      - name: Attach immutable thesis effective corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("scripts/thesis/config/effective-corpus-release-t2cg-v2.json").read_text())
          print(config["releaseTag"])
          PY
          )
          PUBLIC_BASE=$(python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path("scripts/thesis/config/effective-corpus-release-t2cg-v2.json").read_text())
          print(config["publicBasePath"])
          PY
          )

          rm -rf /tmp/thesis-effective-corpus
          mkdir -p /tmp/thesis-effective-corpus
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/thesis-effective-corpus

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --release-dir /tmp/thesis-effective-corpus \
            --root-release-manifest release-manifest.json

          DEST="${GITHUB_WORKSPACE}/_site/${PUBLIC_BASE}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -a /tmp/thesis-effective-corpus/. "${DEST}/"

      - name: Build reference-only UdeG thesis demo index from verified V2
        run: |
          python scripts/thesis/build_thesis_demo_index_v1.py \
            --corpus-gzip /tmp/thesis-effective-corpus/effective-corpus.json.gz \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --output _site/data/theses/demo-v1/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          page=Path("_site/tesis.html")
          data=Path("_site/data/theses/demo-v1/index.json")
          payload=json.loads(data.read_text(encoding="utf-8"))
          assert page.is_file()
          assert payload["schemaVersion"]=="thesis-demo-index-v1"
          assert payload["totalIncluded"]==len(payload["records"])==566
          assert payload["sourceRelease"]=="thesis-effective-corpus-v2"
          assert payload["referenceOnly"] is True
          assert len({row["id"] for row in payload["records"]})==566
          assert data.stat().st_size < 2_500_000
          forbidden={".pdf",".epub",".djvu"}
          assert not any(p.suffix.lower() in forbidden for p in Path("_site/data/theses/demo-v1").rglob("*") if p.is_file())
          print("Demo public index verified:",len(payload["records"]),"bibliographic references")
          PY

      - name: Build experimental 2D thesis Atlas from verified V2
        run: |
          rm -rf _site/data/theses/atlas-v1
          python scripts/thesis/build_thesis_atlas_v1.py \
            --corpus-gzip /tmp/thesis-effective-corpus/effective-corpus.json.gz \
            --release-contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --registry scripts/thesis/config/program-authority-v1.json \
            --atlas-contract scripts/thesis/config/thesis-atlas-v1.json \
            --output-dir _site/data/theses/atlas-v1

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root=Path("_site/data/theses/atlas-v1")
          data=json.loads((root/"index.json").read_text(encoding="utf-8"))
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          ids={node["id"] for node in data["nodes"]}

          assert Path("_site/atlas.html").is_file()
          assert data["schemaVersion"]=="thesis-atlas-index-v1"
          assert data["sourceRelease"]=="thesis-effective-corpus-v2"
          assert data["methodStatus"]=="experimental-not-benchmark-approved"
          assert data["referenceOnly"] is True
          assert data["topologyInputContract"]["fields"]==["title"]
          assert len(data["nodes"])==len(ids)==566
          assert manifest["nodes"]==566
          assert manifest["pdfCopies"]==0
          assert manifest["atlasIndexSha256"]
          assert all(
              math.isfinite(node["atlas"]["x"]) and
              math.isfinite(node["atlas"]["y"]) and
              node["neighborhood"]["k"]==8 and
              len(node["neighborhood"]["neighborRefs"])==8
              for node in data["nodes"]
          )

          forbidden={".pdf",".epub",".djvu"}
          assert not any(
              p.suffix.lower() in forbidden
              for p in root.rglob("*") if p.is_file()
          )
          print(
              "Atlas public payload verified:",
              len(data["nodes"]),
              "nodes ·",
              len(data["clusters"]),
              "experimental regions · trustworthiness@8",
              data["evaluation"]["trustworthinessK8"],
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
