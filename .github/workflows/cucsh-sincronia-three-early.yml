name: Sincronía · restore three historical bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-three-early.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-three-early-bylines
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test source evidence and exact frozen record identities
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_three_early_attributions
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Recover three documented Sincronía bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-three-early-before.json
          python3 -m scripts.cucsh.restore_sincronia_three_early_attributions \
            --input /tmp/cucsh-three-early-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify original URLs, years, identities and no record loss
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-three-early-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-early-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-early-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_three_early_attributions import ORIGINALS

          before=json.loads(Path("/tmp/cucsh-three-early-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert set(changed)==set(ORIGINALS) and len(changed)==3,changed
          for rid in changed:
              old,new=b[rid],a[rid]
              frozen=ORIGINALS[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              assert old["title"]==new["title"]==frozen["title"]
              assert old["issueNumber"]==new["issueNumber"]==frozen["issue"]
              assert old["year"]==new["year"]==frozen["year"]
              assert old["urls"]==new["urls"]
              assert old["legacyAccessStatus"]==new["legacyAccessStatus"]
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new) if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":frozen["author"],"sourceName":frozen["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceArticleUrl"]==frozen["url"]
              assert ev["publicationVersionCaveat"]
              assert ev["urlMatchLevel"]==frozen["evidence"]["urlMatchLevel"]

          report=json.loads(Path("/tmp/sincronia-three-early-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==70
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==68
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_THREE_EARLY_STRICT_PASS",len(changed),70)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to the existing branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore three source-verified Sincronía historical bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical and pending review audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-three-early-${{ github.run_id }}
          path: |
            /tmp/sincronia-three-early-historical-quality.json
            /tmp/sincronia-three-early-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
