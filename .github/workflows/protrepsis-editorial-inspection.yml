name: Protrepsis editorial source inspection (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/protrepsis-editorial-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve publicly available Protrepsis editorial roster
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from html.parser import HTMLParser

          url = "https://protrepsis.cucsh.udg.mx/index.php/prot/about/editorialTeam"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; InvestigacionFilosoficaEditorialQA/1.0)",
                  "Accept": "text/html,application/xhtml+xml;q=0.9,*/*;q=0.8",
              },
          )
          with urllib.request.urlopen(request, timeout=35) as response:
              raw = response.read(1_000_000)
              charset = response.headers.get_content_charset() or "utf-8"
              source = raw.decode(charset, errors="replace")
              print("STATUS", response.status, "FINAL_URL", response.geturl(), "HTML_BYTES", len(raw))

          class Content(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hidden = 0
                  self.lines = []
                  self.block = {"p","div","li","h1","h2","h3","h4","h5","h6","section","article","br","strong","dt","dd","header","footer","main"}
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","style","noscript"):
                      self.hidden += 1
                  elif tag in self.block:
                      self.lines.append("\n")
              def handle_endtag(self, tag):
                  if tag in ("script","style","noscript"):
                      self.hidden = max(0,self.hidden-1)
                  elif tag in self.block:
                      self.lines.append("\n")
              def handle_data(self, data):
                  if not self.hidden:
                      self.lines.append(data)
          parser=Content()
          parser.feed(source)
          text=html.unescape("".join(parser.lines))
          text=re.sub(r"\n\s*\n+", "\n", text)
          text="\n".join(line.strip() for line in text.splitlines() if line.strip())
          print("OFFICIAL_EDITORIAL_DIRECTORY_BEGIN")
          print(text[:35000])
          print("OFFICIAL_EDITORIAL_DIRECTORY_END")
          if not ("Equipo editorial" in text or "Consejo Editorial" in text):
              raise SystemExit("Unexpected official page content")
          PY
