name: Sincronía · stage six verified historical author bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-authors-stage.txt"

permissions:
  contents: write

concurrency:
  group: sincronia-authors-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify encoding and exact author provenance tests
        run: |
          python3 -m unittest \
            tests.test_cucsh_sincronia_legacy \
            tests.test_cucsh_sincronia_verified_authors
      - name: Enrich only the six evidenced records
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-authors.json
          python3 -m scripts.cucsh.backfill_sincronia_authors \
            --before /tmp/cucsh-before-authors.json \
            --after src/data/cucsh-filosofia.json \
            --report /tmp/sincronia-authors-report.json
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-authors.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-audit-after-authors.json
      - name: Verify application regression with enriched authors
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { searchCucshRecords } from "./src/sources/cucsh-filosofia.js";

          const data=JSON.parse(fs.readFileSync("src/data/cucsh-filosofia.json","utf8"));
          const sync=data.records.filter(r=>r.journal==="Sincronía");
          assert.equal(data.records.length,1841);
          assert.equal(sync.length,1450);
          for(const [id,author] of [
            ["cucsh:sincronia-legacy:d87fca538fca959b356c","Helen Galkina"],
            ["cucsh:sincronia-legacy:9eb03bcd8db8d0803e66","Marcial Gonzalez"],
            ["cucsh:sincronia-legacy:aa16ce21a65b199eb95a","Gilbert Larochelle"],
            ["cucsh:sincronia-legacy:bcc38b21c378dad5aee1","Antonio L Rappa"],
            ["cucsh:sincronia-legacy:31be1ee11d7c27a5d41c","José María Areta"],
            ["cucsh:sincronia-legacy:78588882c93ad39b23dd","Kyeong-Eun Park"]
          ]){
            const r=sync.find(v=>v.id===id);
            assert.ok(r, id);
            assert.equal(r.authors[0].name,author);
            const matched=searchCucshRecords(data.records,r.title,{rows:60});
            assert.ok(matched.some(m=>m.journal==="Sincronía"&&m.title===r.title));
          }
          console.log("SIX_VERIFIED_AUTHOR_BYLINES_OK",sync.length);
          JS
      - name: Commit only validated data on development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Add six source-verified Sincronía historical author bylines"
            git push origin HEAD:feature/cucsh-sincronia
          else
            echo "No data change needed"
          fi
      - name: Upload report and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-authors-stage-${{ github.run_id }}
          path: |
            /tmp/sincronia-authors-report.json
            /tmp/sincronia-audit-after-authors.json
          if-no-files-found: warn
          retention-days: 30
