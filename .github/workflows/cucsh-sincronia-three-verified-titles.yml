name: Sincronía · three source-verified historical article titles

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-three-verified-titles.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-three-source-verified-titles
  cancel-in-progress: false

jobs:
  verified-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test independent article identity and source guards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_three_verified_titles
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three source-verified historical works
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-three-before.json
          python3 -m scripts.cucsh.restore_sincronia_three_verified_titles \
            --input /tmp/cucsh-three-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify preservation of the entire journal corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-three-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("/tmp/cucsh-three-before.json").read_text())
          new=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          b={row["id"]:row for row in old["records"]}
          a={row["id"]:row for row in new["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changes=[key for key in b if b[key]!=a[key]]
          assert len(changes)==3,changes
          permitted={
              "title", "titleVariants", "authors",
              "legacyIndexMislabelEvidence", "legacyAuthorEvidence"
          }
          for key in changes:
              before=b[key]; after=a[key]
              assert before["journal"]==after["journal"]=="Sincronía"
              assert not before.get("authors") and after.get("authors")
              for field in set(before)|set(after):
                  if field not in permitted:
                      assert before.get(field)==after.get(field),(key,field)
              assert before["urls"]==after["urls"]
              assert before["legacyAccessStatus"]==after["legacyAccessStatus"]
              assert after["legacyIndexMislabelEvidence"]["sourceArticleUrl"] == before["urls"]["canonical"]
          report=json.loads(Path("/tmp/sincronia-three-pending-authors.json").read_text())
          assert report["pendingAuthorRecords"]==101
          assert report["totalSincroniaRecords"]==1454
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert report["bibliographicConflictCount"]==1
          assert report["suspectedWorkIdentityCount"]==45
          print("SINCRONIA_THREE_VERIFIED_NO_LOSS_PASS",len(changes),101,45)
          PY
      - name: Run full application regression tests
        run: |
          npm ci
          npm test
      - name: Commit verified changes only to Sincronía feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore three source-verified Sincronía historical titles"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historic quality and follow-up review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-three-verified-titles-${{ github.run_id }}
          path: |
            /tmp/sincronia-three-historical-quality.json
            /tmp/sincronia-three-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
