name: Sincronía · final Dante and Campos historical source review

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-final-contexts.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-final-dante-campos-source-investigation
  cancel-in-progress: false

jobs:
  investigate-final-contexts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test historical URL and source identity safeguards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_final_contexts
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Verify frozen Sincronía and incomplete author catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-final-contexts-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-final-contexts-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-final-contexts-pending.json").read_text(encoding="utf-8"))
          assert d["totalSincroniaRecords"]==1454
          assert d["pendingAuthorRecords"]==6
          assert d["authorlessArticleCandidatesExcludingEditorialNavigation"]==4
          assert d["highConfidenceEditorialNavigationCount"]==2
          assert d["bibliographicConflictCount"]==0
          assert d["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FINAL_CONTEXTS_SIX_FROZEN_PASS")
          PY
      - name: Inspect early Dante collection and Campos original archive links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.research_sincronia_final_contexts \
            --input /tmp/sincronia-final-contexts-pending.json \
            --output /tmp/sincronia-final-contexts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-final-contexts.json").read_text(encoding="utf-8"))
          assert d["inputMissingAuthors"]==6
          assert d["inputSincroniaWorks"]==1454
          assert d["targetUncreditedNonEditorial"]==4
          assert d["candidateUrlsInspected"]>=12
          assert d["authorAssignments"]==0
          assert d["corpusModified"] is False
          lines=[
              "# Final Sincronía records — original historical index research",
              "",
              "Original author IDs, titles, years and URLs untouched.",
              "",
              "| Historical URL | Captures | Directly useful links |",
              "|---|---:|---:|",
          ]
          for x in d["sourceReviews"]:
              lines.append("| "+x["candidateUrl"].replace("|","/")+" | "+
                  str(len(x["captures"]))+" | "+
                  str(sum(c.get("matchedLinkCount",0) for c in x["captures"]))+" |")
          lines.extend(["","Source-site folder associations are leads, not an author signature.",
                        "A biographical subject is not automatically an article author.",
                        "The existence of a 2000 Sincronía bibliography for Campos does not identify /campos.htm by itself."])
          Path("/tmp/sincronia-final-contexts.md").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("SINCRONIA_FINAL_CONTEXTS_ARCHIVE_RESEARCH_PASS")
          PY
      - name: Full application regression
        run: |
          npm ci
          npm test
      - name: Verify no unintended corpus change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
          echo "SINCRONIA_FINAL_CONTEXTS_READ_ONLY_PASS"
      - name: Archive verified sources and remaining worklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-final-contexts
          path: |
            /tmp/sincronia-final-contexts.json
            /tmp/sincronia-final-contexts.md
            /tmp/sincronia-final-contexts-history.json
            /tmp/sincronia-final-contexts-pending.json
          retention-days: 30
          if-no-files-found: warn
