name: Sincronía · restore Poveda and Dean in issue 18

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-issue18-poveda-dean.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-issue18-poveda-dean
  cancel-in-progress: false

jobs:
  restore-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test exact institutional source mappings and validators
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_issue18_poveda_dean
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly two issue-18 article identities
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-issue18-before.json
          python3 -m scripts.cucsh.restore_sincronia_issue18_poveda_dean \
            --input /tmp/cucsh-issue18-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate corpus integrity and review queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-issue18-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-issue18-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-issue18-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.validate_update import safe_issue18_poveda_dean_restoration

          before=json.loads(Path("/tmp/cucsh-issue18-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)

          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert set(changed)=={
              "cucsh:sincronia-legacy:100ad9b6aca92238c28b",
              "cucsh:sincronia-legacy:d9a2cdc5ea4378b3a96b",
          },changed

          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence",
          }
          for rid in changed:
              old,new=b[rid],a[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              assert old["issueNumber"]==new["issueNumber"]==18
              assert old["year"]==new["year"]==2001
              assert safe_issue18_poveda_dean_restoration(old,new)
              for field in set(old)|set(new):
                  if field not in permitted:
                      assert old.get(field)==new.get(field),(rid,field)
              assert old["urls"]==new["urls"]
              assert old["legacyAccessStatus"]==new["legacyAccessStatus"]

          report=json.loads(Path("/tmp/sincronia-issue18-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["articleCandidatesExcludingEditorialNavigation"]==1452
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==86
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==84
          assert report["suspectedWorkIdentityCount"]==36
          assert report["bibliographicConflictCount"]==1
          assert len(report["unresolvedIssue50UrlMappings"])==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_ISSUE18_POVEDA_DEAN_STRICT_PASS",len(changed),86,36)
          PY
      - name: Run full application regression suite
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus changes to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore Poveda and Dean Sincronía issue 18 article identities"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload quality and unresolved-review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-issue18-poveda-dean-${{ github.run_id }}
          path: |
            /tmp/sincronia-issue18-historical-quality.json
            /tmp/sincronia-issue18-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
