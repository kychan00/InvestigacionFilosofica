name: Update CUCSH Filosofía

on:
  workflow_dispatch:

  schedule:
    - cron: "17 12 3 * *"


permissions:
  contents: write
  actions: write


concurrency:
  group: cucsh-harvest
  cancel-in-progress: false


jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24


      - name: Install dependencies
        run: npm ci


      - name: Preserve previous snapshot
        run: |
          cp \
            src/data/cucsh-filosofia.json \
            /tmp/cucsh-before.json


      - name: Harvest CUCSH metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            scripts/cucsh/harvest.py \
            2>&1 \
            | tee /tmp/cucsh-harvest.log

          if grep -q \
            'status=preserved' \
            /tmp/cucsh-harvest.log
          then
            echo \
              "::warning title=CUCSH source preserved::At least one journal could not be harvested; its previous snapshot was preserved."
          fi


      - name: Validate snapshot update
        run: |
          python3 \
            scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before.json \
            --after src/data/cucsh-filosofia.json


      - name: Detect snapshot changes
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- \
            src/data/cucsh-filosofia.json
          then
            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo \
              "CUCSH snapshot unchanged."
          else
            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo \
              "CUCSH snapshot changed."

            git diff --stat -- \
              src/data/cucsh-filosofia.json
          fi


      - name: Validate Python
        run: |
          python3 -m py_compile \
            scripts/cucsh/harvest.py \
            scripts/cucsh/validate_update.py


      - name: Run test suite
        run: npm test


      - name: Validate diff
        run: git diff --check


      - name: Commit updated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/data/cucsh-filosofia.json

          STAGED="$(
            git diff \
              --cached \
              --name-only
          )"

          if [
            "$STAGED" != \
            "src/data/cucsh-filosofia.json"
          ]
          then
            echo \
              "Unexpected staged files:"
            echo "$STAGED"
            exit 1
          fi

          git diff \
            --cached \
            --check

          git commit \
            -m "Update CUCSH Filosofía snapshot"

          git push \
            origin \
            HEAD:main


      - name: Deploy updated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run \
            deploy.yml \
            --ref main


      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CUCSH Filosofía"
            echo
            echo "- Snapshot changed: ${{ steps.snapshot.outputs.changed || 'unknown' }}"
            echo "- Schedule: monthly, day 3 at 12:17 UTC"
            echo
            echo '```text'

            if [
              -f /tmp/cucsh-harvest.log
            ]
            then
              tail -n 35 \
                /tmp/cucsh-harvest.log
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
