name: Sincronía · restore four signed original works issues 4 9 10 50

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-four-issues4-9-10-50.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-four-reviewed-originals
  cancel-in-progress: false

jobs:
  restore-four:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify original signatures, reviewer role and all source identities
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_four_issue4_9_10_50
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly four signed historical authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-four-mixed-before.json
          python3 -m scripts.cucsh.restore_sincronia_four_issue4_9_10_50 \
            --input /tmp/sincronia-four-mixed-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Strict 1845-record unchanged-source validation and pending review
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-four-mixed-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-mixed-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-mixed-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_four_issue4_9_10_50 import SOURCES

          baseline=json.loads(Path("/tmp/sincronia-four-mixed-before.json").read_text(encoding="utf-8"))
          updated=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in baseline["records"]}
          a={r["id"]:r for r in updated["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==4 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=b[rid],a[rid]
              src=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {f for f in set(old)|set(new) if old.get(f)!=new.get(f)}=={
                  "authors","legacyAuthorEvidence"
              }
              assert new["authors"]==[{"name":n,"sourceName":n} for n in src["authors"]]
              evidence=new["legacyAuthorEvidence"]
              assert evidence["sourceUrl"]==src["snapshot"]
              assert evidence["sourceArticleUrl"]==src["url"]
              assert evidence["sourcePrintedByline"]==src["printedByline"]
              assert evidence["sourceArticleTitle"]==src["sourceArticleTitle"]
              assert evidence["verifiedAuthors"]==src["authors"]
              assert evidence["matchedIndexedYear"]==src["year"]
              assert evidence["matchedIndexedIssue"]==src["issue"]
              assert evidence["originalAvailabilityPreserved"]
              assert evidence["titleIdentityCaveat"]

          book=a["cucsh:sincronia-legacy:8eded0eac6e2a217ade1"]
          assert [r["name"] for r in book["authors"]]==["Maximiliano E. Korstanje"]
          assert book["legacyAuthorEvidence"]["reviewedBookCompilerNotReviewer"]=="Jorge Saurí"
          assert book["legacyAuthorEvidence"]["sourceWorkType"]=="signed-book-review"
          assert book["year"]==2009

          report=json.loads(Path("/tmp/sincronia-four-mixed-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==16
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==14
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==0
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FOUR_VERIFIED_16_REMAINING",len(changed),16)
          PY
      - name: Run full application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus modifications to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore four verified early Sincronía authors and review role"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and remaining work report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-four-mixed-signed
          path: |
            /tmp/sincronia-four-mixed-history.json
            /tmp/sincronia-four-mixed-pending.json
          retention-days: 30
          if-no-files-found: warn
