name: Sincronía · issue 23 verified author and title metadata

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-issue23-stage-v1.txt"

permissions:
  contents: write

concurrency:
  group: sincronia-issue23-source-recovery
  cancel-in-progress: false

jobs:
  stage-verified-issue23:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify all conservative metadata matching tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cucsh/reconcile_sincronia_issue23.py
          python3 -m unittest tests.test_cucsh_sincronia_issue23_stage

      - name: Verify and stage precisely two incomplete issue-23 records
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-23.json
          python3 -u -m scripts.cucsh.reconcile_sincronia_issue23 \
            --before /tmp/cucsh-before-23.json \
            --after /tmp/cucsh-after-23.json \
            --report /tmp/cucsh-issue23-evidence.json \
            2>&1 | tee /tmp/cucsh-issue23.log

      - name: Strict non-regression audit on entire catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-23.json \
            --after /tmp/cucsh-after-23.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input /tmp/cucsh-after-23.json \
            --output /tmp/cucsh-issue23-quality.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          old=json.loads(Path("/tmp/cucsh-before-23.json").read_text())
          new=json.loads(Path("/tmp/cucsh-after-23.json").read_text())
          assert len(old["records"])==len(new["records"])==1841
          before={r["id"]:r for r in old["records"]}
          after={r["id"]:r for r in new["records"]}
          assert set(before)==set(after)
          changed=[]
          for rid,first in before.items():
              last=after[rid]
              for field in ("id","sourceId","urls","year","issueNumber","journal","doi","abstract"):
                  assert first.get(field)==last.get(field),(rid,field)
              if first!=last:
                  assert first["journal"]=="Sincronía" and first["issueNumber"]==23
                  changed.append(rid)
              if first.get("authors"):
                  assert first.get("authors")==last.get("authors")
          assert len(changed)==2, changed
          assert sum(r["journal"]=="Sincronía" for r in after.values())==1450
          assert all(r.get("authors") for r in after.values()
                     if r["journal"]=="Sincronía" and r.get("issueNumber")==23)
          print("SINCRONIA_ISSUE23_NO_LOSS_PASS",changed)
          PY

      - name: Full federated search regression suite
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/cucsh-after-23.json src/data/cucsh-filosofia.json
          npm ci
          npm test

      - name: Commit only verified issue-23 changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
          git diff --cached --check
          git commit -m "Restore two verified Sincronía issue 23 author metadata records"
          git push origin HEAD:feature/cucsh-sincronia

      - name: Preserve evidence and full audit as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-issue23-evidence-${{ github.run_id }}
          path: |
            /tmp/cucsh-issue23-evidence.json
            /tmp/cucsh-issue23-quality.json
            /tmp/cucsh-issue23.log
          if-no-files-found: warn
          retention-days: 30
