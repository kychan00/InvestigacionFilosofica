name: Protrepsis HTTP editorial source inspection (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/protrepsis-http-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect public OJS team through HTTP as displayed in Safari
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from html.parser import HTMLParser
          urls = [
            "http://protrepsis.cucsh.udg.mx/index.php/prot/about/editorialTeam",
            "http://www.protrepsis.cucsh.udg.mx/index.php/prot/about/editorialTeam",
          ]
          for url in urls:
              print("ATTEMPT",url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"})
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      b=resp.read(1000000)
                      source=b.decode(resp.headers.get_content_charset() or "utf-8",errors="replace")
                      print("SUCCESS",resp.status,resp.geturl(),"BYTES",len(b),flush=True)
                  class Page(HTMLParser):
                      def __init__(self):
                          super().__init__()
                          self.skip=0;self.chunks=[]
                      def handle_starttag(self,t,attrs):
                          if t in ("script","style","noscript"): self.skip+=1
                          elif t in ("p","div","li","h1","h2","h3","h4","h5","section","article","br","td"): self.chunks.append("\n")
                      def handle_endtag(self,t):
                          if t in ("script","style","noscript"): self.skip=max(0,self.skip-1)
                          elif t in ("p","div","li","h1","h2","h3","h4","h5","section","article","br","td"): self.chunks.append("\n")
                      def handle_data(self,data):
                          if not self.skip:self.chunks.append(data)
                  p=Page();p.feed(source)
                  cleaned=html.unescape("".join(p.chunks))
                  cleaned="\n".join(line.strip() for line in cleaned.splitlines() if line.strip())
                  print("EDITORIAL_TEXT_BEGIN",flush=True)
                  print(cleaned[:42000],flush=True)
                  print("EDITORIAL_TEXT_END",flush=True)
                  break
              except Exception as e:
                  print("FETCH_FAILED",repr(e),flush=True)
          PY
