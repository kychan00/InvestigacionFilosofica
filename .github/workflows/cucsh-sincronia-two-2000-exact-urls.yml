name: Sincronía · two independently sourced 2000 work identities

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-2000-two-exact-urls.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-two-2000-exact-article-urls
  cancel-in-progress: false

jobs:
  repair-two-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Run exact bibliographic identity and no-loss unit tests
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_two_2000_cited_titles
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Recover exact 2000 Sincronía titles and authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-2000-two-before.json
          python3 -m scripts.cucsh.recover_sincronia_two_2000_cited_titles \
            --input /tmp/sincronia-2000-two-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify strict corpus integrity, immutable records and archival status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-2000-two-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-two-2000-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-two-2000-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.validate_update import safe_two_2000_exact_url_recoveries
          original=json.loads(Path("/tmp/sincronia-2000-two-before.json").read_text(encoding="utf-8"))
          updated=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={r["id"]:r for r in original["records"]}
          after={r["id"]:r for r in updated["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changes=[key for key in before if before[key]!=after[key]]
          assert set(changes)=={
              "cucsh:sincronia-legacy:c7cbf58138a51053d669",
              "cucsh:sincronia-legacy:014936a40189f16c9b90",
          },changes
          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence",
          }
          for key in changes:
              b,a=before[key],after[key]
              assert b["journal"]==a["journal"]=="Sincronía"
              assert b["issueNumber"]==a["issueNumber"]==15
              assert b["year"]==a["year"]==2000
              assert not b.get("authors") and len(a.get("authors") or [])==1
              assert safe_two_2000_exact_url_recoveries(b,a)
              assert b["title"] in a["titleVariants"]
              for field in set(b)|set(a):
                  if field not in permitted:
                      assert b.get(field)==a.get(field),(key,field)
              assert b["urls"]==a["urls"]
              assert b["legacyAccessStatus"]==a["legacyAccessStatus"]
          report=json.loads(Path("/tmp/sincronia-two-2000-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["articleCandidatesExcludingEditorialNavigation"]==1452
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==89
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==87
          assert report["suspectedWorkIdentityCount"]==39
          assert report["bibliographicConflictCount"]==1
          assert len(report["unresolvedIssue50UrlMappings"])==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_TWO_2000_TITLES_STRICT_NO_LOSS_PASS",len(changes),89,39)
          PY
      - name: Run complete application test suite
        run: |
          npm ci
          npm test
      - name: Commit only exact audited corpus data to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected repository files changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore two source-cited Sincronía 2000 titles and bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Publish original-index quality and remaining-review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-two-2000-citations-${{ github.run_id }}
          path: |
            /tmp/sincronia-two-2000-historical-quality.json
            /tmp/sincronia-two-2000-pending-authors.json
          if-no-files-found: warn
          retention-days: 30
