name: Sincronía · source-verified Vidaurre article title

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-vidaurrre-nunez.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-vidaurrre-nunez-source-verification
  cancel-in-progress: false

jobs:
  verified-vidaurrre:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test frozen article identity and validation safeguards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_vidaurrre_nunez
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Recover exactly one independently cited article
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-vidaurrre-before.json
          python3 -m scripts.cucsh.restore_sincronia_vidaurrre_nunez \
            --input /tmp/cucsh-vidaurrre-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate strict no-loss, sources and historical coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-vidaurrre-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-vidaurrre-historical-audit.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-vidaurrre-pending-review.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("/tmp/cucsh-vidaurrre-before.json").read_text())
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changes=[key for key in b if b[key]!=a[key]]
          assert changes==["cucsh:sincronia-legacy:227e912cb694dcd4f77c"]
          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence"
          }
          for rid in changes:
              old,new=b[rid],a[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              assert not old.get("authors") and len(new["authors"])==1
              for field in set(old)|set(new):
                  if field not in permitted:
                      assert old.get(field)==new.get(field),(rid,field)
              assert old["urls"]==new["urls"]
              assert old["legacyAccessStatus"]==new["legacyAccessStatus"]
          q=json.loads(Path("/tmp/sincronia-vidaurrre-pending-review.json").read_text())
          assert q["totalSincroniaRecords"]==1454
          assert q["pendingAuthorRecords"]==100
          assert q["suspectedWorkIdentityCount"]==44
          assert q["bibliographicConflictCount"]==1
          assert q["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_VIDAURRRE_NO_LOSS_PASS",len(changes),100,44)
          PY
      - name: Complete application regression suite
        run: |
          npm ci
          npm test
      - name: Commit exact verified metadata change to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected files changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore source-verified Vidaurre Sincronía article title"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload evidence-only quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-vidaurrre-evidence-${{ github.run_id }}
          path: |
            /tmp/sincronia-vidaurrre-historical-audit.json
            /tmp/sincronia-vidaurrre-pending-review.json
          retention-days: 30
          if-no-files-found: warn
