name: Thesis MCA Historia Arquitectura Authority V37

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/mca-historia-arquitectura-authority-v37-baseline-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "tests/test_thesis_mca_historia_arquitectura_authority_v37.py"
      - "tests/test_thesis_canonical_corpus.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "tests/test_thesis_historia_arquitectura_authority_v32.py"
      - "tests/test_thesis_conservacion_patrimonio_edificado_authority_v35.py"
      - "docs/THESIS_MCA_HISTORIA_ARQUITECTURA_AUTHORITY_V37.md"
      - ".github/workflows/thesis-mca-historia-arquitectura-authority-v37.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_mca_historia_arquitectura_authority_v37.py" -v
          python -m unittest discover -s tests -p "test_thesis_canonical_corpus.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v
          python -m unittest discover -s tests -p "test_thesis_historia_arquitectura_authority_v32.py" -v
          python -m unittest discover -s tests -p "test_thesis_conservacion_patrimonio_edificado_authority_v35.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-mca-historia-arquitectura-v37
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-mca-historia-arquitectura-v37
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-mca-historia-arquitectura-v37/canonical-confidence.json \
            --output-report artifacts/thesis-mca-historia-arquitectura-v37/confidence-report.json

      - name: Reproject Program Authority V37 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation
          root = Path("artifacts/thesis-mca-historia-arquitectura-v37")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text())
          registry = canonical.load_program_registry()
          projected, projection = coverage.reproject_corpus(corpus, registry, reference_year=2026)
          projected_observed = coverage.reproject_observed_authorities(
              observed, projection["programDimensions"]
          )
          queue = curation.build_queue(projected_observed, projected, registry)
          for name, value in (
              ("canonical-v37.json", projected),
              ("observed-v37.json", projected_observed),
              ("projection-v37.json", projection),
              ("queue-v37.json", queue),
          ):
              (root / name).write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
              )
          PY

      - name: Validate V37 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical
          root = Path("artifacts/thesis-mca-historia-arquitectura-v37")
          baseline = json.loads(Path(
              "scripts/thesis/config/mca-historia-arquitectura-authority-v37-baseline-v1.json"
          ).read_text())
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v37.json").read_text())
          projection = json.loads((root / "projection-v37.json").read_text())
          queue = json.loads((root / "queue-v37.json").read_text())
          confidence = json.loads((root / "confidence-report.json").read_text())
          scope = json.loads(Path("scripts/thesis/config/scope-boundary-matrix-v1.json").read_text())
          expected = baseline["expected"]

          assert registry["registryRevision"] == baseline["registryRevision"]
          assert scope["policyRevision"] == baseline["scopePolicyRevision"]
          assert confidence["programMetadataEvidenceRevision"] == baseline["programMetadataEvidenceRevision"]
          assert len(corpus["works"]) == 27576

          selected = [w for w in corpus["works"] if w.get("programRef") == baseline["programRef"]]
          assert len(selected) == expected["works"]
          assert Counter(w.get("admissionStatus") for w in selected) == Counter(expected["admissionStatuses"])
          assert Counter(w.get("academicUnitRaw") for w in selected) == Counter(expected["academicUnits"])
          assert Counter((w.get("programMetadataEvidence") or {}).get("confidenceState") for w in selected) == Counter({"unassessed": 16})
          assert Counter((w.get("programMetadataEvidence") or {}).get("authorityApplicability") for w in selected) == Counter({"allowed": 16})
          assert sum(1 for w in selected if (w.get("programMetadataEvidence") or {}).get("authorityApplicability") == "blocked") == 0

          quality = Counter((w.get("date") or {}).get("quality") for w in selected)
          assert quality["valid"] == 14
          assert quality["invalid"] == 1
          assert quality["suspicious"] == 1
          years = sorted(int(str((w.get("date") or {}).get("value"))[:4]) for w in selected if (w.get("date") or {}).get("quality") == "valid")
          assert years[0] == 1996 and years[-1] == 2019

          groups = Counter(canonical.normalize_key(w.get("programRaw") or "") for w in selected)
          assert dict(groups) == expected["normalizedProgramGroups"]

          base = [w for w in corpus["works"] if w.get("programRef") == baseline["baseProgramRef"]]
          historical = [w for w in corpus["works"] if w.get("programRef") == baseline["historicalProgramRef"]]
          assert len(base) == 96
          assert Counter(w.get("admissionStatus") for w in base) == Counter({"review": 96})
          assert len(historical) == 4
          assert Counter(w.get("admissionStatus") for w in historical) == Counter({"include": 4})

          assert projection["projectedAdmission"] == expected["globalProjectedAdmission"]
          assert sum(projection["projectedAdmission"].values()) == 27576

          resolved = set(expected["normalizedProgramGroups"])
          assert all(item["normalizedKey"] not in resolved for item in queue["items"])
          assert all(item["normalizedKey"] not in resolved for item in queue["humanitiesActionItems"])
          assert queue["metrics"]["humanitiesActionQueueItems"] == 35
          assert queue["metrics"]["humanitiesActionWorks"] == 439
          assert queue["metrics"]["workReviewQueueItems"] == 1
          assert queue["metrics"]["workReviewWorks"] == 152
          next_action = queue["nextHumanitiesAction"]
          assert next_action["normalizedKey"] == "maestria en tecnologias para el aprendizaje"
          assert next_action["count"] == 266

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "programMetadataEvidenceRevision": confidence["programMetadataEvidenceRevision"],
              "mcaHistoriaWorks": len(selected),
              "mcaHistoriaAdmission": dict(Counter(w.get("admissionStatus") for w in selected)),
              "baseMcaWorks": len(base),
              "historicalHistoriaWorks": len(historical),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "humanitiesActionQueueItems": queue["metrics"]["humanitiesActionQueueItems"],
              "humanitiesActionWorks": queue["metrics"]["humanitiesActionWorks"],
              "workReviewQueueItems": queue["metrics"]["workReviewQueueItems"],
              "workReviewWorks": queue["metrics"]["workReviewWorks"],
              "nextHumanitiesAction": next_action,
          }
          (root / "v37-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V37 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-mca-historia-arquitectura-authority-v37
          path: artifacts/thesis-mca-historia-arquitectura-v37/
          if-no-files-found: error
          retention-days: 14
