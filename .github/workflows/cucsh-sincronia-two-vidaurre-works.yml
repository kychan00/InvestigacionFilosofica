name: Sincronía · restore two Carmen Vidaurre historical works

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-two-vidaurre-works.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-two-vidaurre-reproduced-works
  cancel-in-progress: false

jobs:
  restore-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test reproduced issue metadata and immutable-record guards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_two_vidaurre_works
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly two Carmen Vidaurre work identities
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-vidaurre-before.json
          python3 -m scripts.cucsh.restore_sincronia_two_vidaurre_works \
            --input /tmp/cucsh-vidaurre-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate no loss, historical coverage and review queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-vidaurre-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-vidaurre-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-vidaurre-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.validate_update import safe_two_vidaurre_reproduced_works

          before=json.loads(Path("/tmp/cucsh-vidaurre-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert set(changed)=={
              "cucsh:sincronia-legacy:f0219709b1318d38b4e9",
              "cucsh:sincronia-legacy:56729985caa12c05d30e",
          },changed
          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence",
          }
          for rid in changed:
              old,new=b[rid],a[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              assert safe_two_vidaurre_reproduced_works(old,new)
              assert old["title"] in new["titleVariants"]
              for field in set(old)|set(new):
                  if field not in permitted:
                      assert old.get(field)==new.get(field),(rid,field)
              assert old["urls"]==new["urls"]
              assert old["legacyAccessStatus"]==new["legacyAccessStatus"]

          report=json.loads(Path("/tmp/sincronia-vidaurre-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["articleCandidatesExcludingEditorialNavigation"]==1452
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==84
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==82
          assert report["suspectedWorkIdentityCount"]==34
          assert report["bibliographicConflictCount"]==1
          assert len(report["unresolvedIssue50UrlMappings"])==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_TWO_VIDAURRE_STRICT_PASS",len(changed),84,34)
          PY
      - name: Run complete application regression suite
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore two reproduced Carmen Vidaurre Sincronía work identities"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload remaining-review and historical-quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-two-vidaurre-${{ github.run_id }}
          path: |
            /tmp/sincronia-vidaurre-historical-quality.json
            /tmp/sincronia-vidaurre-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
