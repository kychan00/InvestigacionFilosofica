name: Thesis full inventory execution

on:
  push:
    branches:
      - chore/thesis-full-inventory-run-20261101

permissions:
  contents: read

jobs:
  full-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile
        run: |
          python -m py_compile             scripts/thesis/build_canonical_corpus_v1.py             scripts/thesis/harvest_real_corpus_v1.py

      - name: Offline tests
        run: |
          python -m unittest discover             -s tests             -p "test_thesis_*.py"             -v

      - name: Full harvest
        run: |
          rm -rf artifacts/thesis-real-harvest
          python scripts/thesis/harvest_real_corpus_v1.py             --mode full             --delay 0.35             --output-dir artifacts/thesis-real-harvest

      - name: Validate full inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-real-harvest")
          ledger = json.loads((root / "coverage-ledger.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())

          assert ledger["providers"]["riudg"]["status"] == "exhausted"
          assert ledger["providers"]["udgvirtual"]["status"] == "exhausted"
          assert ledger["providers"]["udgvirtual"]["enumeratedHandles"] == 147
          assert ledger["providers"]["udgvirtual"]["reportedTotal"] == 147
          assert ledger["providers"]["udgvirtual"]["failures"] == 0
          assert manifest["mode"] == "full"

          print(json.dumps({
              "riudg": ledger["providers"]["riudg"],
              "udgvirtual": ledger["providers"]["udgvirtual"],
              "corpus": ledger["corpus"],
              "fieldCoverage": ledger["fieldCoverage"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Upload full inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-full-inventory-20261101
          path: artifacts/thesis-real-harvest/
          if-no-files-found: error
          retention-days: 14
