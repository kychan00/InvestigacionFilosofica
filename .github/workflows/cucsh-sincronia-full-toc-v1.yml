name: Sincronía · complete historical Dialnet TOC audit

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-full-toc-audit-v1.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-full-historical-dialnet-toc
  cancel-in-progress: false

jobs:
  compare-all-historical-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify comparison semantics before external access
        run: |
          python3 -m py_compile scripts/cucsh/audit_sincronia_full_toc.py
          python3 -m unittest tests.test_cucsh_sincronia_full_toc
      - name: Compare all Dialnet indexed historical Sincronía articles
        shell: bash
        run: |
          set -euo pipefail
          python3 -u -m scripts.cucsh.audit_sincronia_full_toc \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-full-toc-evidence.json \
            2>&1 | tee /tmp/sincronia-full-toc-audit.log
      - name: Save independent article-level missing and duplicate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-full-toc-evidence-${{ github.run_id }}
          path: |
            /tmp/sincronia-full-toc-evidence.json
            /tmp/sincronia-full-toc-audit.log
          retention-days: 30
          if-no-files-found: warn
