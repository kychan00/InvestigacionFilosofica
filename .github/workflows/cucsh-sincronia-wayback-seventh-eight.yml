name: Sincronía · inspect seventh eight archived works

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-wayback-seventh-eight.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-wayback-seventh-eight
  cancel-in-progress: false

jobs:
  inspect-seventh-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test source probing, no automatic bylines or record changes
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_wayback_eight
          python3 -m unittest tests.test_cucsh_sincronia_wayback_second_eight
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Audit frozen 43 missing Sincronía authors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-seventh-eight-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-seventh-eight-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-seventh-eight-pending.json").read_text(encoding="utf-8"))
          assert d["totalSincroniaRecords"] == 1454
          assert d["pendingAuthorRecords"] == 27
          assert d["authorlessArticleCandidatesExcludingEditorialNavigation"] == 25
          assert d["highConfidenceEditorialNavigationCount"] == 2
          assert d["bibliographicConflictCount"] == 0  # conflict remains documented on attributed work
          assert d["titlesWithUnicodeReplacementCharacter"] == 0
          print("SINCRONIA_SEVENTH_EIGHT_FROZEN_VALIDATED",27)
          PY
      - name: Probe eight historical archives with bounded network access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.probe_sincronia_wayback_seventh_eight \
            --input /tmp/sincronia-seventh-eight-pending.json \
            --output /tmp/sincronia-wayback-seventh-eight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-wayback-seventh-eight.json").read_text(encoding="utf-8"))
          assert d["selected"]==8
          assert d["originalCorpusModified"] is False
          assert d["authorAttributionAllowed"] is False
          assert len(d["records"])==8
          assert all(r["authorAttribution"] is None for r in d["records"])
          lines=[
              "# Sincronía — seventh eight-work archival discovery",
              "",
              "This audit contains leads, not author attributions.",
              "",
              "| Issue | Indexed work | Wayback status | Captures |",
              "|---|---|---|---|",
          ]
          for row in d["records"]:
              title=row["indexedTitle"].replace("|","\\|")
              status=row["archiveIndexStatus"]
              if row.get("fallbackIndexStatus"):
                  status+=" / "+row["fallbackIndexStatus"]
              lines.append(
                  f'| {row["issueNumber"]} | {title} | {status} | {len(row["snapshots"])} |'
              )
          lines.extend(["", "Preserve all archived-only and unavailable statuses.",
                        "Review archived authors against primary headings before any change."])
          Path("/tmp/sincronia-wayback-seventh-eight.md").write_text(
              "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("SINCRONIA_ARCHIVE_SEVENTH_EIGHT_REPORT_PASS",d["withSnapshotLeads"])
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Confirm source and corpus remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
          echo "SINCRONIA_READ_ONLY_NO_LOSS"
      - name: Upload evidence and pending author audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-wayback-seventh-eight
          path: |
            /tmp/sincronia-wayback-seventh-eight.json
            /tmp/sincronia-wayback-seventh-eight.md
            /tmp/sincronia-seventh-eight-quality.json
            /tmp/sincronia-seventh-eight-pending.json
          retention-days: 30
          if-no-files-found: warn
