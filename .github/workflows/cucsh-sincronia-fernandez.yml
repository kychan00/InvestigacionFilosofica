name: Sincronía · restore Hugo Oscar Fernández 1999 byline

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-fernandez.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-fernandez-issue-ten
  cancel-in-progress: false

jobs:
  restore-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test exact-URL Fernández bibliographic attribution
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_fernandez
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly one issue-ten byline
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-fernandez-before.json
          python3 -m scripts.cucsh.restore_sincronia_fernandez \
            --input /tmp/cucsh-fernandez-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify no loss, retained archival URL and 74 pending
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-fernandez-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-fernandez-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-fernandez-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path("/tmp/cucsh-fernandez-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert changed==["cucsh:sincronia-legacy:df98685293eb9589c34e"],changed
          old,new=b[changed[0]],a[changed[0]]
          assert old["title"]==new["title"]
          assert old["urls"]==new["urls"]
          assert old["legacyAccessStatus"]==new["legacyAccessStatus"]
          assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
          assert {k for k in set(old)|set(new)
                  if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
          assert new["authors"]==[{"name":"Hugo Oscar Fernández","sourceName":"Hugo Oscar Fernández"}]
          ev=new["legacyAuthorEvidence"]
          assert ev["sourceArticleUrl"]=="http://fuentes.csh.udg.mx/CUCSH/Sincronia/fernandez.htm"
          assert ev["sourcePrintedPage"]==67
          assert ev["originalUrlLastAccessedBySource"]=="2012-10-22"
          assert ev["urlMatchLevel"]=="two-independent-exact-original-url-bibliographies"

          report=json.loads(Path("/tmp/sincronia-fernandez-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==74
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==72
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FERNANDEZ_STRICT_PASS",len(changed),74)
          PY
      - name: Run complete application regression suite
        run: |
          npm ci
          npm test
      - name: Commit only the verified corpus update to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore verified Hugo Oscar Fernández Sincronía issue-ten byline"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload quality audits and outstanding authors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-fernandez-${{ github.run_id }}
          path: |
            /tmp/sincronia-fernandez-historical-quality.json
            /tmp/sincronia-fernandez-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
