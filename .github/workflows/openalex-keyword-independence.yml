name: Audit OpenAlex keyword independence

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb huggingface_hub

      - name: Audit keyword independence
        run: |
          python scripts/openalex/audit_keyword_independence.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: openalex-keyword-independence
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/openalex/philosophy-keyword-independence.parquet
