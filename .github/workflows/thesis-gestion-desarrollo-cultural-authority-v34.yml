name: Thesis Gestión Desarrollo Cultural Authority V34

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/gestion-desarrollo-cultural-authority-v34-baseline-v1.json"
      - "scripts/thesis/config/program-metadata-evidence-confidence-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "tests/test_thesis_gestion_desarrollo_cultural_authority_v34.py"
      - "tests/test_thesis_docencia_ingles_historical_authority_v33.py"
      - "tests/test_thesis_canonical_corpus.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "docs/THESIS_GESTION_DESARROLLO_CULTURAL_AUTHORITY_V34.md"
      - ".github/workflows/thesis-gestion-desarrollo-cultural-authority-v34.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_gestion_desarrollo_cultural_authority_v34.py" -v
          python -m unittest discover -s tests -p "test_thesis_docencia_ingles_historical_authority_v33.py" -v
          python -m unittest discover -s tests -p "test_thesis_canonical_corpus.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-gestion-desarrollo-cultural-v34
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-gestion-desarrollo-cultural-v34
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-gestion-desarrollo-cultural-v34/canonical-confidence.json \
            --output-report artifacts/thesis-gestion-desarrollo-cultural-v34/confidence-report.json

      - name: Reproject Program Authority V34 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-gestion-desarrollo-cultural-v34")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          (root / "canonical-v34.json").write_text(
              json.dumps(projected, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "projection-v34.json").write_text(
              json.dumps(projection, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "queue-v34.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate V34 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root = Path("artifacts/thesis-gestion-desarrollo-cultural-v34")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "gestion-desarrollo-cultural-authority-v34-baseline-v1.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v34.json").read_text())
          projection = json.loads((root / "projection-v34.json").read_text())
          queue = json.loads((root / "queue-v34.json").read_text())
          confidence = json.loads((root / "confidence-report.json").read_text())
          scope = json.loads(
              Path("scripts/thesis/config/scope-boundary-matrix-v1.json").read_text()
          )
          expected = baseline["expected"]

          assert baseline["registryRevision"] == "2026-11-02.v34"
          assert int(registry["registryRevision"].rsplit(".v", 1)[1]) >= 34
          assert baseline["scopePolicyRevision"] == "2026-11-02.v4"
          assert scope["policyRevision"] == "2026-11-02.v5"
          assert (
              confidence["programMetadataEvidenceRevision"]
              == baseline["programMetadataEvidenceRevision"]
          )
          assert len(corpus["works"]) == 27576

          target = next(
              p for p in registry["programs"]
              if p["id"] == baseline["programRef"]
          )
          sibling = next(
              p for p in registry["programs"]
              if p["id"] == baseline["siblingProgramRef"]
          )
          assert target["admissionState"] == "include"
          assert sibling["admissionState"] == "include"
          assert target["id"] != sibling["id"]
          assert target.get("possibleSuccessorRef") is None
          assert sibling.get("possibleSuccessorRef") is None

          selected = [
              w
              for w in corpus["works"]
              if w.get("programRef") == baseline["programRef"]
          ]
          assert len(selected) == expected["works"]

          blocked = [
              w for w in selected
              if (w.get("programMetadataEvidence") or {}).get(
                  "authorityApplicability"
              ) == "blocked"
          ]
          assert len(blocked) == expected["blockedWorks"]
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("confidenceState")
              for w in selected
          ) == Counter({"unassessed": expected["unassessedWorks"]})
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("authorityApplicability")
              for w in selected
          ) == Counter({"allowed": expected["allowedWorks"]})

          units = Counter(w.get("academicUnitRaw") for w in selected)
          assert units["CUAAD"] == expected["academicUnits"]["CUAAD"]
          assert units[None] == expected["missingAcademicUnitWorks"]

          assert Counter(
              w.get("admissionStatus") for w in selected
          ) == Counter(expected["admissionStatuses"])

          date_quality = Counter(
              (w.get("date") or {}).get("quality") for w in selected
          )
          assert date_quality["valid"] == expected["validDateWorks"]
          assert date_quality["suspicious"] == expected["suspiciousDateWorks"]

          years = sorted(
              int(str((w.get("date") or {}).get("value"))[:4])
              for w in selected
              if (w.get("date") or {}).get("quality") == "valid"
              and str((w.get("date") or {}).get("value") or "")[:4].isdigit()
          )
          assert years[0] == expected["observedYears"]["min"]
          assert years[-1] == expected["observedYears"]["max"]

          sibling_works = [
              w
              for w in corpus["works"]
              if w.get("programRef") == baseline["siblingProgramRef"]
          ]
          assert len(sibling_works) == expected["siblingProgramWorks"]
          assert Counter(
              w.get("admissionStatus") for w in sibling_works
          ) == Counter(expected["siblingProgramAdmissionStatuses"])
          sibling_quarantine = [
              w for w in sibling_works
              if w.get("admissionStatus") == "quarantine"
          ]
          assert len(sibling_quarantine) == expected["siblingUnresolvedInstitutionWorks"]
          assert all(
              "unresolved-institution" in (w.get("admissionExplanationCodes") or [])
              for w in sibling_quarantine
          )

          expected_global = dict(expected["globalProjectedAdmission"])
          # V35: Conservación del Patrimonio Edificado REVIEW -> INCLUDE.
          expected_global["include"] += 5
          expected_global["review"] -= 5
          # V36: Investigación Educativa REVIEW -> EXCLUDE.
          expected_global["review"] -= 34
          expected_global["exclude"] += 34
          # V37: MCA Orientación Historia de la Arquitectura Mexicana REVIEW -> INCLUDE.
          expected_global["review"] -= 16
          expected_global["include"] += 16
          # V38: Maestría en Tecnologías para el Aprendizaje REVIEW -> EXCLUDE.
          expected_global["review"] -= 266
          expected_global["exclude"] += 266
          # V39: Licenciatura en Historia del Arte REVIEW -> INCLUDE.
          expected_global["review"] -= 2
          expected_global["include"] += 2
          assert projection["projectedAdmission"] == expected_global
          assert sum(projection["projectedAdmission"].values()) == 27576

          target_key = "maestria en gestion y desarrollo cultural"
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["items"]
          )
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["humanitiesActionItems"]
          )
          assert (
              queue["metrics"]["humanitiesActionQueueItems"]
              == expected["humanitiesActionQueueItems"] - 9
          )
          assert (
              queue["metrics"]["humanitiesActionWorks"]
              == expected["humanitiesActionWorks"] - 475
          )
          next_action = queue["nextHumanitiesAction"]
          assert next_action["normalizedKey"] == (
              "maestria en ciencias de la arquitectura orientacion en conservacion del patrimonio edificado"
          )
          assert next_action["count"] == 10
          assert queue["metrics"]["workReviewQueueItems"] == 1
          assert queue["metrics"]["workReviewWorks"] == 152

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "programMetadataEvidenceRevision": confidence[
                  "programMetadataEvidenceRevision"
              ],
              "gestionDesarrolloCulturalWorks": len(selected),
              "gestionDesarrolloCulturalAdmission": dict(
                  Counter(w.get("admissionStatus") for w in selected)
              ),
              "siblingGestionCulturaWorks": len(sibling_works),
              "siblingGestionCulturaAdmission": dict(
                  Counter(w.get("admissionStatus") for w in sibling_works)
              ),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "humanitiesActionQueueItems": queue["metrics"][
                  "humanitiesActionQueueItems"
              ],
              "humanitiesActionWorks": queue["metrics"]["humanitiesActionWorks"],
              "nextHumanitiesAction": next_action,
          }
          (root / "v34-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V34 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-gestion-desarrollo-cultural-authority-v34
          path: artifacts/thesis-gestion-desarrollo-cultural-v34/
          if-no-files-found: error
          retention-days: 14
