name: Sincronía · restore documented Formanchuk work title

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-formanchuk-cruz.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-formanchuk-source-verified-2000
  cancel-in-progress: false

jobs:
  restore-verified-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test exact source-to-record match and immutable legacy evidence
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_formanchuk_cruz
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly one title and author using republication
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-formanchuk-before.json
          python3 -m scripts.cucsh.restore_sincronia_formanchuk_cruz \
            --input /tmp/sincronia-formanchuk-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit source preservation, journal completeness and pending identity queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-formanchuk-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-formanchuk-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-formanchuk-pending-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("/tmp/sincronia-formanchuk-before.json").read_text())
          new=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          before={r["id"]:r for r in old["records"]}
          after={r["id"]:r for r in new["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[k for k in before if before[k]!=after[k]]
          assert changed==["cucsh:sincronia-legacy:12cf65c2ec1f08182eb5"],changed
          allowed={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence"
          }
          for k in changed:
              a,b=before[k],after[k]
              assert a["journal"]==b["journal"]=="Sincronía"
              assert not a.get("authors") and len(b["authors"])==1
              for f in set(a)|set(b):
                  if f not in allowed:
                      assert a.get(f)==b.get(f),(k,f)
              assert a["urls"]==b["urls"]
              assert a["legacyAccessStatus"]==b["legacyAccessStatus"]
          report=json.loads(Path("/tmp/sincronia-formanchuk-pending-audit.json").read_text())
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==99
          assert report["suspectedWorkIdentityCount"]==43
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FORMANCHUK_STRICT_PASS",len(changed),99,43)
          PY
      - name: Test full application and search integration
        run: |
          npm ci
          npm test
      - name: Commit only audited bibliographic metadata to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore original Sincronía Formanchuk work title from 2000 republication"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Save historical source-quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-formanchuk-verified-${{ github.run_id }}
          path: |
            /tmp/sincronia-formanchuk-historical-quality.json
            /tmp/sincronia-formanchuk-pending-audit.json
          retention-days: 30
          if-no-files-found: warn
