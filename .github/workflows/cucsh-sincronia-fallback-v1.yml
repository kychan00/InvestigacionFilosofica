name: Sincronía · source fallback for unavailable historical pages

# Opt-in once; no repeated crawls on normal feature branch edits.
on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-fallback-v1.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sincronia-fallback-v1
  cancel-in-progress: false

jobs:
  evidence-and-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reuse earlier evidence without repeating 195 original requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sincronia-prior
          gh run download 43035275585 \
            --repo "${{ github.repository }}" \
            --name sincronia-remaining-evidence-43035275585 \
            --dir /tmp/sincronia-prior
          test -s /tmp/sincronia-prior/sincronia-remaining-evidence.json
      - name: Test alternative source restrictions
        run: |
          python3 -m py_compile scripts/cucsh/probe_sincronia_fallback.py
          python3 -m unittest \
            tests.test_cucsh_sincronia_fallback \
            tests.test_cucsh_sincronia_remaining
      - name: Target unavailable pages using UdeG mirror and archive
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-fallback.json
          python3 -u -m scripts.cucsh.probe_sincronia_fallback \
            --before /tmp/cucsh-before-fallback.json \
            --first-evidence /tmp/sincronia-prior/sincronia-remaining-evidence.json \
            --after /tmp/cucsh-fallback-candidate.json \
            --report /tmp/sincronia-fallback-evidence.json \
            2>&1 | tee /tmp/sincronia-fallback.log
      - name: Validate and protect original publications
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-fallback.json \
            --after /tmp/cucsh-fallback-candidate.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input /tmp/cucsh-fallback-candidate.json \
            --output /tmp/sincronia-fallback-quality.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          original=json.loads(Path("/tmp/cucsh-before-fallback.json").read_text())
          candidate=json.loads(Path("/tmp/cucsh-fallback-candidate.json").read_text())
          assert len(original["records"])==len(candidate["records"])==1841
          old={r["id"]:r for r in original["records"]}
          new={r["id"]:r for r in candidate["records"]}
          assert old.keys()==new.keys()
          for rid,row in old.items():
              after=new[rid]
              for field in ("id","journal","issueNumber","urls","year","sourceId","doi"):
                  assert row.get(field)==after.get(field),(rid,field)
              if row.get("journal")!="Sincronía":
                  assert row==after,rid
              if row.get("authors"):
                  assert row["authors"]==after.get("authors"),rid
          print("SINCRONIA_FALLBACK_NO_LOSS_PASS")
          PY
      - name: Full application regression suite before committing
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/cucsh-fallback-candidate.json src/data/cucsh-filosofia.json
          npm ci
          npm test
      - name: Commit verified metadata to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          if git diff --cached --quiet; then
            echo "No new source-verified metadata; keeping original snapshot"
          else
            test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
            git diff --cached --check
            git commit -m "Enrich Sincronía from verified alternate UdeG archived sources"
            git push origin HEAD:feature/cucsh-sincronia
          fi
      - name: Upload detailed fallback evidence and unresolved cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-fallback-${{ github.run_id }}
          path: |
            /tmp/sincronia-fallback-evidence.json
            /tmp/sincronia-fallback-quality.json
            /tmp/sincronia-fallback.log
          if-no-files-found: warn
          retention-days: 30
