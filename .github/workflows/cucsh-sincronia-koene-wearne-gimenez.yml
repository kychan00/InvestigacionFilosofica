name: Sincronía · restore Koene Wearne Gimenez issue-five bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-koene-wearne-gimenez.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-koene-wearne-gimenez-issue-five
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test frozen source identities and bibliographic nuances
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_koene_wearne_gimenez
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three issue-five authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-kwg-before.json
          python3 -m scripts.cucsh.restore_sincronia_koene_wearne_gimenez \
            --input /tmp/cucsh-kwg-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit original metadata and zero-loss corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-kwg-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-kwg-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-kwg-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_koene_wearne_gimenez import SOURCES

          before_json=json.loads(Path("/tmp/cucsh-kwg-before.json").read_text(encoding="utf-8"))
          after_json=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={row["id"]:row for row in before_json["records"]}
          a={row["id"]:row for row in after_json["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==3 and set(changed)==set(SOURCES),changed

          for rid in changed:
              old,new=b[rid],a[rid]
              source=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {field for field in set(old)|set(new)
                      if old.get(field)!=new.get(field)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":source["author"],"sourceName":source["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["verifiedTitle"]==source["title"]
              assert ev["sourceArticleUrl"]==source["url"]
              assert ev["matchedIndexedYear"]==source["year"]
              assert ev["matchedIndexedIssue"]==source["issue"]
              assert ev["urlMatchLevel"]==source["evidence"]["urlMatchLevel"]
              assert ev["publicationVersionCaveat"]

          report=json.loads(Path("/tmp/sincronia-kwg-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==57
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==55
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_KWG_STRICT_PASS",len(changed),57)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus changes to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore Koene, Wearne, and Gimenez issue-five Sincronía authors"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload original quality and unresolved-author reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-koene-wearne-gimenez
          path: |
            /tmp/sincronia-kwg-historical-quality.json
            /tmp/sincronia-kwg-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
