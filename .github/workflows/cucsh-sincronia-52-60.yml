name: Sincronía 52-60 · targeted recovery probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-52-60.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-targeted-52-60
  cancel-in-progress: true

jobs:
  targeted-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read all article records from nine verifiable historical exemplars
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY' 2>&1 | tee /tmp/sincronia-52-60.log
          import json
          from collections import Counter
          from pathlib import Path
          from scripts.cucsh.sincronia_dialnet import (
              harvest_dialnet_records,
              KNOWN_ISSUE_URLS,
          )

          required = set(range(52, 61))
          assert all(issue in KNOWN_ISSUE_URLS for issue in required)
          records, covered = harvest_dialnet_records(
              max_issue=60,
              target_issues=required,
          )
          issue_counts = Counter(row["issueNumber"] for row in records)
          missing = sorted(required - set(covered))
          report = {
              "issueExemplars": {
                  str(issue): KNOWN_ISSUE_URLS[issue]
                  for issue in sorted(required)
              },
              "issuesCovered": covered,
              "issuesMissing": missing,
              "recordCount": len(records),
              "recordsByIssue": {
                  str(number): count
                  for number, count in sorted(issue_counts.items())
              },
          }
          Path("/tmp/sincronia-52-60.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("SINCRONIA_52_60_SUMMARY", json.dumps(report, ensure_ascii=False))
          if missing:
              raise SystemExit(2)
          PY

      - name: Upload historical audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-52-60-${{ github.run_id }}
          path: |
            /tmp/sincronia-52-60.log
            /tmp/sincronia-52-60.json
          if-no-files-found: warn
          retention-days: 14
