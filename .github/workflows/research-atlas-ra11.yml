name: Research Atlas RA11 · work-first topology

on:
  pull_request:
    paths:
      - "benchmark/research-atlas/v10/**"
      - "benchmark/research-atlas/v11/**"
      - "src/core/research-atlas-assembler.js"
      - "src/core/research-atlas-related.js"
      - "src/core/research-atlas-document-similarity.js"
      - "src/core/research-atlas-live.js"
      - "src/core/research-atlas-view.js"
      - "js/research-atlas.js"
      - "js/research-atlas-embed.js"
      - "index.html"
      - "research-atlas.html"
      - "tests/research-atlas-document-similarity.test.mjs"
      - "tests/research-atlas-work-first-policy.test.mjs"
      - "tests/research-atlas-main-integration.test.mjs"
      - "tests/research-atlas-page.test.mjs"
      - "tests/research-atlas-view.test.mjs"
      - "tests/research-atlas-controlled-demo.test.mjs"
      - "docs/RESEARCH_ATLAS_ARCHITECTURE_V1.md"
      - "docs/RESEARCH_ATLAS_WORK_FIRST_RA11.md"
      - "docs/RESEARCH_ATLAS_ENRICHMENT_READINESS_RA10.md"
      - "docs/RESEARCH_ATLAS_LIVE_RA7.md"
      - "docs/RESEARCH_ATLAS_MAIN_INTEGRATION_RA9.md"
      - ".github/workflows/research-atlas-ra11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-first-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate document similarity
        run: node --test tests/research-atlas-document-similarity.test.mjs

      - name: Validate work-first policy
        run: node --test tests/research-atlas-work-first-policy.test.mjs

      - name: Validate main Atlas integration
        run: |
          node --test tests/research-atlas-main-integration.test.mjs
          node --test tests/research-atlas-page.test.mjs
          node --test tests/research-atlas-view.test.mjs

      - name: Validate controlled demo
        run: node --test tests/research-atlas-controlled-demo.test.mjs

      - name: Preserve legacy lexical compatibility
        run: node --test tests/research-atlas-lexical.test.mjs

      - name: Run complete regression suite
        run: npm test
