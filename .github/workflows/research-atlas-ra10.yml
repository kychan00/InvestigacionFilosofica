name: Research Atlas RA10 · enrichment readiness

on:
  pull_request:
    paths:
      - "benchmark/research-atlas/v10/**"
      - "src/core/research-atlas-enrichment-readiness.js"
      - "scripts/research-atlas/evaluate-enrichment-readiness.mjs"
      - "scripts/research-atlas/publish_enrichment_to_hf.py"
      - ".github/workflows/research-atlas-authority-publish-v1.yml"
      - "tests/research-atlas-enrichment-readiness.test.mjs"
      - "docs/RESEARCH_ATLAS_ENRICHMENT_READINESS_RA10.md"
      - ".github/workflows/research-atlas-ra10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrichment-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: npm ci

      - name: Validate RA10 readiness contract
        run: node --test tests/research-atlas-enrichment-readiness.test.mjs

      - name: Generate current readiness report
        run: node scripts/research-atlas/evaluate-enrichment-readiness.mjs

      - name: Verify current state is safely blocked
        run: |
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(
            fs.readFileSync(
              "artifacts/research-atlas-ra10/readiness-report.json",
              "utf8"
            )
          );

          if (report.valid !== true) {
            throw new Error("RA10 readiness config is invalid");
          }
          if (report.ready !== false) {
            throw new Error("RA10 unexpectedly became production-ready without an explicit publication revision");
          }
          if (report.authorAuthority.ready !== false) {
            throw new Error("Author Authority must remain blocked in current config");
          }
          if (report.relatedWork.ready !== false) {
            throw new Error("Related Work must remain blocked in current config");
          }
          NODE

      - name: Validate Hugging Face publisher syntax
        run: python -m py_compile scripts/research-atlas/publish_enrichment_to_hf.py

      - name: Dry-run publisher against deterministic Authority fixture
        run: |
          npm run build:authority-batch-fixture
          python scripts/research-atlas/publish_enrichment_to_hf.py             --input artifacts/author-authority-batch-fixture-v1/site/author-authority-v1             --target-prefix research-atlas/author-authority/v1/dry-run             --output artifacts/research-atlas-ra10/hf-publication-dry-run.json             --dry-run

      - name: Run RA9 integration contract
        run: node --test tests/research-atlas-main-integration.test.mjs

      - name: Run complete regression suite
        run: npm test

      - name: Upload RA10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-atlas-ra10-readiness
          path: artifacts/research-atlas-ra10/
          if-no-files-found: error
