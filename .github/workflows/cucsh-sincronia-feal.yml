name: Sincronía · restore Rosemary Geisdorfer Feal byline

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-feal.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-feal-issue-five
  cancel-in-progress: false

jobs:
  restore-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test Feal attribution and documented year/host ambiguity
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_feal
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly one issue-five byline
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-feal-before.json
          python3 -m scripts.cucsh.restore_sincronia_feal \
            --input /tmp/cucsh-feal-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify no loss, frozen chronology, original link and 73 pending
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-feal-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-feal-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-feal-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("/tmp/cucsh-feal-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert changed==["cucsh:sincronia-legacy:f79fec0215a2a89cf4b6"],changed
          old,new=b[changed[0]],a[changed[0]]
          assert {k for k in set(old)|set(new) if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
          for field in ("title","issueNumber","year","urls","legacyAccessStatus","legacyOriginal"):
              assert old[field]==new[field],field
          assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
          assert new["issueNumber"]==5 and new["year"]==1998
          assert new["authors"]==[{"name":"Rosemary Geisdorfer Feal","sourceName":"Rosemary Geisdorfer Feal"}]
          ev=new["legacyAuthorEvidence"]
          assert ev["sourceCitedPublicationYear"]==1996
          assert ev["supportingCitationYear"]==1996
          assert ev["indexedYearPreserved"]==1998
          assert ev["chronologyConflict"]=="external-sources-cite-1996-legacy-index-1998"
          assert ev["urlMatchLevel"]=="matching-filename-different-historical-host"
          assert ev["sourceArticleUrl"]=="http://fuentes.csh.udg.mx/CUCSH/Sincronia/feal.html"
          assert ev["supportingCitedOriginalUrlVariant"]=="http://sincronia.cucsh.udg.mx/feal.html"

          report=json.loads(Path("/tmp/sincronia-feal-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==73
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==71
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FEAL_STRICT_PASS",len(changed),73)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus change to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore Rosemary Geisdorfer Feal Sincronía issue-five byline"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical audit and remaining author queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-feal-${{ github.run_id }}
          path: |
            /tmp/sincronia-feal-historical-quality.json
            /tmp/sincronia-feal-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
