name: Sincronía discovery probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-discovery.txt"

permissions:
  contents: read

concurrency:
  group: sincronia-discovery-probe-v2
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve committed snapshot
        run: cp src/data/cucsh-filosofia.json /tmp/cucsh-before.json

      - name: Harvest discovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/harvest.py 2>&1 | tee /tmp/cucsh-discovery.log

      - name: Validate discovery snapshot
        run: |
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before.json \
            --after src/data/cucsh-filosofia.json \
            --allow-incomplete-sincronia

      - name: Summarize historical coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          sync=[r for r in data["records"] if r.get("journal")=="Sincronía"]
          issues=sorted({r.get("issueNumber") for r in sync if isinstance(r.get("issueNumber"),int)})
          missing=sorted(set(range(1,91))-set(issues))
          legacy=[r for r in sync if r.get("legacyOriginal")]
          by_source={}
          for row in legacy:
              source=row.get("legacyMetadataSource") or "original"
              by_source[source]=by_source.get(source,0)+1

          print("SINCRONIA_DISCOVERY_TOTAL",len(sync))
          print("SINCRONIA_DISCOVERY_ISSUES",issues)
          print("SINCRONIA_DISCOVERY_MISSING",missing)
          print("SINCRONIA_DISCOVERY_LEGACY_BY_SOURCE",by_source)
          PY

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-discovery-${{ github.run_id }}
          path: |
            src/data/cucsh-filosofia.json
            /tmp/cucsh-discovery.log
          if-no-files-found: warn
          retention-days: 14
