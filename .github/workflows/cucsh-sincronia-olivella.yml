name: Sincronía · restore Jaume Martí-Olivella 1997 byline

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-olivella.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-olivella-issue-two
  cancel-in-progress: false

jobs:
  restore-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify evidence-locked restoration tests
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_olivella
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly one source byline
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-olivella-before.json
          python3 -m scripts.cucsh.restore_sincronia_olivella \
            --input /tmp/cucsh-olivella-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit no loss, preserved URLs and pending author queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-olivella-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-olivella-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-olivella-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("/tmp/cucsh-olivella-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert changed==["cucsh:sincronia-legacy:ee167409d83129e9eaee"],changed
          old,new=b[changed[0]],a[changed[0]]
          assert old["title"]==new["title"]
          assert old["urls"]==new["urls"]
          assert old["legacyAccessStatus"]==new["legacyAccessStatus"]
          assert {k for k in set(old)|set(new)
                  if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
          assert new["authors"]==[{"name":"Jaume Martí-Olivella","sourceName":"Jaume Martí-Olivella"}]
          evidence=new["legacyAuthorEvidence"]
          assert evidence["sourceUrl"]=="https://scholars.unh.edu/faculty_pubs/index.53.html"
          assert evidence["urlMatchLevel"]=="journal-original-url-from-legacy-index-only"

          report=json.loads(Path("/tmp/sincronia-olivella-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==78
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==76
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_OLIVELLA_STRICT_PASS",len(changed),78)
          PY
      - name: Run full application regression
        run: |
          npm ci
          npm test
      - name: Commit only one verified dataset change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore Jaume Martí-Olivella Sincronía 1997 byline"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload quality and pending-review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-olivella-${{ github.run_id }}
          path: |
            /tmp/sincronia-olivella-historical-quality.json
            /tmp/sincronia-olivella-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
