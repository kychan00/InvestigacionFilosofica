name: Sincronía Wayback CDX probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-cdx.txt"

permissions:
  contents: read

jobs:
  cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Probe exact historical issue URLs through CDX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import urllib.parse
          import urllib.request

          issues={
              2:("spring97.htm",1997),
              3:("summer97.htm",1997),
              8:("fall98.htm",1998),
              9:("winter99.htm",1999),
              16:("fall00.htm",2000),
              51:("summer09.htm",2009),
          }
          bases=[
              "http://sincronia.cucsh.udg.mx/",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/",
              "http://www.cucsh.udg.mx/CUCSH/Sincronia/",
          ]
          aliases={
              "spring":"primavera",
              "summer":"verano",
              "fall":"otono",
              "winter":"invierno",
          }

          candidates=[]
          for number,(filename,year) in issues.items():
              stem=filename.rsplit(".",1)[0]
              english=stem
              spanish=stem
              for src,dst in aliases.items():
                  if stem.startswith(src):
                      spanish=dst+stem[len(src):]
                      break
              for base in bases:
                  for variant in {english+".htm",spanish+".htm"}:
                      candidates.append((number,year,base+variant))

          def probe(item):
              number,year,url=item
              params=urllib.parse.urlencode({
                  "url":url,
                  "output":"json",
                  "fl":"timestamp,original,statuscode,mimetype",
                  "filter":"statuscode:200",
                  "collapse":"digest",
                  "from":str(max(1996,year-1)),
                  "to":str(min(2012,year+2)),
              })
              api="https://web.archive.org/cdx/search/cdx?"+params
              req=urllib.request.Request(api,headers={"User-Agent":"Mozilla/5.0 InvestigacionFilosofica/0.1"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      raw=response.read().decode("utf-8","replace")
                  payload=json.loads(raw)
                  rows=payload[1:] if isinstance(payload,list) and payload else []
                  return number,url,rows[:8],None
              except Exception as exc:
                  return number,url,[],repr(exc)

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for result in ex.map(probe,candidates):
                  results.append(result)

          found={}
          for number,url,rows,error in results:
              if rows:
                  found.setdefault(number,[]).append({"url":url,"rows":rows})
                  print("CDX_FOUND",number,url,rows[:3])
              elif error:
                  print("CDX_ERROR",number,url,error)

          print("CDX_SUMMARY",json.dumps(found,ensure_ascii=False))
          print("CDX_MISSING",sorted(set(issues)-set(found)))
          PY
