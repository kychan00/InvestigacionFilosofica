name: Thesis Investigación Educativa Authority V36

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/config/investigacion-educativa-authority-v36-baseline-v1.json"
      - "scripts/thesis/config/boundary-closure-contract-v5.json"
      - "scripts/thesis/audit_boundary_closure_v1.py"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/build_scope_boundary_matrix_v1.py"
      - "tests/test_thesis_investigacion_educativa_authority_v36.py"
      - "tests/test_thesis_scope_boundary_matrix.py"
      - "tests/test_thesis_boundary_closure_audit.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "docs/THESIS_INVESTIGACION_EDUCATIVA_AUTHORITY_V36.md"
      - ".github/workflows/thesis-investigacion-educativa-authority-v36.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_investigacion_educativa_authority_v36.py" -v
          python -m unittest discover -s tests -p "test_thesis_scope_boundary_matrix.py" -v
          python -m unittest discover -s tests -p "test_thesis_boundary_closure_audit.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-investigacion-educativa-v36
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-investigacion-educativa-v36
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-investigacion-educativa-v36/canonical-confidence.json \
            --output-report artifacts/thesis-investigacion-educativa-v36/confidence-report.json

      - name: Reproject Program Authority V36 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-investigacion-educativa-v36")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          (root / "canonical-v36.json").write_text(
              json.dumps(projected, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "observed-v36.json").write_text(
              json.dumps(projected_observed, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "projection-v36.json").write_text(
              json.dumps(projection, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "queue-v36.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Build Scope Boundary Matrix V5
        run: |
          python scripts/thesis/build_scope_boundary_matrix_v1.py \
            --observed-authorities artifacts/thesis-investigacion-educativa-v36/observed-v36.json \
            --canonical-corpus artifacts/thesis-investigacion-educativa-v36/canonical-v36.json \
            --output-dir artifacts/thesis-investigacion-educativa-v36/scope

      - name: Build Boundary Closure V5
        run: |
          python scripts/thesis/audit_boundary_closure_v1.py \
            --scope-report artifacts/thesis-investigacion-educativa-v36/scope/scope-boundary-matrix.json \
            --contract scripts/thesis/config/boundary-closure-contract-v5.json \
            --output-dir artifacts/thesis-investigacion-educativa-v36/boundary

      - name: Validate V36 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root = Path("artifacts/thesis-investigacion-educativa-v36")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "investigacion-educativa-authority-v36-baseline-v1.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v36.json").read_text())
          projection = json.loads((root / "projection-v36.json").read_text())
          queue = json.loads((root / "queue-v36.json").read_text())
          scope = json.loads(
              (root / "scope" / "scope-boundary-matrix.json").read_text()
          )
          boundary = json.loads(
              (root / "boundary" / "boundary-closure-audit.json").read_text()
          )
          confidence = json.loads((root / "confidence-report.json").read_text())
          expected = baseline["expected"]

          assert baseline["registryRevision"] == "2026-11-02.v36"
          assert int(registry["registryRevision"].rsplit(".v", 1)[1]) >= 36
          assert scope["policyRevision"] == baseline["scopePolicyRevision"]
          assert baseline["programMetadataEvidenceRevision"] == "2026-11-02.v4"
          assert confidence["programMetadataEvidenceRevision"] == "2026-11-02.v5"
          assert len(corpus["works"]) == 27576

          target = next(
              p for p in registry["programs"]
              if p["id"] == baseline["programRef"]
          )
          assert target["admissionState"] == "exclude"
          assert target["observedCount"] == expected["works"]

          selected = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["programRef"]
          ]
          assert len(selected) == expected["works"]
          assert Counter(
              w.get("admissionStatus") for w in selected
          ) == Counter(expected["admissionStatuses"])
          assert Counter(
              w.get("academicUnitRaw") for w in selected
          ) == Counter(expected["academicUnits"])
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("confidenceState")
              for w in selected
          ) == Counter({"unassessed": expected["unassessedWorks"]})
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("authorityApplicability")
              for w in selected
          ) == Counter({"allowed": expected["allowedWorks"]})
          assert sum(
              1 for w in selected
              if (w.get("programMetadataEvidence") or {}).get(
                  "authorityApplicability"
              ) == "blocked"
          ) == expected["blockedWorks"]

          date_quality = Counter(
              (w.get("date") or {}).get("quality") for w in selected
          )
          assert date_quality["valid"] == expected["validDateWorks"]
          years = sorted(
              int(str((w.get("date") or {}).get("value"))[:4])
              for w in selected
              if (w.get("date") or {}).get("quality") == "valid"
          )
          assert years[0] == expected["observedYears"]["min"]
          assert years[-1] == expected["observedYears"]["max"]

          by_id = {p["id"]: p for p in registry["programs"]}
          cognition = by_id[expected["siblingCognicionRef"]]
          assert cognition["admissionState"] == expected[
              "siblingCognicionAdmissionState"
          ]
          assert cognition["observedCount"] == expected["siblingCognicionWorks"]

          doctorate = by_id[expected["doctoradoEducacionRef"]]
          assert doctorate["admissionState"] == expected[
              "doctoradoEducacionAdmissionState"
          ]
          assert doctorate["observedCount"] == expected["doctoradoEducacionWorks"]

          expected_global = dict(expected["globalProjectedAdmission"])
          # V37: MCA Orientación Historia de la Arquitectura Mexicana REVIEW -> INCLUDE.
          expected_global["review"] -= 16
          expected_global["include"] += 16
          # V38: Maestría en Tecnologías para el Aprendizaje REVIEW -> EXCLUDE.
          expected_global["review"] -= 266
          expected_global["exclude"] += 266
          # V39: Licenciatura en Historia del Arte REVIEW -> INCLUDE.
          expected_global["review"] -= 2
          expected_global["include"] += 2
          # V40: MCA Conservación del Patrimonio Edificado REVIEW -> INCLUDE.
          expected_global["review"] -= 35
          expected_global["include"] += 35
          # V41: generic MCA safe-era records resolve; ambiguous items quarantine.
          expected_global["review"] -= 34
          expected_global["include"] += 27
          expected_global["quarantine"] += 7
          # V42: Didáctica de las Artes / Artes Visuales REVIEW -> EXCLUDE.
          expected_global["review"] -= 16
          expected_global["exclude"] += 16
          # V43: historical MCA Urbanismo y Desarrollo REVIEW -> EXCLUDE.
          expected_global["review"] -= 8
          expected_global["exclude"] += 8
          # V44: historical MCA Edificación Arquitectónica REVIEW -> EXCLUDE.
          expected_global["review"] -= 5
          expected_global["exclude"] += 5
          # V45: Didáctica de las Artes / Artes Escénicas REVIEW -> EXCLUDE.
          expected_global["review"] -= 3
          expected_global["exclude"] += 3
          assert projection["projectedAdmission"] == expected_global
          assert sum(projection["projectedAdmission"].values()) == 27576

          assert scope["metrics"]["matrixRows"] == expected["scopeMatrixRows"]
          education_boundary = next(
              row for row in scope["rows"]
              if row["id"] == "scope:education-research"
          )
          assert education_boundary["boundaryState"] == "boundary-review"
          assert [
              p["normalizedKey"] for p in education_boundary["programs"]
          ] == expected["educationBoundaryProgramKeys"]

          education_outside = next(
              row for row in scope["rows"]
              if row["id"] == "scope:education-investigacion-maestria"
          )
          assert education_outside["boundaryState"] == "outside-scope"
          assert education_outside["observedWorks"] == expected[
              "educationOutsideWorks"
          ]
          assert [
              p["normalizedKey"] for p in education_outside["programs"]
          ] == ["maestria en investigacion educativa"]
          assert education_outside["programs"][0]["programAuthority"][
              "admissionState"
          ] == "exclude"

          assert boundary["closureState"] == "closed"
          assert boundary["policyRevision"] == baseline["scopePolicyRevision"]
          assert boundary["metrics"]["boundaryRows"] == expected[
              "boundaryReviewRows"
          ]
          assert boundary["metrics"]["boundaryProgramKeys"] == expected[
              "boundaryReviewProgramKeys"
          ]
          assert boundary["metrics"]["authorityObservedWorks"] == expected[
              "boundaryReviewWorks"
          ]
          assert boundary["metrics"]["admissionStates"] == expected[
              "boundaryReviewStates"
          ]
          assert boundary["metrics"]["violations"] == 0

          target_key = "maestria en investigacion educativa"
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["items"]
          )
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["humanitiesActionItems"]
          )
          assert queue["metrics"]["humanitiesActionQueueItems"] == (
              expected["humanitiesActionQueueItems"] - 31
          )
          assert queue["metrics"]["humanitiesActionWorks"] == (
              expected["humanitiesActionWorks"] - 413
          )
          assert queue["metrics"]["workReviewQueueItems"] == expected[
              "workReviewQueueItems"
          ] + 2
          assert queue["metrics"]["workReviewWorks"] == expected[
              "workReviewWorks"
          ] + 28

          next_action = queue["nextHumanitiesAction"]
          assert expected["nextHumanitiesActionKey"] == (
              "maestria en arquitectura orientacion en historia de la arquitectura mexicana"
          )
          assert next_action["normalizedKey"] == "maestria en arquitectura orientacion arte y comunicacion"
          assert next_action["count"] == 7

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "programMetadataEvidenceRevision": confidence[
                  "programMetadataEvidenceRevision"
              ],
              "investigacionEducativaWorks": len(selected),
              "investigacionEducativaAdmission": dict(
                  Counter(w.get("admissionStatus") for w in selected)
              ),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "boundaryReviewWorks": boundary["metrics"]["authorityObservedWorks"],
              "boundaryReviewProgramKeys": boundary["metrics"]["boundaryProgramKeys"],
              "humanitiesActionQueueItems": queue["metrics"][
                  "humanitiesActionQueueItems"
              ],
              "humanitiesActionWorks": queue["metrics"]["humanitiesActionWorks"],
              "workReviewQueueItems": queue["metrics"]["workReviewQueueItems"],
              "workReviewWorks": queue["metrics"]["workReviewWorks"],
              "nextHumanitiesAction": next_action,
          }
          (root / "v36-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-investigacion-educativa-authority-v36
          path: artifacts/thesis-investigacion-educativa-v36/
          if-no-files-found: error
          retention-days: 14
