name: Territorio · import historical portrait (one-time)
on:
  pull_request:
    paths:
      - '.github/workflows/territory-kant-import.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public-domain engraving and validate source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 45 --user-agent 'InvestigacionFilosofica/1.0 (public academic catalogue)' 'https://upload.wikimedia.org/wikipedia/commons/c/cc/Immanuel_Kant_%28portrait%29.jpg' -o /tmp/kant.jpg
          python3 - <<'PY'
          import base64, hashlib, struct
          from pathlib import Path
          raw=Path('/tmp/kant.jpg').read_bytes()
          assert 200000 < len(raw) < 300000 and raw[:2]==b'\xff\xd8'
          i=2
          while i < len(raw):
              assert raw[i]==255
              while raw[i]==255: i+=1
              marker=raw[i]; i+=1
              size=int.from_bytes(raw[i:i+2],'big')
              if marker in (192,193,194):
                  h,w=struct.unpack('>HH',raw[i+3:i+7])
                  assert (w,h)==(677,845),(w,h)
                  break
              i+=size
          else: raise ValueError('Missing JPEG frame')
          print('KANT_SHA256 '+hashlib.sha256(raw).hexdigest())
          print('KANT_BYTES '+str(len(raw)))
          data=base64.b64encode(raw).decode('ascii')
          for j in range(0,len(data),2048):
              print('KANT_CHUNK '+str(j//2048)+' '+data[j:j+2048])
          print('KANT_COMPLETE '+str(len(data)))
          PY
