name: Thesis public V1 release T2DF

on:
  pull_request:
    paths:
      - "tesis.html"
      - "js/thesis-demo.js"
      - "css/thesis-demo.css"
      - "src/core/thesis-demo-search.js"
      - "src/core/editorial-udg-search.js"
      - "data/editorial/udg-philosophy-v1/index.json"
      - "tests/thesis-public-v1-release.test.mjs"
      - "tests/thesis-demo.test.mjs"
      - "tests/editorial-udg-public-view.test.mjs"
      - "docs/THESIS_PUBLIC_V1_RELEASE_T2DF.md"
      - "docs/THESIS_EDITORIAL_UDG_PUBLIC_VIEW_T2DG.md"
      - "release-manifest.json"
      - ".github/workflows/thesis-public-v1-release-t2df.yml"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate public V1 identity and thesis contracts
        run: |
          node --check js/thesis-demo.js
          node --check src/core/editorial-udg-search.js
          node --test \
            tests/thesis-public-v1-release.test.mjs \
            tests/thesis-philosophy-contribute.test.mjs \
            tests/thesis-demo.test.mjs \
            tests/editorial-udg-public-view.test.mjs
