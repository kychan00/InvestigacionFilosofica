name: Sincronía archived index probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-index-probe.txt"

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve and inspect archived issue indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          indexes=[
              "http://sincronia.cucsh.udg.mx/num_anteriores.html",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/num_anteriores.html",
              "http://www.cucsh.udg.mx/CUCSH/Sincronia/num_anteriores.html",
          ]

          def request(url,timeout=12):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 InvestigacionFilosofica/0.1"})
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  return response.read()

          def closest(url):
              api="https://archive.org/wayback/available?"+urllib.parse.urlencode({
                  "url":url,
                  "timestamp":"20101231",
              })
              payload=json.loads(request(api,10).decode("utf-8","replace"))
              return (payload.get("archived_snapshots") or {}).get("closest") or {}

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.href=None
                  self.parts=[]
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="a":
                      self.href=dict(attrs).get("href")
                      self.parts=[]
              def handle_data(self,data):
                  if self.href is not None:
                      self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=="a" and self.href is not None:
                      self.links.append((self.href," ".join(self.parts).strip()))
                      self.href=None
                      self.parts=[]

          for original in indexes:
              try:
                  snap=closest(original)
              except Exception as exc:
                  print("INDEX_AVAIL_ERROR",original,repr(exc))
                  continue
              if not snap.get("available"):
                  print("INDEX_NO_SNAPSHOT",original)
                  continue

              snapshot=snap["url"].replace("http://web.archive.org/","https://web.archive.org/")
              snapshot=re.sub(r"/web/(\d{14})/",r"/web/\1id_/",snapshot,count=1)
              print("INDEX_SNAPSHOT",original,snap.get("timestamp"),snapshot)

              try:
                  data=request(snapshot,15)
              except Exception as exc:
                  print("INDEX_FETCH_ERROR",original,repr(exc))
                  continue

              parser=Links()
              parser.feed(data.decode("latin-1","replace"))
              parser.close()

              print("INDEX_BYTES",len(data),"LINKS",len(parser.links))
              for href,text in parser.links:
                  clean=html.unescape(text)
                  low=(href+" "+clean).lower()
                  if (
                      re.search(r"(97|98|99|00)",low)
                      or re.search(r"\b(2|3|8|9|16)\b",clean)
                      or any(token in low for token in ("spring","summer","fall","winter","primavera","verano","otono","invierno"))
                  ):
                      print("INDEX_LINK",repr(href),repr(clean))
          PY
