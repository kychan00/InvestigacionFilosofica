name: Audit OpenAlex V2 with abstracts

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb huggingface_hub

      - name: Audit V2 with abstracts
        run: |
          python scripts/openalex/audit_v2_with_abstracts.py

      - name: Upload context audit
        uses: actions/upload-artifact@v4
        with:
          name: openalex-philosophy-v2-context-audit
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/openalex/philosophy-v2-context-audit.parquet
