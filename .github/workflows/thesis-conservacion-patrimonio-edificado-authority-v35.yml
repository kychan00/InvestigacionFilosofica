name: Thesis Conservación Patrimonio Edificado Authority V35

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/conservacion-patrimonio-edificado-authority-v35-baseline-v1.json"
      - "scripts/thesis/config/program-metadata-evidence-confidence-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "tests/test_thesis_conservacion_patrimonio_edificado_authority_v35.py"
      - "tests/test_thesis_historia_arquitectura_authority_v32.py"
      - "tests/test_thesis_canonical_corpus.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "docs/THESIS_CONSERVACION_PATRIMONIO_EDIFICADO_AUTHORITY_V35.md"
      - ".github/workflows/thesis-conservacion-patrimonio-edificado-authority-v35.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_conservacion_patrimonio_edificado_authority_v35.py" -v
          python -m unittest discover -s tests -p "test_thesis_historia_arquitectura_authority_v32.py" -v
          python -m unittest discover -s tests -p "test_thesis_canonical_corpus.py" -v
          python -m unittest discover -s tests -p "test_thesis_program_curation_queue.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-conservacion-patrimonio-v35
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-conservacion-patrimonio-v35
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-conservacion-patrimonio-v35/canonical-confidence.json \
            --output-report artifacts/thesis-conservacion-patrimonio-v35/confidence-report.json

      - name: Reproject V35 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-conservacion-patrimonio-v35")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          (root / "canonical-v35.json").write_text(
              json.dumps(projected, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "projection-v35.json").write_text(
              json.dumps(projection, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          (root / "queue-v35.json").write_text(
              json.dumps(queue, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate V35 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root = Path("artifacts/thesis-conservacion-patrimonio-v35")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "conservacion-patrimonio-edificado-authority-v35-baseline-v1.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v35.json").read_text())
          projection = json.loads((root / "projection-v35.json").read_text())
          queue = json.loads((root / "queue-v35.json").read_text())
          confidence = json.loads((root / "confidence-report.json").read_text())
          scope = json.loads(
              Path("scripts/thesis/config/scope-boundary-matrix-v1.json").read_text()
          )
          expected = baseline["expected"]

          assert baseline["registryRevision"] == "2026-11-02.v35"
          assert int(registry["registryRevision"].rsplit(".v", 1)[1]) >= 35
          assert baseline["scopePolicyRevision"] == "2026-11-02.v4"
          assert scope["policyRevision"] == "2026-11-02.v5"
          assert (
              confidence["programMetadataEvidenceRevision"]
              == baseline["programMetadataEvidenceRevision"]
          )
          assert len(corpus["works"]) == 27576

          target = next(
              p for p in registry["programs"]
              if p["id"] == baseline["programRef"]
          )
          base = next(
              p for p in registry["programs"]
              if p["id"] == baseline["baseProgramRef"]
          )
          history = next(
              p for p in registry["programs"]
              if p["id"] == baseline["historyHistoricalRef"]
          )

          assert target["admissionState"] == "include"
          assert target["possibleSuccessorRef"] == base["id"]
          assert base["admissionState"] == expected["baseProgramAdmissionState"]
          assert history["admissionState"] == expected["historyHistoricalAdmissionState"]

          selected = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["programRef"]
          ]
          assert len(selected) == expected["works"]
          assert Counter(
              w.get("admissionStatus") for w in selected
          ) == Counter(expected["admissionStatuses"])
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("confidenceState")
              for w in selected
          ) == Counter({"unassessed": expected["unassessedWorks"]})
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("authorityApplicability")
              for w in selected
          ) == Counter({"allowed": expected["allowedWorks"]})
          assert sum(
              1 for w in selected
              if (w.get("programMetadataEvidence") or {}).get(
                  "authorityApplicability"
              ) == "blocked"
          ) == expected["blockedWorks"]
          assert Counter(w.get("academicUnitRaw") for w in selected) == Counter(
              expected["academicUnits"]
          )

          date_quality = Counter(
              (w.get("date") or {}).get("quality") for w in selected
          )
          assert date_quality["valid"] == expected["validDateWorks"]
          assert date_quality["unknown"] == expected["unknownDateWorks"]
          valid_years = sorted(
              int(str((w.get("date") or {}).get("value"))[:4])
              for w in selected
              if (w.get("date") or {}).get("quality") == "valid"
          )
          assert valid_years[0] == expected["observedYears"]["min"]
          assert valid_years[-1] == expected["observedYears"]["max"]

          base_works = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["baseProgramRef"]
          ]
          history_works = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["historyHistoricalRef"]
          ]
          assert len(base_works) == expected["baseProgramWorks"] - 51
          assert Counter(
              w.get("admissionStatus") for w in base_works
          ) == Counter({"review": len(base_works)})
          assert len(history_works) == expected["historyHistoricalWorks"]
          assert Counter(
              w.get("admissionStatus") for w in history_works
          ) == Counter({"include": expected["historyHistoricalWorks"]})

          expected_global = dict(expected["globalProjectedAdmission"])
          # V36: Maestría en Investigación Educativa REVIEW -> EXCLUDE.
          expected_global["review"] -= 34
          expected_global["exclude"] += 34
          # V37: MCA Orientación Historia de la Arquitectura Mexicana REVIEW -> INCLUDE.
          expected_global["review"] -= 16
          expected_global["include"] += 16
          # V38: Maestría en Tecnologías para el Aprendizaje REVIEW -> EXCLUDE.
          expected_global["review"] -= 266
          expected_global["exclude"] += 266
          # V39: Licenciatura en Historia del Arte REVIEW -> INCLUDE.
          expected_global["review"] -= 2
          expected_global["include"] += 2
          # V40: MCA Conservación del Patrimonio Edificado REVIEW -> INCLUDE.
          expected_global["review"] -= 35
          expected_global["include"] += 35
          assert projection["projectedAdmission"] == expected_global
          assert sum(projection["projectedAdmission"].values()) == 27576

          target_key = "maestria en conservacion del patrimonio edificado"
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["items"]
          )
          assert all(
              item["normalizedKey"] != target_key
              for item in queue["humanitiesActionItems"]
          )
          assert queue["metrics"]["humanitiesActionQueueItems"] == (
              expected["humanitiesActionQueueItems"] - 17
          )
          assert queue["metrics"]["humanitiesActionWorks"] == (
              expected["humanitiesActionWorks"] - 353
          )
          assert queue["metrics"]["workReviewQueueItems"] == (
              expected["workReviewQueueItems"]
          )
          assert queue["metrics"]["workReviewWorks"] == expected["workReviewWorks"]
          assert queue["metrics"]["gateIneligibleGroupsOmitted"] >= (
              expected["externalInstitutionGroupsOmitted"]
          )
          assert queue["metrics"]["gateIneligibleWorksOmitted"] >= (
              expected["externalInstitutionWorksOmitted"]
          )
          assert all(
              item["normalizedKey"] != "doctorado en antropologia social"
              for item in queue["humanitiesActionItems"]
          )

          next_action = queue["nextHumanitiesAction"]
          assert expected["nextHumanitiesActionKey"] == "maestria en investigacion educativa"
          assert next_action["normalizedKey"] == "maestria en ciencias de la arquitectura"
          assert next_action["count"] == 34

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "programMetadataEvidenceRevision": confidence[
                  "programMetadataEvidenceRevision"
              ],
              "conservacionPatrimonioWorks": len(selected),
              "conservacionPatrimonioAdmission": dict(
                  Counter(w.get("admissionStatus") for w in selected)
              ),
              "baseMcaWorks": len(base_works),
              "baseMcaAdmission": dict(
                  Counter(w.get("admissionStatus") for w in base_works)
              ),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "humanitiesActionQueueItems": queue["metrics"][
                  "humanitiesActionQueueItems"
              ],
              "humanitiesActionWorks": queue["metrics"]["humanitiesActionWorks"],
              "workReviewQueueItems": queue["metrics"]["workReviewQueueItems"],
              "workReviewWorks": queue["metrics"]["workReviewWorks"],
              "nextHumanitiesAction": next_action,
          }
          (root / "v35-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V35 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-conservacion-patrimonio-edificado-authority-v35
          path: artifacts/thesis-conservacion-patrimonio-v35/
          if-no-files-found: error
          retention-days: 14
