name: Sincronía · backfill four verified issue 47 and 48 gaps

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-2008-gaps-v1.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: sincronia-2008-gap-backfill
  cancel-in-progress: false

jobs:
  preserve-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reuse previously preserved issue-level Dialnet evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 43131658279
          github-token: ${{ github.token }}
          name: sincronia-2008-identity-43131658279
          path: /tmp/sincronia-verified-audit
      - name: Test strict article identity and duplicate safeguards
        run: |
          python3 -m py_compile scripts/cucsh/backfill_sincronia_2008_verified_gaps.py
          python3 -m unittest tests.test_cucsh_sincronia_2008_gaps

      - name: Prove 24 existing article identities and stage four verified gaps
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-2008-gaps-before.json
          python3 -u -m scripts.cucsh.backfill_sincronia_2008_verified_gaps \
            --before /tmp/cucsh-2008-gaps-before.json \
            --audit /tmp/sincronia-verified-audit/sincronia-2008-identity-report.json \
            --after /tmp/cucsh-2008-gaps-candidate.json \
            --report /tmp/cucsh-2008-gaps-evidence.json \
            2>&1 | tee /tmp/cucsh-2008-gaps.log
      - name: Strict non-destructive validation of complete dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-2008-gaps-before.json \
            --after /tmp/cucsh-2008-gaps-candidate.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input /tmp/cucsh-2008-gaps-candidate.json \
            --output /tmp/cucsh-2008-gaps-quality.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          prior=json.loads(Path("/tmp/cucsh-2008-gaps-before.json").read_text())
          after=json.loads(Path("/tmp/cucsh-2008-gaps-candidate.json").read_text())
          before={r["id"]:r for r in prior["records"]}
          updated={r["id"]:r for r in after["records"]}
          assert set(before).issubset(updated)
          assert all(before[rid]==updated[rid] for rid in before)
          assert len(updated)-len(before)==4
          added=[row for rid,row in updated.items() if rid not in before]
          assert {r["issueNumber"] for r in added}=={47,48}
          assert sum(r["issueNumber"]==47 for r in added)==1
          assert sum(r["issueNumber"]==48 for r in added)==3
          assert sum(r["journal"]=="Sincronía" for r in updated.values()) == (
            sum(r["journal"]=="Sincronía" for r in before.values())+4
          )
          print("SINCRONIA_2008_NO_LOSS_PASS", len(before), len(updated))
          PY
      - name: Validate full federated-search regression suite
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/cucsh-2008-gaps-candidate.json src/data/cucsh-filosofia.json
          npm ci
          npm test
      - name: Commit only validated new articles to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
          git diff --cached --check
          git commit -m "Backfill four source-verified Sincronía articles in issues 47 and 48"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Save article-level evidence for the four new works
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-2008-gaps-${{ github.run_id }}
          path: |
            /tmp/cucsh-2008-gaps-evidence.json
            /tmp/cucsh-2008-gaps-quality.json
            /tmp/cucsh-2008-gaps.log
          if-no-files-found: warn
          retention-days: 30
