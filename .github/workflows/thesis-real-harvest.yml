name: Thesis real corpus harvest

on:
  pull_request:
    paths:
      - "scripts/thesis/harvest_real_corpus_v1.py"
      - "scripts/thesis/build_canonical_corpus_v1.py"
      - "scripts/thesis/config/**"
      - "scripts/thesis/fixtures/**"
      - "tests/test_thesis_real_harvest.py"
      - "docs/THESIS_HUMANITIES_REAL_HARVEST_V1.md"
      - ".github/workflows/thesis-real-harvest.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Harvest mode"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - full
      riudg_from:
        description: "Optional OAI-PMH from datestamp (ISO 8601)"
        required: false
        type: string
      riudg_until:
        description: "Optional OAI-PMH until datestamp (ISO 8601)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile
        run: |
          python -m py_compile \
            scripts/thesis/build_canonical_corpus_v1.py \
            scripts/thesis/harvest_real_corpus_v1.py

      - name: Offline unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_thesis_real_harvest.py" \
            -v

      - name: Harvest sample for pull request
        if: github.event_name == 'pull_request'
        run: |
          rm -rf artifacts/thesis-real-harvest
          python scripts/thesis/harvest_real_corpus_v1.py \
            --mode sample \
            --riudg-max-records 100 \
            --riudg-max-pages 2 \
            --udgvirtual-max-records 10 \
            --delay 0.25 \
            --output-dir artifacts/thesis-real-harvest

      - name: Harvest requested mode
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          RIUDG_FROM: ${{ inputs.riudg_from }}
          RIUDG_UNTIL: ${{ inputs.riudg_until }}
        run: |
          rm -rf artifacts/thesis-real-harvest
          ARGS=(
            --mode "$MODE"
            --delay 0.35
            --output-dir artifacts/thesis-real-harvest
          )
          if [ -n "$RIUDG_FROM" ]; then
            ARGS+=(--riudg-from "$RIUDG_FROM")
          fi
          if [ -n "$RIUDG_UNTIL" ]; then
            ARGS+=(--riudg-until "$RIUDG_UNTIL")
          fi
          python scripts/thesis/harvest_real_corpus_v1.py "${ARGS[@]}"

      - name: Validate reconciliation and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-real-harvest")
          ledger = json.loads((root / "coverage-ledger.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          catalog = json.loads((root / "observed-authorities.json").read_text())

          assert ledger["providers"]["riudg"]["records"] > 0
          assert ledger["providers"]["riudg"]["completeListSize"] is not None
          assert ledger["providers"]["udgvirtual"]["enumeratedHandles"] == 147
          assert ledger["providers"]["udgvirtual"]["reportedTotal"] == 147
          assert manifest["files"]
          assert isinstance(catalog["programs"], list)

          print(json.dumps({
              "riudg": ledger["providers"]["riudg"],
              "udgvirtual": ledger["providers"]["udgvirtual"],
              "corpus": ledger["corpus"],
              "programsObserved": len(catalog["programs"]),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Upload harvest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-real-harvest-v1
          path: artifacts/thesis-real-harvest/
          if-no-files-found: error
          retention-days: 14
