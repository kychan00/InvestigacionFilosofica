name: Thesis real corpus harvest

on:
  pull_request:
    paths:
      - "scripts/thesis/harvest_real_corpus_v1.py"
      - "scripts/thesis/build_canonical_corpus_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_scope_boundary_matrix_v1.py"
      - "scripts/thesis/audit_boundary_closure_v1.py"
      - "scripts/thesis/audit_outside_scope_closure_v1.py"
      - "scripts/thesis/audit_program_metadata_contamination_v1.py"
      - "scripts/thesis/audit_program_metadata_provenance_v1.py"
      - "scripts/thesis/audit_program_metadata_evidence_confidence_v1.py"
      - "scripts/thesis/config/**"
      - "scripts/thesis/fixtures/**"
      - "tests/test_thesis_real_harvest.py"
      - "tests/test_thesis_program_curation_queue.py"
      - "tests/test_thesis_program_coverage_audit.py"
      - "tests/test_thesis_scope_boundary_matrix.py"
      - "tests/test_thesis_boundary_closure_audit.py"
      - "tests/test_thesis_outside_scope_closure_audit.py"
      - "tests/test_thesis_political_international_closure_audit.py"
      - "tests/test_thesis_program_metadata_contamination_audit.py"
      - "tests/test_thesis_program_metadata_provenance_audit.py"
      - "tests/test_thesis_program_metadata_evidence_confidence.py"
      - "docs/THESIS_HUMANITIES_PROGRAM_COVERAGE_AUDIT_V1.md"
      - "docs/THESIS_HUMANITIES_SCOPE_BOUNDARY_MATRIX_V1.md"
      - "docs/THESIS_HUMANITIES_BOUNDARY_CLOSURE_AUDIT_V1.md"
      - "docs/THESIS_HUMANITIES_BOUNDARY_CLOSURE_AUDIT_V2.md"
      - "docs/THESIS_HUMANITIES_URBAN_TERRITORY_SCOPE_POLICY_RECONCILIATION_V2.md"
      - "docs/THESIS_HUMANITIES_SOCIAL_SCIENCES_OUTSIDE_SCOPE_CLOSURE_V1.md"
      - "docs/THESIS_HUMANITIES_POLITICAL_INTERNATIONAL_OUTSIDE_SCOPE_CLOSURE_V1.md"
      - "docs/THESIS_HUMANITIES_REAL_HARVEST_V1.md"
      - "docs/THESIS_PROGRAM_METADATA_CONTAMINATION_PSYCHOLOGY_V1.md"
      - "docs/THESIS_PROGRAM_METADATA_PROVENANCE_PSYCHOLOGY_V1.md"
      - "docs/THESIS_PROGRAM_METADATA_EVIDENCE_CONFIDENCE_V1.md"
      - "docs/THESIS_PROGRAM_AUTHORITY_PSYCHOLOGY_V24.md"
      - ".github/workflows/thesis-real-harvest.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Harvest mode"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - full
      riudg_from:
        description: "Optional OAI-PMH from datestamp (ISO 8601)"
        required: false
        type: string
      riudg_until:
        description: "Optional OAI-PMH until datestamp (ISO 8601)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile
        run: |
          python -m py_compile \
            scripts/thesis/build_canonical_corpus_v1.py \
            scripts/thesis/harvest_real_corpus_v1.py \
            scripts/thesis/build_program_curation_queue_v1.py \
            scripts/thesis/audit_program_coverage_v1.py \
            scripts/thesis/build_scope_boundary_matrix_v1.py \
            scripts/thesis/audit_boundary_closure_v1.py \
            scripts/thesis/audit_outside_scope_closure_v1.py \
            scripts/thesis/audit_program_metadata_contamination_v1.py \
            scripts/thesis/audit_program_metadata_provenance_v1.py \
            scripts/thesis/audit_program_metadata_evidence_confidence_v1.py

      - name: Offline unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_thesis_*harvest.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_curation_queue.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_coverage_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_scope_boundary_matrix.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_boundary_closure_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_outside_scope_closure_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_political_international_closure_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_metadata_contamination_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_metadata_provenance_audit.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_program_metadata_evidence_confidence.py" \
            -v

      - name: Harvest sample for pull request
        if: github.event_name == 'pull_request'
        run: |
          rm -rf artifacts/thesis-real-harvest
          python scripts/thesis/harvest_real_corpus_v1.py \
            --mode sample \
            --riudg-max-records 100 \
            --riudg-max-pages 2 \
            --udgvirtual-max-records 10 \
            --delay 0.25 \
            --output-dir artifacts/thesis-real-harvest

      - name: Harvest requested mode
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          RIUDG_FROM: ${{ inputs.riudg_from }}
          RIUDG_UNTIL: ${{ inputs.riudg_until }}
        run: |
          rm -rf artifacts/thesis-real-harvest
          ARGS=(
            --mode "$MODE"
            --delay 0.35
            --output-dir artifacts/thesis-real-harvest
          )
          if [ -n "$RIUDG_FROM" ]; then
            ARGS+=(--riudg-from "$RIUDG_FROM")
          fi
          if [ -n "$RIUDG_UNTIL" ]; then
            ARGS+=(--riudg-until "$RIUDG_UNTIL")
          fi
          python scripts/thesis/harvest_real_corpus_v1.py "${ARGS[@]}"

      - name: Validate reconciliation and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-real-harvest")
          ledger = json.loads((root / "coverage-ledger.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          catalog = json.loads((root / "observed-authorities.json").read_text())

          assert ledger["providers"]["riudg"]["records"] > 0
          assert ledger["providers"]["riudg"]["completeListSize"] is not None
          assert ledger["providers"]["udgvirtual"]["enumeratedHandles"] == 147
          assert ledger["providers"]["udgvirtual"]["reportedTotal"] == 147
          assert manifest["files"]
          assert isinstance(catalog["programs"], list)

          print(json.dumps({
              "riudg": ledger["providers"]["riudg"],
              "udgvirtual": ledger["providers"]["udgvirtual"],
              "corpus": ledger["corpus"],
              "programsObserved": len(catalog["programs"]),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build Psychology metadata contamination audit
        run: |
          rm -rf artifacts/thesis-program-metadata-contamination
          python scripts/thesis/audit_program_metadata_contamination_v1.py \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --source-records artifacts/thesis-real-harvest/source-records.jsonl.gz \
            --program-key "licenciatura en psicologia" \
            --foundation-year 1975 \
            --output-dir artifacts/thesis-program-metadata-contamination

      - name: Validate Psychology metadata contamination audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-program-metadata-contamination")
          audit = json.loads(
              (root / "program-metadata-contamination-audit.json").read_text()
          )

          assert audit["schemaVersion"] == "thesis-program-metadata-contamination-audit-v1"
          assert audit["decisionConstraint"] == "audit-does-not-change-admission"
          assert audit["authorityDecision"] == "hold"
          assert audit["targetProgramKey"] == "licenciatura en psicologia"
          assert audit["foundationYear"] == 1975
          assert audit["metrics"]["observedWorks"] >= 0
          assert (
              audit["metrics"]["sourceProgramAgreementWorks"]
              + audit["metrics"]["sourceProgramDisagreementWorks"]
              == audit["metrics"]["observedWorks"]
          )

          print(json.dumps({
              "conclusion": audit["conclusion"],
              "authorityDecision": audit["authorityDecision"],
              "metrics": audit["metrics"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Validate full Psychology contamination baseline
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path(
                  "artifacts/thesis-program-metadata-contamination/"
                  "program-metadata-contamination-audit.json"
              ).read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "psychology-metadata-contamination-baseline-v1.json"
              ).read_text()
          )

          assert audit["decisionConstraint"] == baseline["decisionConstraint"]
          assert audit["authorityDecision"] == baseline["authorityDecision"]

          for key, expected in baseline["expectedMetrics"].items():
              actual = audit["metrics"][key]
              assert actual == expected, (key, actual, expected)

          print(json.dumps({
              "baseline": "closed",
              "expectedMetrics": baseline["expectedMetrics"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build Psychology metadata provenance cohorts
        run: |
          rm -rf artifacts/thesis-program-metadata-provenance
          python scripts/thesis/audit_program_metadata_provenance_v1.py \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --source-records artifacts/thesis-real-harvest/source-records.jsonl.gz \
            --program-key "licenciatura en psicologia" \
            --foundation-year 1975 \
            --legacy-accession-day "2015-09-09" \
            --output-dir artifacts/thesis-program-metadata-provenance

      - name: Validate Psychology metadata provenance cohorts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/thesis-program-metadata-provenance/"
                  "program-metadata-provenance-cohort.json"
              ).read_text()
          )

          assert report["schemaVersion"] == "thesis-program-metadata-provenance-cohort-v1"
          assert report["decisionConstraint"] == "provenance-does-not-change-admission"
          assert report["authorityDecision"] == "hold"
          assert (
              report["gateRecommendation"]
              == "do-not-apply-program-authority-unconditionally"
          )
          assert report["legacyAccessionDay"] == "2015-09-09"

          legacy = report["cohorts"]["legacy-migration-review"]
          later = report["cohorts"]["post-migration-review"]

          assert legacy["provenanceState"] == "low-trust-review"
          assert later["provenanceState"] == "higher-context-review"
          assert (
              legacy["metrics"]["works"] + later["metrics"]["works"]
              == len(report["records"])
          )

          print(json.dumps({
              "authorityDecision": report["authorityDecision"],
              "gateRecommendation": report["gateRecommendation"],
              "cohorts": report["cohorts"],
              "anomalyConcentration": report["anomalyConcentration"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Validate full Psychology provenance baseline
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/thesis-program-metadata-provenance/"
                  "program-metadata-provenance-cohort.json"
              ).read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "psychology-metadata-provenance-baseline-v1.json"
              ).read_text()
          )

          assert report["decisionConstraint"] == baseline["decisionConstraint"]
          assert report["authorityDecision"] == baseline["authorityDecision"]
          assert report["legacyAccessionDay"] == baseline["legacyAccessionDay"]

          for cohort_id, expected in baseline["expectedCohorts"].items():
              actual = report["cohorts"][cohort_id]
              assert actual["provenanceState"] == expected["provenanceState"]
              assert actual["metrics"] == expected["metrics"], (
                  cohort_id,
                  actual["metrics"],
                  expected["metrics"],
              )

          assert (
              report["anomalyConcentration"]
              == baseline["requiredAnomalyConcentration"]
          )

          print(json.dumps({
              "baseline": "closed",
              "expectedCohorts": baseline["expectedCohorts"],
              "anomalyConcentration": baseline["requiredAnomalyConcentration"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build program curation queue
        run: |
          rm -rf artifacts/thesis-program-curation
          python scripts/thesis/build_program_curation_queue_v1.py \
            --observed-authorities artifacts/thesis-real-harvest/observed-authorities.json \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --output-dir artifacts/thesis-program-curation \
            --top 30

      - name: Validate curation queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-program-curation")
          queue = json.loads((root / "program-curation-queue.json").read_text())

          assert queue["schemaVersion"] == "thesis-program-curation-queue-v1"
          assert queue["metrics"]["queueItems"] >= 0
          assert isinstance(queue["metrics"]["curationLanes"], dict)

          allowed_lanes = {
              "metadata-confidence-review",
              "scope-review",
              "humanities-candidate",
              "unit-triage",
              "high-impact-triage",
              "backlog",
          }

          for item in queue["items"]:
              assert item["decisionConstraint"] == "priority-does-not-change-admission"
              assert item["queueState"] in {
                  "unresolved",
                  "review",
                  "metadata-review",
              }
              assert item["curationLane"] in allowed_lanes

          print(json.dumps(queue["metrics"], indent=2, ensure_ascii=False))
          PY

      - name: Validate Psychology Program Authority V24 interaction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path(
                  "scripts/thesis/config/program-authority-v1.json"
              ).read_text()
          )
          queue = json.loads(
              Path(
                  "artifacts/thesis-program-curation/"
                  "program-curation-queue.json"
              ).read_text()
          )

          assert registry["registryRevision"] == "2026-11-02.v24"

          authority = next(
              program
              for program in registry["programs"]
              if program["id"] == "program:udg:lic-psicologia"
          )
          assert authority["admissionState"] == "exclude"
          assert authority["observedCount"] == 485

          item = next(
              (
                  row
                  for row in queue["items"]
                  if row["normalizedKey"] == "licenciatura en psicologia"
              ),
              None,
          )

          if item is not None:
              assert item["queueState"] == "metadata-review"
              assert (
                  item["curationLane"]
                  == "metadata-confidence-review"
              )
              assert (
                  item["authority"]["id"]
                  == "program:udg:lic-psicologia"
              )
              assert item["authority"]["admissionState"] == "exclude"
              assert (
                  item["programMetadataEvidence"]["blockedWorks"] > 0
              )
              assert not (
                  set(item["currentObservedAdmissionStatuses"])
                  & {"include", "review"}
              )

          print(json.dumps({
              "registryRevision": registry["registryRevision"],
              "authority": {
                  "id": authority["id"],
                  "admissionState": authority["admissionState"],
                  "observedCount": authority["observedCount"],
              },
              "sampleQueueItem": item,
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build program metadata evidence confidence audit
        run: |
          rm -rf artifacts/thesis-program-metadata-confidence
          python scripts/thesis/audit_program_metadata_evidence_confidence_v1.py \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --queue artifacts/thesis-program-curation/program-curation-queue.json \
            --output-dir artifacts/thesis-program-metadata-confidence

      - name: Validate program metadata evidence confidence audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/thesis-program-metadata-confidence/"
                  "program-metadata-confidence-audit.json"
              ).read_text()
          )

          assert report["schemaVersion"] == "thesis-program-metadata-evidence-confidence-audit-v1"
          assert (
              report["decisionConstraint"]
              == "metadata-confidence-does-not-create-program-authority"
          )
          assert report["programMetadataEvidenceRevision"] == "2026-11-02.v1"
          assert report["metrics"]["works"] > 0
          assert report["metrics"]["violations"] == 0
          assert report["violations"] == []

          print(json.dumps(report["metrics"], indent=2, ensure_ascii=False))
          PY

      - name: Validate full program metadata confidence baseline
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "artifacts/thesis-program-metadata-confidence/"
                  "program-metadata-confidence-audit.json"
              ).read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "program-metadata-evidence-confidence-baseline-v1.json"
              ).read_text()
          )

          assert (
              report["programMetadataEvidenceRevision"]
              == baseline["policyRevision"]
          )

          by_rule = report["metrics"]["ruleMatches"]
          queue_rows = {
              row["normalizedKey"]: row
              for row in report["metadataReviewQueueItems"]
          }

          for rule_id, expected in baseline["expectedRules"].items():
              assert by_rule.get(rule_id, 0) == expected["matchedWorks"]
              row = queue_rows[expected["programKey"]]
              assert row["curationLane"] == expected["curationLane"]
              assert (
                  row["programMetadataEvidence"]["blockedWorks"]
                  == expected["matchedWorks"]
              )

          print(json.dumps({
              "baseline": "closed",
              "ruleMatches": by_rule,
              "metadataReviewQueueItems": report[
                  "metadataReviewQueueItems"
              ],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Validate full Psychology Program Authority V24 baseline
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "psychology-program-authority-v24-baseline-v1.json"
              ).read_text()
          )
          queue = json.loads(
              Path(
                  "artifacts/thesis-program-curation/"
                  "program-curation-queue.json"
              ).read_text()
          )

          item = next(
              row
              for row in queue["items"]
              if row["normalizedKey"] == baseline["normalizedKey"]
          )
          expected = baseline["expectedFull"]

          assert item["count"] == expected["observedWorks"]
          assert (
              item["programMetadataEvidence"]["blockedWorks"]
              == expected["blockedWorks"]
          )
          assert (
              item["count"]
              - item["programMetadataEvidence"]["blockedWorks"]
              == expected["authorityApplicableWorks"]
          )
          assert (
              item["currentObservedAdmissionStatuses"]
              == expected["projectedAdmissionStatuses"]
          )
          assert item["queueState"] == expected["queueState"]
          assert item["curationLane"] == expected["curationLane"]
          assert item["authority"]["id"] == baseline["programRef"]
          assert (
              item["authority"]["admissionState"]
              == baseline["admissionState"]
          )

          print(json.dumps({
              "baseline": "closed",
              "program": item,
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build program coverage audit
        run: |
          rm -rf artifacts/thesis-program-coverage
          python scripts/thesis/audit_program_coverage_v1.py \
            --observed-authorities artifacts/thesis-real-harvest/observed-authorities.json \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --output-dir artifacts/thesis-program-coverage \
            --reference-year 2026 \
            --top 30

      - name: Validate program coverage audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-program-coverage")
          audit = json.loads((root / "program-coverage-audit.json").read_text())

          assert audit["schemaVersion"] == "thesis-program-coverage-audit-v1"
          assert audit["metrics"]["works"] > 0
          assert sum(audit["metrics"]["projectedAdmission"].values()) == audit["metrics"]["works"]
          assert isinstance(audit["metrics"]["programQueue"], dict)
          assert isinstance(audit["gateBlockers"], list)
          assert audit["programAuthorityRevision"]
          assert audit["institutionAuthorityRevision"]

          print(json.dumps({
              "programAuthorityRevision": audit["programAuthorityRevision"],
              "institutionAuthorityRevision": audit["institutionAuthorityRevision"],
              "projectedAdmission": audit["metrics"]["projectedAdmission"],
              "dateQuality": audit["metrics"]["dateQuality"],
              "gateBlockerCount": audit["metrics"]["gateBlockerCount"],
              "programMetadataConfidenceStates": audit["metrics"][
                  "programMetadataConfidenceStates"
              ],
              "programAuthorityApplicability": audit["metrics"][
                  "programAuthorityApplicability"
              ],
              "programQueue": audit["metrics"]["programQueue"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build scope boundary matrix
        run: |
          rm -rf artifacts/thesis-scope-boundary
          python scripts/thesis/build_scope_boundary_matrix_v1.py \
            --observed-authorities artifacts/thesis-real-harvest/observed-authorities.json \
            --canonical-corpus artifacts/thesis-real-harvest/canonical-corpus.json.gz \
            --output-dir artifacts/thesis-scope-boundary

      - name: Validate scope boundary matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/thesis-scope-boundary")
          report = json.loads((root / "scope-boundary-matrix.json").read_text())

          assert report["schemaVersion"] == "thesis-humanities-scope-boundary-report-v1"
          assert report["policyRevision"] == "2026-11-01.v2"
          assert report["decisionConstraint"] == "scope-matrix-does-not-change-admission"
          assert report["targetScope"] == "humanities-only"
          assert report["metrics"]["matrixRows"] == 6
          assert isinstance(report["rows"], list)

          allowed_states = {
              "core-humanities",
              "boundary-review",
              "outside-scope",
              "unresolved-evidence",
          }
          for row in report["rows"]:
              assert row["boundaryState"] in allowed_states
              assert row["decisionConstraint"] == "scope-matrix-does-not-change-admission"

          urban = next(
              row for row in report["rows"]
              if row["id"] == "scope:urban-territory-sustainability"
          )
          assert urban["boundaryState"] == "boundary-review"
          assert len(urban["programs"]) == 1
          urban_program = urban["programs"][0]
          assert urban_program["normalizedKey"] == "doctorado en ciudad territorio y sustentabilidad"
          assert urban_program["programAuthority"]["status"] == "confirmed"
          assert urban_program["programAuthority"]["programRef"] == "program:udg:doc-ciudad-territorio-sustentabilidad"
          assert urban_program["programAuthority"]["admissionState"] == "review"

          print(json.dumps({
              "policyRevision": report["policyRevision"],
              "programAuthorityRevision": report["programAuthorityRevision"],
              "institutionAuthorityRevision": report["institutionAuthorityRevision"],
              "metrics": report["metrics"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Build boundary closure audit
        run: |
          rm -rf artifacts/thesis-boundary-closure
          python scripts/thesis/audit_boundary_closure_v1.py \
            --scope-report artifacts/thesis-scope-boundary/scope-boundary-matrix.json \
            --contract scripts/thesis/config/boundary-closure-contract-v2.json \
            --output-dir artifacts/thesis-boundary-closure

      - name: Validate boundary closure audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

