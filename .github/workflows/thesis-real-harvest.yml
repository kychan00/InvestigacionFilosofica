      - name: Reproject Medicine Program Authority V25 over frozen full baseline
        if: github.event_name == 'pull_request'
        run: |
          rm -rf artifacts/thesis-medicine-v25-full
          mkdir -p artifacts/thesis-medicine-v25-full
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")

          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-confidence-frozen-full")
          corpus = json.loads(
              (root / "canonical-reprojected.json").read_text()
          )
          observed = json.loads(
              Path(
                  "/tmp/thesis-full-baseline/observed-authorities.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          program_ref = "program:udg:lic-medico-cirujano-partero"
          selected = [
              work
              for work in projected["works"]
              if work.get("programRef") == program_ref
          ]

          by_raw = {}
          for work in selected:
              key = canonical.normalize_key(work.get("programRaw"))
              row = by_raw.setdefault(
                  key,
                  {
                      "works": 0,
                      "blockedWorks": 0,
                      "authorityApplicableWorks": 0,
                      "projectedAdmissionStatuses": Counter(),
                  },
              )
              row["works"] += 1
              evidence = work.get("programMetadataEvidence") or {}
              if evidence.get("authorityApplicability") == "blocked":
                  row["blockedWorks"] += 1
              else:
                  row["authorityApplicableWorks"] += 1
              row["projectedAdmissionStatuses"][
                  work.get("admissionStatus") or "unknown"
              ] += 1

          serial_by_raw = {
              key: {
                  **row,
                  "projectedAdmissionStatuses": dict(
                      row["projectedAdmissionStatuses"].most_common()
                  ),
              }
              for key, row in by_raw.items()
          }

          selected_statuses = Counter(
              work.get("admissionStatus") or "unknown"
              for work in selected
          )
          selected_blocked = sum(
              1
              for work in selected
              if (
                  (work.get("programMetadataEvidence") or {}).get(
                      "authorityApplicability"
                  )
                  == "blocked"
              )
          )

          queue_rows = {
              item["normalizedKey"]: item
              for item in queue["items"]
          }

          payload = {
              "registryRevision": registry["registryRevision"],
              "programRef": program_ref,
              "observedWorks": len(selected),
              "blockedWorks": selected_blocked,
              "authorityApplicableWorks": len(selected) - selected_blocked,
              "projectedAdmissionStatuses": dict(
                  selected_statuses.most_common()
              ),
              "rawGroups": serial_by_raw,
              "queueItems": {
                  key: queue_rows.get(key)
                  for key in [
                      "licenciatura en medicina",
                      "licenciatura en medico cirujano y partero",
                  ]
              },
              "programRefWorks": projection["programRefWorks"].get(
                  program_ref,
                  0,
              ),
              "gateBlockers": [
                  item
                  for item in projection["gateBlockers"]
                  if item.get("programRef") == program_ref
              ],
              "globalProjectedAdmission": projection[
                  "projectedAdmission"
              ],
          }

          Path(
              "artifacts/thesis-medicine-v25-full/"
              "medicine-v25-reprojection.json"
          ).write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

