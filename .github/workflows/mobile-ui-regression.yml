name: Mobile UI regression

on:
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "tests/mobile-carbon.test.mjs"
      - "scripts/qa/mobile-ui-smoke.mjs"
      - ".github/workflows/mobile-ui-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm test
      - name: Install browser smoke tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build local browser dependencies
        run: npm run build:duckdb
      - name: Serve the site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mobile-ui-http.log 2>&1 &
          echo $! > /tmp/mobile-ui-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mobile-ui-http.log
          exit 1
      - name: Check phone, tablet and desktop geometry
        run: node scripts/qa/mobile-ui-smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: artifacts/mobile-ui/
          if-no-files-found: ignore
