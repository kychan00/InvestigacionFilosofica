name: Mobile UI regression

on:
  pull_request:
    paths:
      - "index.html"
      - "js/app.js"
      - "css/**"
      - "tests/mobile-carbon.test.mjs"
      - "scripts/qa/mobile-ui-smoke.mjs"
      - "scripts/qa/record-modal-smoke.mjs"
      - "scripts/qa/author-timeline-smoke.mjs"
      - "scripts/qa/theme-contrast-smoke.mjs"
      - "scripts/qa/author-profile-visibility-smoke.mjs"
      - "scripts/qa/author-deep-discovery-smoke.mjs"
      - "scripts/qa/author-name-only-smoke.mjs"
      - "tests/author-identity-lookup.test.mjs"
      - "src/core/author-identity-lookup.js"
      - "src/core/author-collaborations.js"
      - "tests/author-collaborations.test.mjs"
      - "scripts/openalex/author_index_common.py"
      - "scripts/openalex/merge_author_index_v1.py"
      - "tests/test_author_index_common.py"
      - "tests/test_author_index_merge.py"
      - "tests/author-deep-discovery.test.mjs"
      - "src/core/author-deep-discovery.js"
      - "src/sources/openalex.js"
      - "css/author-visibility-repair.css"
      - "js/theme.js"
      - "tests/theme-controller.test.mjs"
      - "src/core/author-timeline.js"
      - "src/core/author-timeline-ui.js"
      - "tests/author-timeline.test.mjs"
      - "tests/remote-author-resolution.test.mjs"
      - ".github/workflows/mobile-ui-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm test
      - name: Verify Python author-index alias and coauthor contracts
        run: |
          python3 -m pip install --user duckdb huggingface_hub
          python3 -m unittest tests/test_author_index_common.py tests/test_author_index_merge.py
      - name: Install browser smoke tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build local browser dependencies
        run: npm run build:duckdb
      - name: Serve the site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mobile-ui-http.log 2>&1 &
          echo $! > /tmp/mobile-ui-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mobile-ui-http.log
          exit 1
      - name: Check phone, tablet and desktop geometry
        run: node scripts/qa/mobile-ui-smoke.mjs
      - name: Check record detail modal visual design
        run: node scripts/qa/record-modal-smoke.mjs
      - name: Check author timeline interactions and layout
        run: node scripts/qa/author-timeline-smoke.mjs
      - name: Check light dark labels and sun moon controls
        run: node scripts/qa/theme-contrast-smoke.mjs
      - name: Verify author profile cards and homepage labels in both themes
        run: node scripts/qa/author-profile-visibility-smoke.mjs
      - name: Verify deep author search on a shared page in both themes
        run: node scripts/qa/author-deep-discovery-smoke.mjs
      - name: Verify name-only author URLs and live identity resolution
        run: node scripts/qa/author-name-only-smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: |
            artifacts/mobile-ui/
            artifacts/record-detail/
            artifacts/author-timeline/
            artifacts/theme-contrast/
            artifacts/author-profile-visibility/
            artifacts/author-deep-discovery/
            artifacts/author-name-lookup/
          if-no-files-found: ignore
