name: Sincronía · restore five signed issue-7/12 original works

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-five-issue7-12.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-five-signed-issue7-12
  cancel-in-progress: false

jobs:
  restore-five:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test five original signature citations and frozen index
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_five_issue7_12_primary
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly five signed historical bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-five-7-12-before.json
          python3 -m scripts.cucsh.restore_sincronia_five_issue7_12_primary \
            --input /tmp/sincronia-five-7-12-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit 1845 records, no loss, five source-backed attribution changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-five-7-12-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-five-7-12-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-five-7-12-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_five_issue7_12_primary import SOURCES

          old_data=json.loads(Path("/tmp/sincronia-five-7-12-before.json").read_text(encoding="utf-8"))
          new_data=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={r["id"]:r for r in old_data["records"]}
          after={r["id"]:r for r in new_data["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[rid for rid in before if before[rid]!=after[rid]]
          assert len(changed)==5 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=before[rid],after[rid]
              source=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":source["author"],"sourceName":source["author"]}]
              evidence=new["legacyAuthorEvidence"]
              assert evidence["sourceUrl"]==source["snapshot"]
              assert evidence["sourceArticleUrl"]==source["url"]
              assert evidence["sourcePrintedByline"]==source["printedByline"]
              assert evidence["sourceArticleTitle"]==source["sourceArticleTitle"]
              assert evidence["matchedIndexedYear"]==source["year"]
              assert evidence["matchedIndexedIssue"]==source["issue"]
              assert evidence["originalAvailabilityPreserved"]
              assert evidence["titleIdentityCaveat"]

          reyes=after["cucsh:sincronia-legacy:53c3bea7bff8e9572369"]
          ev=reyes["legacyAuthorEvidence"]
          assert reyes["year"]==1999 and reyes["issueNumber"]==12
          assert "1960-1995" in ev["sourceArticleTitle"]
          assert ev["conflictingLaterPublicationYear"]==2001
          assert ev["conflictingLaterPublicationIssue"]==21
          assert ev["conflictingLaterBibliographicUrl"]!=reyes["urls"]["canonical"]

          report=json.loads(Path("/tmp/sincronia-five-7-12-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==27
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==25
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FIVE_ISSUE7_12_STRICT_PASS",len(changed),27)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree modifications"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore five signed Sincronía articles with 2001 Reyes edition caveat"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload source quality and pending author reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-five-issue7-12
          path: |
            /tmp/sincronia-five-7-12-history.json
            /tmp/sincronia-five-7-12-pending.json
          retention-days: 30
          if-no-files-found: warn
