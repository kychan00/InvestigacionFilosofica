name: Sincronía · independent Portuguese archive check for Campos 2000

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-arquivo-pt-campos.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-arquivo-pt-campos-read-only
  cancel-in-progress: false

jobs:
  arquivo-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test archive parsing and fail-closed identity guards
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_arquivo_pt
          python3 -m unittest tests.test_cucsh_sincronia_final_nonarticle_triage
      - name: Query independent archive (read only)
        run: |
          python3 -m scripts.cucsh.probe_sincronia_campos_arquivo_pt --output /tmp/sincronia-campos-arquivo-pt.json
      - name: Enforce bibliographic and archive no-loss conditions
        run: |
          python3 -m scripts.cucsh.audit_sincronia_pending_authors --input src/data/cucsh-filosofia.json --output /tmp/sincronia-arquivo-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-arquivo-pending.json").read_text())
          assert d["totalSincroniaRecords"] == 1454
          assert d["pendingAuthorRecords"] == 4
          assert d["pendingAuthorshipCasesExcludingVerifiedNonArticles"] == 1
          a=json.loads(Path("/tmp/sincronia-campos-arquivo-pt.json").read_text())
          assert a["authorAssignments"]==0 and not a["corpusModified"]
          assert not a["originalWorkIdentityVerified"]
          print("SINCRONIA_ARQUIVO_PT_READ_ONLY_INTEGRITY_PASSED")
          PY
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Complete application regression
        run: |
          npm ci
          npm test
      - name: Upload source evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-campos-arquivo-pt
          path: |
            /tmp/sincronia-campos-arquivo-pt.json
            /tmp/sincronia-arquivo-pending.json
          retention-days: 30
          if-no-files-found: warn
