name: Sincronía · restore three cited bylines (Adamson Pires Reyes)

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-three-new-cited.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-three-new-cited
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify author provenance and historical edition caveats
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_three_new_cited
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three documented authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-three-new-before.json
          python3 -m scripts.cucsh.restore_sincronia_three_new_cited \
            --input /tmp/cucsh-three-new-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit three source-backed changes and zero lost works
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-three-new-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-new-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-new-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_three_new_cited import SOURCES

          old_data=json.loads(Path("/tmp/cucsh-three-new-before.json").read_text(encoding="utf-8"))
          new_data=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          before={row["id"]:row for row in old_data["records"]}
          after={row["id"]:row for row in new_data["records"]}
          assert len(before)==len(after)==1845
          assert list(before)==list(after)
          changed=[rid for rid in before if before[rid]!=after[rid]]
          assert len(changed)==3 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=before[rid],after[rid]
              expected=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {field for field in set(old)|set(new)
                      if old.get(field)!=new.get(field)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":expected["author"],"sourceName":expected["author"]}]
              evidence=new["legacyAuthorEvidence"]
              assert evidence["sourceArticleUrl"]==expected["url"]
              assert evidence["matchedIndexedIssue"]==expected["issue"]
              assert evidence["matchedIndexedYear"]==expected["year"]
              assert evidence["urlMatchLevel"]==expected["evidence"]["urlMatchLevel"]
              assert evidence["publicationVersionCaveat"]

          report=json.loads(Path("/tmp/sincronia-three-new-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==60
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==58
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_THREE_NEW_STRICT_PASS",len(changed),60)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore cited Sincronía bylines: Adamson, Pires Lucas and Reyes Ortiz"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload audit and pending review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-three-new-cited
          path: |
            /tmp/sincronia-three-new-historical-quality.json
            /tmp/sincronia-three-new-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
