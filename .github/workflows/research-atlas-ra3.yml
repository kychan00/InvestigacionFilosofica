name: Research Atlas RA3 · authority integration

on:
  pull_request:
    paths:
      - "src/core/research-atlas-contract.js"
      - "src/core/research-atlas-assembler.js"
      - "src/core/research-atlas-authority.js"
      - "src/core/author-authority-adapters.js"
      - "src/core/author-authority-resolution.js"
      - "src/core/merge-results.js"
      - "tests/research-atlas-contract.test.mjs"
      - "tests/research-atlas-assembler.test.mjs"
      - "tests/research-atlas-authority.test.mjs"
      - "benchmark/research-atlas/v3/authority-fixture.json"
      - "docs/RESEARCH_ATLAS_AUTHORITY_RA3.md"
      - ".github/workflows/research-atlas-ra3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate RA1 through RA3
        run: |
          node --test tests/research-atlas-contract.test.mjs
          node --test tests/research-atlas-assembler.test.mjs
          node --test tests/research-atlas-authority.test.mjs

      - name: Run complete regression suite
        run: npm test
