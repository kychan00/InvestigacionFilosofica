name: Sincronía · archived article author-evidence sample

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-authors-sample.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-authors-sample
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test source evidence extraction
        run: python3 -m unittest tests.test_cucsh_sincronia_author_sources
      - name: Probe ten archived article pages, no changes to corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -u -m scripts.cucsh.probe_sincronia_author_sources \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-author-evidence.json \
            2>&1 | tee /tmp/sincronia-author-evidence.log
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-author-evidence-${{ github.run_id }}
          path: |
            /tmp/sincronia-author-evidence.json
            /tmp/sincronia-author-evidence.log
          retention-days: 30
          if-no-files-found: warn
