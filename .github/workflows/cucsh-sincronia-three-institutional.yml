name: Sincronía · restore three institutional bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-three-institutional.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-three-institutional-authors
  cancel-in-progress: false

jobs:
  restore-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test institutional evidence and immutable historical identities
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_three_institutional
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly three historical bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-three-institutional-before.json
          python3 -m scripts.cucsh.restore_sincronia_three_institutional \
            --input /tmp/cucsh-three-institutional-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate three changes, original URLs and no corpus loss
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-three-institutional-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-institutional-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-three-institutional-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_three_institutional import SOURCES

          before=json.loads(Path("/tmp/cucsh-three-institutional-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==3 and set(changed)==set(SOURCES),changed
          for rid in changed:
              old,new=b[rid],a[rid]
              expected=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for key in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[key]==new[key],(rid,key)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":expected["author"],"sourceName":expected["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["verifiedTitle"]==expected["title"]
              assert ev["sourceArticleUrl"]==expected["url"]
              assert ev["matchedIndexedYear"]==expected["year"]
              assert ev["matchedIndexedIssue"]==expected["issue"]
              assert ev["urlMatchLevel"]==expected["evidence"]["urlMatchLevel"]
              assert ev["publicationVersionCaveat"]

          report=json.loads(Path("/tmp/sincronia-three-institutional-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==63
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==61
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert report["unresolvedIssue50UrlMappings"] and len(report["unresolvedIssue50UrlMappings"])==1
          print("SINCRONIA_THREE_INSTITUTIONAL_STRICT_PASS",len(changed),63)
          PY
      - name: Run complete application regression suite
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore three institutionally verified Sincronía bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and unresolved-author queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-three-institutional-${{ github.run_id }}
          path: |
            /tmp/sincronia-three-institutional-historical-quality.json
            /tmp/sincronia-three-institutional-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
