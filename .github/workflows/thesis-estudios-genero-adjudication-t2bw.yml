name: Thesis Estudios de Género adjudication T2BW

on:
  pull_request:
    paths:
      - "scripts/thesis/config/estudios-genero-adjudication-batch-001-v1.json"
      - "scripts/thesis/config/estudios-genero-adjudication-baseline-v1.json"
      - "tests/test_thesis_estudios_genero_adjudication_t2bw.py"
      - "docs/THESIS_ESTUDIOS_GENERO_ADJUDICATION_T2BW.md"
      - ".github/workflows/thesis-estudios-genero-adjudication-t2bw.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch frozen full corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2bw artifacts/t2bw
          mkdir -p /tmp/t2bw artifacts/t2bw
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip"             > /tmp/t2bw.zip
          unzip -q /tmp/t2bw.zip -d /tmp/t2bw

      - name: Reproject current metadata confidence
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py             --canonical-corpus /tmp/t2bw/canonical-corpus.json.gz             --source-records /tmp/t2bw/source-records.jsonl.gz             --output-corpus artifacts/t2bw/confidence.json             --output-report artifacts/t2bw/confidence-report.json

      - name: Discover exact Estudios de Género work
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical

          root=Path("artifacts/t2bw")
          corpus=json.loads((root/"confidence.json").read_text())
          registry=canonical.load_program_registry()
          projected,_=coverage.reproject_corpus(corpus,registry,reference_year=2026)
          ref="program:udg:mae-estudios-genero"
          items=[w for w in projected["works"] if w.get("programRef")==ref]
          assert len(items)==1, len(items)
          w=items[0]
          payload={
            "workId":w.get("id"),
            "title":w.get("title"),
            "programRef":w.get("programRef"),
            "programRaw":w.get("programRaw"),
            "academicUnitRaw":w.get("academicUnitRaw"),
            "date":w.get("date"),
            "admissionStatus":w.get("admissionStatus"),
            "programMetadataEvidence":w.get("programMetadataEvidence"),
            "persistentIdentifiers":w.get("persistentIdentifiers"),
            "sourceRecordRefs":w.get("sourceRecordRefs"),
            "contributors":w.get("contributions"),
          }
          (root/"target-work.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print("T2BW_TARGET="+json.dumps(payload,ensure_ascii=False))
          PY

      - name: Fetch and inspect official thesis PDF
        run: |
          set -euo pipefail
          PDF="artifacts/t2bw/MCUCSH10741FT.pdf"
          TXT="artifacts/t2bw/MCUCSH10741FT.txt"
          URL="https://riudg.udg.mx/bitstream/20.500.12104/112718/1/MCUCSH10741FT.pdf"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$PDF"
          file "$PDF"
          test "$(head -c 4 "$PDF")" = "%PDF"
          sha256sum "$PDF" | tee artifacts/t2bw/pdf-sha256.txt
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$PDF" | tee artifacts/t2bw/pdf-info.txt
          pdftotext -layout "$PDF" "$TXT"
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path("artifacts/t2bw/MCUCSH10741FT.txt").read_text(encoding="utf-8",errors="replace")
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          headings=[x for x in lines if re.search(r"^(INTRODUCCI[ÓO]N|CONCLUSI|CAP[IÍ]TULO|MARCO|METODOLOG|M[ÉE]TODO|RESULTADOS|REFERENCIAS|BIBLIOGRAF)",x,re.I)]
          terms=["Bourdieu","Butler","Austin","Foucault","performativ","ideolog","violencia simb","discurso","poder","análisis de contenido","estadística descriptiva","entrevista","encuesta","lingüíst","socioling","glotopol"]
          counts={term:len(re.findall(re.escape(term),text,re.I)) for term in terms}
          def contexts(term,limit=2,radius=260):
              out=[]
              for m in list(re.finditer(re.escape(term),text,re.I))[:limit]:
                  a=max(0,m.start()-radius); b=min(len(text),m.end()+radius)
                  out.append(re.sub(r"\s+"," ",text[a:b]).strip())
              return out
          probe={
            "characters":len(text),
            "headings":headings[:120],
            "termCounts":counts,
            "contexts":{term:contexts(term) for term in terms if counts[term]},
            "opening":re.sub(r"\s+"," ",text[:2500]).strip(),
            "ending":re.sub(r"\s+"," ",text[-4000:]).strip(),
          }
          Path("artifacts/t2bw/primary-source-probe.json").write_text(json.dumps(probe,ensure_ascii=False,indent=2)+"\n")
          print("T2BW_PDF_PROBE="+json.dumps(probe,ensure_ascii=False))
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: thesis-estudios-genero-t2bw-discovery
          path: |
            artifacts/t2bw/target-work.json
            artifacts/t2bw/pdf-sha256.txt
            artifacts/t2bw/pdf-info.txt
            artifacts/t2bw/primary-source-probe.json
          retention-days: 14
