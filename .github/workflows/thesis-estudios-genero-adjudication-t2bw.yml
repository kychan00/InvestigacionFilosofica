name: Thesis Estudios de Género adjudication T2BW

on:
  pull_request:
    paths:
      - "scripts/thesis/build_boundary_adjudication_ledger_v1.py"
      - "scripts/thesis/config/estudios-genero-adjudication-batch-001-v1.json"
      - "scripts/thesis/config/estudios-genero-adjudication-baseline-v1.json"
      - "tests/test_thesis_estudios_genero_adjudication_t2bw.py"
      - "docs/THESIS_ESTUDIOS_GENERO_ADJUDICATION_T2BW.md"
      - ".github/workflows/thesis-estudios-genero-adjudication-t2bw.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_estudios_genero_adjudication_t2bw.py" -v
          python -m unittest discover -s tests -p "test_thesis_boundary_adjudication_ledger.py" -v

      - name: Fetch frozen full corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2bw artifacts/t2bw
          mkdir -p /tmp/t2bw artifacts/t2bw
          gh api -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip"             > /tmp/t2bw.zip
          unzip -q /tmp/t2bw.zip -d /tmp/t2bw

      - name: Reproject current metadata confidence
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py             --canonical-corpus /tmp/t2bw/canonical-corpus.json.gz             --source-records /tmp/t2bw/source-records.jsonl.gz             --output-corpus artifacts/t2bw/confidence.json             --output-report artifacts/t2bw/confidence-report.json

      - name: Build current work-review and program-curation surfaces
        run: |
          python scripts/thesis/build_boundary_work_review_queue_v1.py             --canonical-corpus artifacts/t2bw/confidence.json             --reference-year 2026             --output-dir artifacts/t2bw/work-review

          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root=Path("artifacts/t2bw")
          corpus=json.loads((root/"confidence.json").read_text())
          observed=json.loads(Path("/tmp/t2bw/observed-authorities.json").read_text())
          registry=canonical.load_program_registry()
          projected,projection=coverage.reproject_corpus(corpus,registry,reference_year=2026)
          observed_projected=coverage.reproject_observed_authorities(
              observed,projection["programDimensions"]
          )
          queue=curation.build_queue(observed_projected,projected,registry)
          (root/"projected-corpus.json").write_text(
              json.dumps(projected,ensure_ascii=False)
          )
          (root/"program-curation.json").write_text(
              json.dumps(queue,ensure_ascii=False)
          )
          PY

      - name: Fetch and inspect official thesis PDF
        run: |
          set -euo pipefail
          PDF="/tmp/MCUCSH10741FT.pdf"
          TXT="/tmp/MCUCSH10741FT.txt"
          URL="https://riudg.udg.mx/bitstream/20.500.12104/112718/1/MCUCSH10741FT.pdf"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$PDF"
          file "$PDF"
          test "$(head -c 4 "$PDF")" = "%PDF"
          sha256sum "$PDF" | tee artifacts/t2bw/pdf-sha256.txt
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo "$PDF" | tee artifacts/t2bw/pdf-info.txt
          pdftotext -layout "$PDF" "$TXT"

          python - <<'PY'
          import json,re
          from pathlib import Path
          baseline=json.loads(
              Path("scripts/thesis/config/estudios-genero-adjudication-baseline-v1.json").read_text()
          )
          text=Path("/tmp/MCUCSH10741FT.txt").read_text(
              encoding="utf-8",errors="replace"
          )
          compact=re.sub(r"\s+"," ",text).lower()
          required={
              "department-of-letters":"departamento de letras",
              "butler":"judith butler",
              "bourdieu":"pierre bourdieu",
              "foucault":"michel foucault",
              "austin":"austin",
              "gender-language":"lenguaje y su intersección con el género",
              "performativity":"lenguaje como forma de performar",
              "symbolic-violence":"violencia simbólica",
              "discourse-power":"discursos en las relaciones de poder",
              "content-analysis":"análisis de contenido",
              "descriptive-statistics":"estadística descriptiva",
              "interviews":"entrevistas",
              "surveys":"encuestas",
          }
          missing=[name for name,needle in required.items() if needle not in compact]
          assert not missing,missing
          sha=Path("artifacts/t2bw/pdf-sha256.txt").read_text().split()[0]
          assert sha==baseline["primarySourceSha256"],sha
          info=Path("artifacts/t2bw/pdf-info.txt").read_text()
          assert "Pages:           219" in info,info
          evidence={
              "primarySourceSha256":sha,
              "pages":219,
              "textCharacters":len(text),
              "requiredFulltextMarkers":required,
              "allRequiredMarkersObserved":True,
          }
          Path("artifacts/t2bw/fulltext-evidence.json").write_text(
              json.dumps(evidence,ensure_ascii=False,indent=2)+"\n"
          )
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY

      - name: Build T2BW adjudication ledger
        run: |
          python scripts/thesis/build_boundary_adjudication_ledger_v1.py             --work-review-queue artifacts/t2bw/work-review/boundary-work-review-queue.json             --batch scripts/thesis/config/estudios-genero-adjudication-batch-001-v1.json             --output-dir artifacts/t2bw/adjudication

      - name: Validate full T2BW contract
        run: |
          python - <<'PY'
          import json,sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,"scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root=Path("artifacts/t2bw")
          baseline=json.loads(
              Path("scripts/thesis/config/estudios-genero-adjudication-baseline-v1.json").read_text()
          )
          batch=json.loads(
              Path("scripts/thesis/config/estudios-genero-adjudication-batch-001-v1.json").read_text()
          )
          registry=canonical.load_program_registry()
          scope=json.loads(Path("scripts/thesis/config/scope-boundary-matrix-v1.json").read_text())
          confidence=json.loads((root/"confidence-report.json").read_text())
          corpus=json.loads((root/"projected-corpus.json").read_text())
          curation=json.loads((root/"program-curation.json").read_text())
          work_review=json.loads(
              (root/"work-review/boundary-work-review-queue.json").read_text()
          )
          ledger=json.loads((root/"adjudication/adjudication-ledger.json").read_text())
          fulltext=json.loads((root/"fulltext-evidence.json").read_text())
          e=baseline["expected"]

          assert registry["registryRevision"]==baseline["programAuthorityRevision"]
          assert scope["policyRevision"]==baseline["scopePolicyRevision"]
          assert confidence["programMetadataEvidenceRevision"]==baseline[
              "programMetadataEvidenceRevision"
          ]
          assert work_review["policyRevision"]==baseline["workReviewPolicyRevision"]
          assert batch["workReviewPolicyRevision"]==baseline["workReviewPolicyRevision"]

          counts=dict(Counter(w["admissionStatus"] for w in corpus["works"]))
          assert len(corpus["works"])==27576
          assert counts==e["globalAdmission"],counts

          selected=[w for w in corpus["works"] if w.get("id")==baseline["workId"]]
          assert len(selected)==1
          target=selected[0]
          assert target["programRef"]==baseline["programRef"]
          assert target["admissionStatus"]=="review"
          assert target["academicUnitRaw"]=="CUCSH"
          assert target["date"]["value"]==e["observedDate"]
          pme=target["programMetadataEvidence"]
          assert pme["authorityApplicability"]=="allowed"
          assert pme["confidenceState"]=="unassessed"

          wr=work_review["metrics"]
          assert wr["programs"]==e["workReviewQueueItems"]
          assert wr["workItems"]==e["workReviewWorks"]
          assert wr["projectedAdmission"]=={"review":e["workReviewWorks"]}
          assert wr["admissionChanges"]==0
          assert wr["automaticAdmissionDecisions"]==0

          cm=curation["metrics"]
          for key in (
              "humanitiesActionQueueItems","humanitiesActionWorks",
              "humanitiesReadyQueueItems","humanitiesReadyWorks",
              "evidenceHoldQueueItems","evidenceHoldWorks",
              "workReviewQueueItems","workReviewWorks",
          ):
              assert cm[key]==e[key],(key,cm[key],e[key])
          assert curation["nextHumanitiesReadyAction"] is None

          assert ledger["metrics"]==e["ledger"],ledger["metrics"]
          entry=ledger["entries"][0]
          assert entry["workId"]==baseline["workId"]
          assert entry["projectedAdmissionStatus"]=="review"
          assert entry["adjudicationState"]=="candidate-proposed"
          assert entry["candidateDecision"]=="include-candidate"
          assert entry["humanValidationStatus"]=="pending-user-merge"
          assert entry["admissionChangeRequested"] is False
          assert entry["primarySourceSha256"]==baseline["primarySourceSha256"]
          assert entry["primarySourcePages"]==e["primarySourcePages"]
          assert fulltext["allRequiredMarkersObserved"] is True

          authority=next(
              p for p in registry["programs"]
              if p["id"]==baseline["programRef"]
          )
          assert authority["admissionState"]=="review"
          assert authority["observedCount"]==1

          report={
              "phase":"T2BW",
              "decision":"include-candidate",
              "admissionChanged":False,
              "humanValidationStatus":"pending-user-merge",
              "programAuthorityRevision":registry["registryRevision"],
              "workReviewPolicyRevision":work_review["policyRevision"],
              "workId":baseline["workId"],
              "primarySourceSha256":fulltext["primarySourceSha256"],
              "primarySourcePages":fulltext["pages"],
              "globalAdmission":counts,
              "programCuration":{k:cm[k] for k in (
                  "humanitiesActionQueueItems","humanitiesActionWorks",
                  "humanitiesReadyQueueItems","humanitiesReadyWorks",
                  "evidenceHoldQueueItems","evidenceHoldWorks",
                  "workReviewQueueItems","workReviewWorks",
              )},
              "ledgerMetrics":ledger["metrics"],
          }
          (root/"t2bw-report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload T2BW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-estudios-genero-adjudication-t2bw
          path: |
            artifacts/t2bw/t2bw-report.json
            artifacts/t2bw/fulltext-evidence.json
            artifacts/t2bw/pdf-sha256.txt
            artifacts/t2bw/pdf-info.txt
            artifacts/t2bw/adjudication/adjudication-ledger.json
            artifacts/t2bw/adjudication/adjudication-ledger.csv
            artifacts/t2bw/adjudication/adjudication-ledger.md
          if-no-files-found: warn
          retention-days: 14
