name: Author Authority V2 · Phase 1
on:
  pull_request:
    paths:
      - "benchmark/author-authority/v2/**"
      - "src/core/author-authority-evidence-v2.js"
      - "src/core/author-authority-bibliography-v2.js"
      - "src/core/author-authority-profile-v2.js"
      - "tests/author-authority-profile-v2.test.mjs"
      - "src/core/author-deep-discovery.js"
      - "src/core/remote-author-resolution.js"
      - "src/core/crossref-author-fallback.js"
      - "tests/author-authority-bibliography-v2.test.mjs"
      - "src/core/author-authority-resolution-v2.js"
      - "src/core/author-authority-resolution.js"
      - "src/core/author-federated-matching.js"
      - "src/core/author-orcid-guard.js"
      - "scripts/authority/audit-runtime-v2.mjs"
      - "scripts/authority/compare-runtime-shadow-v2.mjs"
      - "src/core/author-authority-shadow-v2.js"
      - "tests/author-authority-shadow-v2.test.mjs"
      - "tests/author-authority-v2-phase1.test.mjs"
      - "tests/author-authority-resolution-v2.test.mjs"
      - ".github/workflows/author-authority-v2-phase1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority-v2-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test contracts and offline regression runner
        run: node --test tests/author-authority-v2-phase1.test.mjs
      - name: Test V2 decision engine
        run: node --test tests/author-authority-resolution-v2.test.mjs
      - name: Test V2 bibliography integration
        run: node --test tests/author-authority-bibliography-v2.test.mjs
      - name: Test V2 profile projection
        run: node --test tests/author-authority-profile-v2.test.mjs
      - name: Measure legacy runtime baseline
        run: node scripts/authority/audit-runtime-v2.mjs
      - name: Test shadow isolation and comparison
        run: node --test tests/author-authority-shadow-v2.test.mjs
      - name: Compare recorded regression decisions
        run: node scripts/authority/compare-runtime-shadow-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-authority-v2-runtime-baseline
          path: |
            artifacts/author-authority-v2/runtime-baseline.json
            artifacts/author-authority-v2/runtime-shadow.json
          if-no-files-found: error
