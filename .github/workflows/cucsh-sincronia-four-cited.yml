name: Sincronía · restore four documented bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-four-cited-authors.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-four-cited-authors
  cancel-in-progress: false

jobs:
  restore-four:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test source-specific identities and provenance
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_four_cited_authors
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore four verified Sincronía authors
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-four-cited-before.json
          python3 -m scripts.cucsh.restore_sincronia_four_cited_authors \
            --input /tmp/cucsh-four-cited-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit no loss, four authors and unchanged original records
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-four-cited-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-cited-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-cited-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_four_cited_authors import SOURCES

          before=json.loads(Path("/tmp/cucsh-four-cited-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert set(changed)==set(SOURCES) and len(changed)==4,changed
          for rid in changed:
              old,new=b[rid],a[rid]
              frozen=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyAccessStatus","legacyOriginal"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":frozen["author"],"sourceName":frozen["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceArticleUrl"]==frozen["url"]
              assert ev["publicationVersionCaveat"]
              assert ev["matchedIndexedYear"]==frozen["year"]
              assert ev["urlMatchLevel"]==frozen["evidence"]["urlMatchLevel"]

          report=json.loads(Path("/tmp/sincronia-four-cited-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==66
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==64
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          assert report["suspectedWorkIdentityCount"]==31
          print("SINCRONIA_FOUR_CITED_STRICT_PASS",len(changed),66)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus change to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore four source-verified Sincronía early bylines"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical audit and pending review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-four-cited-${{ github.run_id }}
          path: |
            /tmp/sincronia-four-cited-historical-quality.json
            /tmp/sincronia-four-cited-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
