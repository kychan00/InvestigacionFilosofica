name: Thesis effective corpus release contract T2BZ

on:
  pull_request:
    paths:
      - "scripts/thesis/build_effective_corpus_release_manifest_v1.py"
      - "scripts/thesis/config/effective-corpus-release-t2bz-v1.json"
      - "tests/test_thesis_effective_corpus_release_t2bz.py"
      - "docs/THESIS_EFFECTIVE_CORPUS_RELEASE_T2BZ.md"
      - "release-manifest.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/thesis-effective-corpus-release-t2bz.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile and unit regressions
        run: |
          python -m py_compile \
            scripts/thesis/build_effective_corpus_release_manifest_v1.py
          python -m unittest \
            tests/test_thesis_effective_corpus_release_t2bz.py -v
          python -m unittest discover \
            -s tests \
            -p "test_thesis_effective_corpus_t2by.py" -v

      - name: Fetch and verify immutable Effective Corpus V1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2bz-release artifacts/t2bz
          mkdir -p /tmp/t2bz-release artifacts/t2bz

          gh release download thesis-effective-corpus-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/t2bz-release

          python scripts/thesis/build_effective_corpus_release_manifest_v1.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2bz-v1.json \
            --release-dir /tmp/t2bz-release

          cp /tmp/t2bz-release/effective-corpus.json.gz artifacts/t2bz/
          cp /tmp/t2bz-release/effective-corpus.json.sha256 artifacts/t2bz/
          cp /tmp/t2bz-release/effective-corpus.json.gz.sha256 artifacts/t2bz/
          cp /tmp/t2bz-release/effective-corpus-report.json artifacts/t2bz/
          cp /tmp/t2bz-release/manifest.json artifacts/t2bz/

      - name: Upload T2BZ validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-effective-corpus-release-t2bz
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/t2bz/effective-corpus.json.gz
            artifacts/t2bz/effective-corpus.json.sha256
            artifacts/t2bz/effective-corpus.json.gz.sha256
            artifacts/t2bz/effective-corpus-report.json
            artifacts/t2bz/manifest.json
