name: Sincronía · reconcile with main rehearsal (no push)

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-integration-rehearsal.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-main-integration-rehearsal
  cancel-in-progress: false

jobs:
  verify-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Merge current main without committing or pushing
        shell: bash
        run: |
          git fetch --no-tags origin main
          git config user.name 'GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main || true
      - name: Resolve exactly four reviewed conflicts with main curation preserved
        run: |
          python3 scripts/cucsh/reconcile_sincronia_main_conflicts.py --output /tmp/sincronia-integration-report.json
          git add acerca.html scripts/cucsh/harvest.py src/data/cucsh-filosofia.json tests/cucsh-filosofia.test.mjs
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 -m py_compile scripts/cucsh/harvest.py scripts/cucsh/reconcile_sincronia_main_conflicts.py
          echo "SINCRONIA_UNMERGED_FILES_ZERO"
      - name: Run application tests for integrated feature and main
        shell: bash
        run: |
          npm ci
          set +e
          npm test > /tmp/sincronia-rehearsal-npm.log 2>&1
          status=$?
          set -e
          cat /tmp/sincronia-rehearsal-npm.log | tail -80
          echo "SINCRONIA_INTEGRATION_NPM_TEST_EXIT $status"
          echo "$status" > /tmp/sincronia-rehearsal-npm-status.txt
      - name: Run Python auditing and source conservation tests
        shell: bash
        run: |
          set +e
          python3 -m unittest tests.test_cucsh_sincronia_pending_authors tests.test_cucsh_sincronia_final_nonarticle_triage tests.test_cucsh_validate_update > /tmp/sincronia-rehearsal-python.log 2>&1
          status=$?
          set -e
          tail -100 /tmp/sincronia-rehearsal-python.log
          echo "SINCRONIA_INTEGRATION_PYTHON_TEST_EXIT $status"
          echo "$status" > /tmp/sincronia-rehearsal-python-status.txt
      - name: Inspect merged source and preserve dry-run report only
        shell: bash
        run: |
          echo "SINCRONIA_MAIN_HEAD $(git rev-parse origin/main)"
          echo "SINCRONIA_FEATURE_HEAD $(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          c={}
          for row in d["records"]:
              name=row["journal"]
              c[name]=c.get(name,0)+1
          assert c=={"Protrepsis":248,"Quadripartita Ratio":88,"Sincronía":1454},c
          assert len(d["records"])==1790
          print("SINCRONIA_MAIN_CURATED_PLUS_1454_RECORDS_PASS",c)
          PY
          git status --short | tail -25
          echo "SINCRONIA_REHEARSAL_NO_REMOTE_PUSH"
      - name: Publish integration rehearsal, failure details, provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-reconciled-main-rehearsal
          path: |
            /tmp/sincronia-integration-report.json
            /tmp/sincronia-rehearsal-npm.log
            /tmp/sincronia-rehearsal-npm-status.txt
            /tmp/sincronia-rehearsal-python.log
            /tmp/sincronia-rehearsal-python-status.txt
          retention-days: 30
          if-no-files-found: warn
