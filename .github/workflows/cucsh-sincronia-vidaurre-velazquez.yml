name: Sincronía · restore Carmen Vidaurre Velázquez article

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-vidaurre-velazquez.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-vidaurre-velazquez-issue13
  cancel-in-progress: false

jobs:
  restore-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test author-reproduced issue identity and immutable metadata
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_vidaurre_velazquez
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly one Vidaurre Velázquez work
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-velazquez-before.json
          python3 -m scripts.cucsh.restore_sincronia_vidaurre_velazquez \
            --input /tmp/cucsh-velazquez-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate no loss, counts and unresolved-review safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-velazquez-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-velazquez-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-velazquez-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.validate_update import safe_vidaurre_velazquez_restoration

          before=json.loads(Path("/tmp/cucsh-velazquez-before.json").read_text(encoding="utf-8"))
          after=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert changed==["cucsh:sincronia-legacy:a560672620601b8a849e"],changed

          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence",
          }
          old,new=b[changed[0]],a[changed[0]]
          assert old["journal"]==new["journal"]=="Sincronía"
          assert old["issueNumber"]==new["issueNumber"]==13
          assert old["year"]==new["year"]==2000
          assert safe_vidaurre_velazquez_restoration(old,new)
          for field in set(old)|set(new):
              if field not in permitted:
                  assert old.get(field)==new.get(field),(changed[0],field)
          assert old["urls"]==new["urls"]
          assert old["legacyAccessStatus"]==new["legacyAccessStatus"]

          report=json.loads(Path("/tmp/sincronia-velazquez-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["articleCandidatesExcludingEditorialNavigation"]==1452
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==83
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==81
          assert report["suspectedWorkIdentityCount"]==33
          assert report["bibliographicConflictCount"]==1
          assert len(report["unresolvedIssue50UrlMappings"])==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_VIDAURRE_VELAZQUEZ_STRICT_PASS",len(changed),83,33)
          PY
      - name: Run complete application regression suite
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore Carmen Vidaurre Velázquez Sincronía issue 13 work"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload historical quality and remaining review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-vidaurre-velazquez-${{ github.run_id }}
          path: |
            /tmp/sincronia-velazquez-historical-quality.json
            /tmp/sincronia-velazquez-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
