name: Sincronía · recover pending authors and damaged metadata

# Single opt-in source pass. Never auto-run on ordinary branch edits.
on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-remaining-v1.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-remaining-metadata-v1
  cancel-in-progress: false

jobs:
  targeted-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Test safeguards before fetching external pages
        run: |
          python3 -m py_compile scripts/cucsh/enrich_sincronia_remaining.py
          python3 -m unittest tests.test_cucsh_sincronia_remaining

      - name: Inspect only remaining historical source pages
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-remediation.json
          python3 -u -m scripts.cucsh.enrich_sincronia_remaining \
            --before /tmp/cucsh-before-remediation.json \
            --after /tmp/cucsh-targeted-candidate.json \
            --report /tmp/sincronia-remaining-evidence.json \
            2>&1 | tee /tmp/sincronia-remaining-run.log

      - name: Strict snapshot, historical, and no-loss audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-remediation.json \
            --after /tmp/cucsh-targeted-candidate.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input /tmp/cucsh-targeted-candidate.json \
            --output /tmp/sincronia-remaining-quality.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path("/tmp/cucsh-before-remediation.json").read_text())
          after=json.loads(Path("/tmp/cucsh-targeted-candidate.json").read_text())
          # This enrichment pass must never add/drop records, but the corpus
          # baseline can legitimately grow through separately verified backfills.
          assert len(after["records"])==len(before["records"])
          b={r["id"]:r for r in before["records"]}
          a={r["id"]:r for r in after["records"]}
          assert set(a)==set(b)
          for key, prior in b.items():
              current=a[key]
              for field in ("id","journal","issueNumber","urls","year","sourceId","doi"):
                  assert current.get(field)==prior.get(field),(key,field)
              if prior.get("journal")!="Sincronía":
                  assert current==prior,key
              if prior.get("authors"):
                  assert prior["authors"]==current.get("authors"),key
          print("TARGETED_NO_LOSS_AUDIT_PASS",len(a))
          PY

      - name: Full application and search regression with enriched snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/cucsh-targeted-candidate.json src/data/cucsh-filosofia.json
          npm ci
          npm test

      - name: Commit verified changes on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          if git diff --cached --quiet; then
            echo "No sufficiently verified new metadata to commit"
          else
            test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
            git diff --cached --check
            git commit -m "Enrich source-verified remaining Sincronía metadata"
            git push origin HEAD:feature/cucsh-sincronia
          fi

      - name: Save report with source evidence and unresolved cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-remaining-evidence-${{ github.run_id }}
          path: |
            /tmp/sincronia-remaining-evidence.json
            /tmp/sincronia-remaining-quality.json
            /tmp/sincronia-remaining-run.log
          retention-days: 30
          if-no-files-found: warn
