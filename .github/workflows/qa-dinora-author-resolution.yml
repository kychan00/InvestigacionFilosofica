name: QA Dinora author resolution

on:
  pull_request:
    paths:
      - "scripts/qa/dinora-author-resolution-production.mjs"
      - ".github/workflows/qa-dinora-author-resolution.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect Dinora production response
        run: node scripts/qa/dinora-author-resolution-production.mjs
