name: Sample OpenAlex philosophy with abstracts

on:
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb huggingface_hub

      - name: Audit philosophy abstracts
        run: |
          python scripts/openalex/sample_philosophy_with_abstracts.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: openalex-philosophy-abstract-audit
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/openalex/philosophy-abstract-audit.parquet
