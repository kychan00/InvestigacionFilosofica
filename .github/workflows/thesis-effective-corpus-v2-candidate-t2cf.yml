name: Thesis Effective Corpus V2 Candidate T2CF

on:
  pull_request:
    paths:
      - "scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py"
      - "scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json"
      - "tests/test_thesis_effective_corpus_v2_candidate_t2cf.py"
      - "docs/THESIS_EFFECTIVE_CORPUS_V2_CANDIDATE_T2CF.md"
      - ".github/workflows/thesis-effective-corpus-v2-candidate-t2cf.yml"
      - "scripts/thesis/apply_work_admission_decisions_v2.py"
      - "scripts/thesis/config/work-admission-decisions-v2.json"
      - "scripts/thesis/config/philosophy-official-supplement-v1.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile and run focused regressions
        run: |
          python -m py_compile scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py
          python -m unittest tests.test_thesis_effective_corpus_v2_candidate_t2cf -v
          python -m unittest tests.test_thesis_work_admission_activation_t2cc -v
          python -m unittest tests.test_thesis_philosophy_completeness_v1 -v

      - name: Verify merged human approvals independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo=os.environ["GITHUB_REPOSITORY"]
          contract=json.loads(
              Path("scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json")
              .read_text(encoding="utf-8")
          )
          dcts=json.loads(
              Path("scripts/thesis/config/work-admission-decisions-v2.json")
              .read_text(encoding="utf-8")
          )

          approvals=[
              {
                  "label":"T2CE",
                  **contract["philosophy"]["approval"],
              }
          ]
          for row in dcts["decisions"]:
              approvals.append({
                  "label":row["workId"],
                  **row["approval"],
              })

          for expected in approvals:
              actual=json.loads(subprocess.check_output([
                  "gh","api",
                  f"/repos/{repo}/pulls/{expected['pullRequest']}"
              ],text=True))
              assert actual["merged"] is True,expected["label"]
              assert actual["merge_commit_sha"]==expected["mergeCommitSha"],expected["label"]
              assert actual["head"]["sha"]==expected["approvedHeadSha"],expected["label"]
              assert actual["base"]["ref"]=="main",expected["label"]
              print(
                  expected["label"],
                  "approved by PR",
                  expected["pullRequest"],
                  expected["mergeCommitSha"],
              )
          PY

      - name: Download and verify immutable Effective Corpus V1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/t2cf-base artifacts/t2cf
          mkdir -p /tmp/t2cf-base artifacts/t2cf/a artifacts/t2cf/b
          gh release download thesis-effective-corpus-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/t2cf-base

          python scripts/thesis/build_effective_corpus_release_manifest_v1.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2bz-v1.json \
            --release-dir /tmp/t2cf-base \
            --root-release-manifest release-manifest.json

      - name: Build T2CF candidate twice
        run: |
          for pass in a b; do
            python scripts/thesis/build_effective_corpus_v2_candidate_t2cf.py \
              --base /tmp/t2cf-base/effective-corpus.json.gz \
              --contract scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json \
              --registry scripts/thesis/config/program-authority-v1.json \
              --output-corpus "artifacts/t2cf/${pass}/candidate.json" \
              --output-gzip "artifacts/t2cf/${pass}/candidate.json.gz" \
              --output-report "artifacts/t2cf/${pass}/report.json" \
              --output-json-sha "artifacts/t2cf/${pass}/candidate.json.sha256" \
              --output-gzip-sha "artifacts/t2cf/${pass}/candidate.json.gz.sha256"
          done

      - name: Assert deterministic composition and exact delta
        run: |
          cmp artifacts/t2cf/a/candidate.json artifacts/t2cf/b/candidate.json
          cmp artifacts/t2cf/a/candidate.json.gz artifacts/t2cf/b/candidate.json.gz
          cmp artifacts/t2cf/a/report.json artifacts/t2cf/b/report.json
          cmp artifacts/t2cf/a/candidate.json.sha256 artifacts/t2cf/b/candidate.json.sha256
          cmp artifacts/t2cf/a/candidate.json.gz.sha256 artifacts/t2cf/b/candidate.json.gz.sha256

          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root=Path("artifacts/t2cf/a")
          corpus=json.loads((root/"candidate.json").read_text(encoding="utf-8"))
          report=json.loads((root/"report.json").read_text(encoding="utf-8"))
          contract=json.loads(
              Path("scripts/thesis/config/effective-corpus-v2-candidate-t2cf.json")
              .read_text(encoding="utf-8")
          )
          expected=contract["expected"]

          assert corpus["publicationState"]=="candidate-not-release"
          assert corpus["effectiveCorpusSchemaVersion"]=="thesis-effective-corpus-v2"
          assert len(corpus["works"])==expected["works"]==27580
          counts=dict(sorted(Counter(
              row["admissionStatus"] for row in corpus["works"]
          ).items()))
          assert counts==expected["admission"],counts
          assert report["afterAdmission"]==expected["admission"]
          assert report["newWorkIds"]==expected["newWorkIds"]
          assert report["releasePublished"] is False
          assert report["pagesPublishedFromCandidate"] is False
          assert report["curatedInterdisciplinaryViewCanonicalized"] is False

          indexed={row["id"]:row for row in corpus["works"]}
          assert indexed["thesis:work:00024461"]["admissionStatus"]=="include"
          assert indexed["thesis:work:00024462"]["admissionStatus"]=="review"
          assert indexed["thesis:work:00002062"]["admissionStatus"]=="include"
          assert indexed["thesis:work:00024461"]["workAdmissionDecision"][
              "revision"
          ]=="2026-11-03.t2cc-v2"

          new_ids=set(expected["newWorkIds"])
          new_works=[row for row in corpus["works"] if row["id"] in new_ids]
          assert len(new_works)==4
          assert all(row["admissionStatus"]=="include" for row in new_works)

          sources={row["id"]:row for row in corpus["sourceRecords"]}
          new_refs={ref for work in new_works for ref in work["sourceRecordRefs"]}
          assert len(new_refs)==4
          for ref in new_refs:
              url=(sources[ref].get("recordUrl") or "").lower()
              assert url.startswith("https://"),url
              assert ".pdf" not in url and "/bitstream" not in url and "/download" not in url,url

          json_sha=(root/"candidate.json.sha256").read_text().strip()
          gzip_sha=(root/"candidate.json.gz.sha256").read_text().strip()
          assert json_sha==hashlib.sha256((root/"candidate.json").read_bytes()).hexdigest()
          assert gzip_sha==hashlib.sha256((root/"candidate.json.gz").read_bytes()).hexdigest()

          print(json.dumps({
              "works":len(corpus["works"]),
              "admission":counts,
              "newWorkIds":sorted(new_ids),
              "jsonSha256":json_sha,
              "gzipSha256":gzip_sha,
              "publicationState":corpus["publicationState"],
          },ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Enforce reference-only artifact surface
        run: |
          if find artifacts/t2cf -type f \
            \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.djvu' -o -iname '*.bin' \) \
            | grep -q .; then
            echo "Forbidden document/full-text artifact found in T2CF" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-effective-corpus-v2-candidate-t2cf
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/t2cf/a/candidate.json.gz
            artifacts/t2cf/a/candidate.json.sha256
            artifacts/t2cf/a/candidate.json.gz.sha256
            artifacts/t2cf/a/report.json
