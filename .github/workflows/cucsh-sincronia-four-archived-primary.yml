name: Sincronía · restore four signed Wayback bylines

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-four-archived-primary.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-four-signed-wayback-originals
  cancel-in-progress: false

jobs:
  restore-four:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test exact archived signatures and unchanged historical index
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_four_archived_primary
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly four signed original bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-four-archive-before.json
          python3 -m scripts.cucsh.restore_sincronia_four_archived_primary \
            --input /tmp/cucsh-four-archive-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Validate original records and full author queue
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-four-archive-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-archive-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-four-archive-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_four_archived_primary import SOURCES

          before_data=json.loads(Path("/tmp/cucsh-four-archive-before.json").read_text(encoding="utf-8"))
          after_data=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          b={r["id"]:r for r in before_data["records"]}
          a={r["id"]:r for r in after_data["records"]}
          assert len(b)==len(a)==1845
          assert list(b)==list(a)
          changed=[rid for rid in b if b[rid]!=a[rid]]
          assert len(changed)==4 and set(changed)==set(SOURCES),changed

          for rid in changed:
              old,new=b[rid],a[rid]
              source=SOURCES[rid]
              assert old["journal"]==new["journal"]=="Sincronía"
              for field in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert old[field]==new[field],(rid,field)
              assert old.get("legacyTitleEncodingEvidence")==new.get("legacyTitleEncodingEvidence")
              assert {k for k in set(old)|set(new)
                      if old.get(k)!=new.get(k)}=={"authors","legacyAuthorEvidence"}
              assert new["authors"]==[{"name":source["author"],"sourceName":source["author"]}]
              ev=new["legacyAuthorEvidence"]
              assert ev["sourceUrl"]==source["snapshot"]
              assert ev["sourceArticleUrl"]==source["url"]
              assert ev["sourcePrintedByline"]==source["printedByline"]
              assert ev["matchedIndexedYear"]==source["year"]
              assert ev["matchedIndexedIssue"]==source["issue"]
              assert ev["originalAvailabilityPreserved"]
              assert ev["urlMatchLevel"]=="exact-historical-url-with-optional-http-default-port"

          gilbert=a["cucsh:sincronia-legacy:af98cc00a0388baabb3d"]
          assert gilbert["title"]=="Publicación electrónica en Latinoamerica,"
          ge=gilbert["legacyAuthorEvidence"]
          assert ge["sourceArticleTitle"]=="Publicaciones Electrónicas en México"
          assert ge["creditedTranslatorNotCoauthor"]=="Dolores Pérez Padilla"
          assert ge["indexedVsArchivedTitleDiscrepancy"]
          assert gilbert["authors"]==[{"name":"Stephen W. Gilbert","sourceName":"Stephen W. Gilbert"}]

          fignoni=a["cucsh:sincronia-legacy:5a5c77cbf7b126732d8e"]
          assert fignoni["legacyAccessStatus"]["status"]=="original-page-unavailable"
          assert fignoni["urls"]["canonical"].endswith("/figioni.htm")
          assert fignoni["authors"]==[{"name":"Alicia Fignoni","sourceName":"Alicia Fignoni"}]

          report=json.loads(Path("/tmp/sincronia-four-archive-pending-authors.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["pendingAuthorRecords"]==47
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==45
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FOUR_SIGNED_ARCHIVED_PASS",len(changed),47)
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified corpus data to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree modifications"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore four Sincronía signatures from primary Wayback captures"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload archival quality and remaining-byline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-four-signed-primary
          path: |
            /tmp/sincronia-four-archive-historical-quality.json
            /tmp/sincronia-four-archive-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
