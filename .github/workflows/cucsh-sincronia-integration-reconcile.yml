name: Sincronía · assess safe reconciliation with main

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-integration-reconcile.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-main-reconciliation-probe
  cancel-in-progress: false

jobs:
  compare-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inspect divergence and dry-run merge of current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sincronia-main-reconciliation
          git fetch --no-tags origin main
          echo "$(git rev-parse HEAD)" > /tmp/sincronia-main-reconciliation/sincronia-head.txt
          echo "$(git rev-parse origin/main)" > /tmp/sincronia-main-reconciliation/main-head.txt
          base="$(git merge-base HEAD origin/main)"
          echo "$base" > /tmp/sincronia-main-reconciliation/merge-base.txt
          git rev-list --left-right --count origin/main...HEAD > /tmp/sincronia-main-reconciliation/divergence.txt
          git diff --name-only "$base" HEAD | LC_ALL=C sort -u > /tmp/sincronia-main-reconciliation/feature-changed-paths.txt
          git diff --name-only "$base" origin/main | LC_ALL=C sort -u > /tmp/sincronia-main-reconciliation/main-changed-paths.txt
          LC_ALL=C comm -12 /tmp/sincronia-main-reconciliation/feature-changed-paths.txt /tmp/sincronia-main-reconciliation/main-changed-paths.txt > /tmp/sincronia-main-reconciliation/overlap-paths.txt
          set +e
          git -c user.name='GitHub Actions' -c user.email='actions@users.noreply.github.com' merge --no-commit --no-ff origin/main > /tmp/sincronia-main-reconciliation/merge-attempt.log 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/sincronia-main-reconciliation/merge-exit-code.txt
          git diff --name-only --diff-filter=U | LC_ALL=C sort > /tmp/sincronia-main-reconciliation/conflicting-paths.txt
          git status --short > /tmp/sincronia-main-reconciliation/merge-status.txt
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path("/tmp/sincronia-main-reconciliation")
          path="src/data/cucsh-filosofia.json"
          row={}
          for stage,label in ((2,"feature"),(3,"main")):
              result=subprocess.run(["git","show",f":{stage}:{path}"],capture_output=True,check=True)
              doc=json.loads(result.stdout)
              records=doc["records"]
              journals={}
              for r in records:
                  key=r.get("journal")
                  journals[key]=journals.get(key,0)+1
              row[label]={"schemaVersion":doc.get("schemaVersion"),"provider":doc.get("provider"),
                          "recordCount":len(records),"journals":journals,
                          "recordsById":{r["id"]:r for r in records}}
          common=set(row["feature"]["recordsById"]) & set(row["main"]["recordsById"])
          changed=[i for i in common if row["feature"]["recordsById"][i]!=row["main"]["recordsById"][i]]
          merged={
              "feature":{"records":row["feature"]["recordCount"],"journals":row["feature"]["journals"]},
              "main":{"records":row["main"]["recordCount"],"journals":row["main"]["journals"]},
              "sharedIdCount":len(common),"differingSharedIdCount":len(changed),
              "differingSharedIdSamples":sorted(changed)[:12],
              "mainOnlyIdCount":len(set(row["main"]["recordsById"])-common),
              "featureOnlyIdCount":len(set(row["feature"]["recordsById"])-common),
          }
          (root/"corpus-overlap.json").write_text(json.dumps(merged,ensure_ascii=False,indent=2)+"\n")
          print("SINCRONIA_CORPUS_CONFLICT",json.dumps(merged,ensure_ascii=False))
          for file in ("acerca.html","scripts/cucsh/harvest.py","tests/cucsh-filosofia.test.mjs"):
              data=Path(file).read_text(encoding="utf-8").splitlines()
              groups=[]; active=None
              for line in data:
                  if line.startswith("<<<<<<< "):
                      active=[line]
                  elif active is not None:
                      active.append(line)
                      if line.startswith(">>>>>>> "):
                          groups.append(active)
                          active=None
              print("SINCRONIA_TEXT_CONFLICT",file,"hunks",len(groups))
              for i,block in enumerate(groups):
                  print("SINCRONIA_CONFLICT_START",file,i,"lines",len(block))
                  for ln in block[:80]:
                      print("    "+ln[:250])
                  if len(block)>80:
                      print("    ...truncated",len(block)-80)
                  print("SINCRONIA_CONFLICT_END",file,i)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/sincronia-main-reconciliation")
          read=lambda name:(p/name).read_text(encoding="utf-8").splitlines()
          data={
            "state":"safe_auto_merge" if read("merge-exit-code.txt")==["0"] else "conflicts_require_review",
            "mainHead":read("main-head.txt")[0],
            "featureHead":read("sincronia-head.txt")[0],
            "mergeBase":read("merge-base.txt")[0],
            "divergenceMainBehindFeature":read("divergence.txt")[0].split()[0],
            "divergenceFeatureAheadMain":read("divergence.txt")[0].split()[1],
            "mainChangedFileCount":len(read("main-changed-paths.txt")),
            "featureChangedFileCount":len(read("feature-changed-paths.txt")),
            "overlapCount":len(read("overlap-paths.txt")),
            "overlapFiles":read("overlap-paths.txt"),
            "conflictCount":len(read("conflicting-paths.txt")),
            "conflictFiles":read("conflicting-paths.txt"),
            "mergeOperationWasReadOnly":True,
            "mainNotModified":True,
            "requiresUserMergeApproval":True,
          }
          (p/"summary.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          for k in ("state","mainHead","featureHead","mainChangedFileCount","featureChangedFileCount","overlapCount","conflictCount"):
            print("SINCRONIA_MERGE_PROBE",k,data[k])
          print("SINCRONIA_MERGE_PROBE_OVERLAP_FILES",json.dumps(data["overlapFiles"][:50],ensure_ascii=False))
          print("SINCRONIA_MERGE_PROBE_CONFLICT_FILES",json.dumps(data["conflictFiles"][:100],ensure_ascii=False))
          PY
          git merge --abort || true
          test -z "$(git status --porcelain)" || { echo "Dry-run changed working tree"; git status --short; exit 1; }
          echo "SINCRONIA_DRY_RUN_ONLY_NO_BRANCH_CHANGED"
      - name: Upload merge assessment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-main-reconciliation-probe
          path: /tmp/sincronia-main-reconciliation/
          retention-days: 30
          if-no-files-found: warn
