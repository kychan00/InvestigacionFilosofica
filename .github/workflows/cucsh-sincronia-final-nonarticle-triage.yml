name: Sincronía · final non-article and unresolved-byline audit

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-final-nonarticle-triage.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-final-nonarticle-and-campos-audit
  cancel-in-progress: false

jobs:
  verify-final-bibliography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test original page identity, biography and interview chronology
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_final_nonarticle_triage
          python3 -m unittest tests.test_cucsh_sincronia_pending_authors
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Produce full historical and final author triage reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-final-triage-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-final-triage-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-final-triage-pending.json").read_text(encoding="utf-8"))
          assert d["totalSincroniaRecords"]==1454
          assert d["pendingAuthorRecords"]==4
          assert d["highConfidenceEditorialNavigationCount"]==2
          assert d["highConfidenceBiographicalNonArticleCount"]==1
          assert d["highConfidenceNonArticleCount"]==3
          assert d["pendingNonArticleRecordsNoBylineRequired"]==3
          assert d["pendingAuthorshipCasesExcludingVerifiedNonArticles"]==1
          assert d["authorlessArticleCandidatesExcludingEditorialNavigation"]==2
          assert d["unresolvedOriginalWorkIdentityConflictCount"]==1
          assert d["unresolvedOriginalWorkIdentityConflicts"][0]["indexedYear"]==2000
          campos=d["unresolvedOriginalWorkIdentityConflicts"][0]
          assert campos["issue15DatingEvidence"]["season"]=="Verano / Summer"
          assert campos["issue15DatingEvidence"]["monthRange"]=="Junio-Septiembre 2000"
          assert len(campos["sameYearIndependentBibliographyCandidates"])==2
          assert not any(c["matchedOriginalUrl"] for c in campos["sameYearIndependentBibliographyCandidates"])
          assert d["unresolvedOriginalWorkIdentityConflicts"][0]["laterPageInternalIssueYear"]==2001
          assert d["pendingByIssue"]=={"8":1,"15":1,"46":2}
          assert d["bibliographicConflictCount"]==0
          assert d["titlesWithUnicodeReplacementCharacter"]==0
          known_nonarticles={x["id"] for x in d["highConfidenceNonArticleRecords"]}
          assert known_nonarticles=={
              "cucsh:sincronia-legacy:a9b2551729fe0893d5e3",
              "cucsh:sincronia-legacy:91f36da6674c93b19145",
              "cucsh:sincronia-legacy:a2763a903fcca568e32a",
          }
          lines=[
              "# Sincronía: bibliographic completion status",
              "",
              "Conserved Sincronía source rows: 1,454; no records deleted.",
              "Source author field missing in 4 original records.",
              "Three are non-article records not requiring a scholarly byline:",
              "- /dante/bio.html: Dante Medina biography, signed author not evidenced",
              "- /creditos.html: editorial board navigation",
              "- /info.htm: contributor instructions",
              "",
              "One genuine unresolved scholarly source identity remains:",
              "- /campos.htm: original issue 15, 2000, indexed as de Campos,Jorge Lucio",
              "- A later archived same URL shows a separate 2001 interview; never overwrite 2000 identity",
              "- Reproduced issue header independently establishes issue 15 as Summer, June-September 2000",
              "- Campos bibliography names two 2000 Sincronía candidates (Deleuze; education/technology), neither confirmed at /campos.htm",
              "- A thesis citing the Deleuze essay in 2006 points instead to distinct /campos2.htm; do not substitute URLs",
              "",
              "Original URLs, source statuses, issues and titles remain unchanged.",
              "No authors assigned on the basis of ambiguous catalog entries.",
          ]
          Path("/tmp/sincronia-final-triage.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("SINCRONIA_ONE_REAL_AUTHORSHIP_RESEARCH_CASE",d["pendingAuthorshipCasesExcludingVerifiedNonArticles"])
          PY
      - name: Run complete application regression
        run: |
          npm ci
          npm test
      - name: Enforce no metadata or corpus modification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)" || {
            git status --short
            echo "Unexpected worktree modification"
            exit 1
          }
          echo "SINCRONIA_FINAL_AUDIT_READ_ONLY_PASSED"
      - name: Upload human-readable and machine-readable completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-final-nonarticle-triage
          path: |
            /tmp/sincronia-final-triage.md
            /tmp/sincronia-final-triage-history.json
            /tmp/sincronia-final-triage-pending.json
          retention-days: 30
          if-no-files-found: warn
