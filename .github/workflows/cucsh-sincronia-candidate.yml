name: Sincronía · complete corpus candidate (no publish)

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-candidate.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sincronia-full-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Preflight and application regression suite
        run: |
          python3 -m py_compile scripts/cucsh/assemble_sincronia_candidate.py
          python3 -m unittest tests/test_cucsh_sincronia.py tests/test_cucsh_sincronia_dialnet.py tests/test_cucsh_sincronia_legacy.py tests/test_cucsh_validate_update.py
          npm ci
          npm test

      - name: Download historical evidence from the proven recovery run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sincronia-history
          gh run download 42961992150 \
            --repo "${{ github.repository }}" \
            --name sincronia-legacy-v3-42961992150 \
            --dir /tmp/sincronia-history
          test -s /tmp/sincronia-history/sincronia-legacy-v3.json

      - name: Assemble complete candidate from source-backed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -u -m scripts.cucsh.assemble_sincronia_candidate \
            --before src/data/cucsh-filosofia.json \
            --historical-evidence /tmp/sincronia-history/sincronia-legacy-v3.json \
            --candidate /tmp/cucsh-sincronia-candidate.json \
            --report /tmp/cucsh-sincronia-candidate-report.json \
            2>&1 | tee /tmp/cucsh-sincronia-candidate.log

      - name: Strict release validation without release or commit
        run: |
          python3 scripts/cucsh/validate_update.py \
            --before src/data/cucsh-filosofia.json \
            --after /tmp/cucsh-sincronia-candidate.json

      - name: Upload candidate and evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-candidate-${{ github.run_id }}
          path: |
            /tmp/cucsh-sincronia-candidate.json
            /tmp/cucsh-sincronia-candidate-report.json
            /tmp/cucsh-sincronia-candidate.log
          if-no-files-found: warn
          retention-days: 14
