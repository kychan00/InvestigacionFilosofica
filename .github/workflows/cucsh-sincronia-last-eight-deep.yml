name: Sincronía · investigate last eight difficult originals

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-last-eight-deep.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronia-last-eight-deep-primary-research
  cancel-in-progress: false

jobs:
  research-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test strictly bounded original and alternate-host archival evidence
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_last_eight_primary
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Verify latest authorless queue and unchanged work inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-last-eight-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-last-eight-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-last-eight-pending.json").read_text(encoding="utf-8"))
          assert d["totalSincroniaRecords"]==1454
          assert d["pendingAuthorRecords"]==16
          assert d["authorlessArticleCandidatesExcludingEditorialNavigation"]==14
          assert d["highConfidenceEditorialNavigationCount"]==2
          assert d["bibliographicConflictCount"]==0
          assert d["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_16_PENDING_LAST_EIGHT_PRECHECK_PASS")
          PY
      - name: Inspect original and alternate captures with extended article text
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.cucsh.research_sincronia_last_eight_primary \
            --input /tmp/sincronia-last-eight-pending.json \
            --output /tmp/sincronia-last-eight-deep-captures.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/sincronia-last-eight-deep-captures.json").read_text(encoding="utf-8"))
          assert d["inputPendingAuthors"]==16
          assert d["selected"]==8
          assert d["authorsAutomaticallyAssigned"]==0
          assert d["sourceCorpusModified"] is False
          assert len(d["records"])==8
          assert all(x["authorAttribution"] is None for x in d["records"])
          lines=[
             "# Sincronía: eight difficult original URLs — deep archival review",
             "",
             "**Read-only lead discovery, not proven authorship.**",
             "",
             "| Issue | Indexed label | Exact host readable | Alternate host readable |",
             "|---|---|---:|---:|",
          ]
          for row in d["records"]:
              all_sources=row["candidateSourceCaptures"]
              exact=sum(c.get("fetchStatus")=="html" for c in all_sources[0]["captures"])
              alternate=sum(c.get("fetchStatus")=="html" for source in all_sources[1:] for c in source["captures"])
              lines.append(
                  f'| {row["issueNumber"]} | {row["indexedTitle"].replace("|","/")} | {exact} | {alternate} |'
              )
          lines.extend([
              "",
              "Historical host variants may represent different publications even when filenames match.",
              "Inspect the original byline, internal title, text and chronology before any attribution.",
              "Biographical subjects, interviewees and reviewed-book authors are not automatically work authors.",
          ])
          Path("/tmp/sincronia-last-eight-deep-report.md").write_text(
             "\n".join(lines)+"\n",encoding="utf-8"
          )
          print("SINCRONIA_EIGHT_READ_ONLY_EVIDENCE_REPORT_PASS")
          PY
      - name: Complete application regression
        run: |
          npm ci
          npm test
      - name: Verify no changes to indexed bibliography or worktree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
          echo "SINCRONIA_LAST_EIGHT_INDEX_UNCHANGED"
      - name: Upload original archived article text and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-last-eight-deep-primary
          path: |
            /tmp/sincronia-last-eight-deep-captures.json
            /tmp/sincronia-last-eight-deep-report.md
            /tmp/sincronia-last-eight-history.json
            /tmp/sincronia-last-eight-pending.json
          retention-days: 30
          if-no-files-found: warn
