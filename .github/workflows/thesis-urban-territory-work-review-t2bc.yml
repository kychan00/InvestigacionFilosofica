name: Thesis urban territory work review T2BC

on:
  pull_request:
    paths:
      - "scripts/thesis/build_boundary_work_review_queue_v1.py"
      - "scripts/thesis/config/boundary-work-review-policy-v1.json"
      - "scripts/thesis/config/urban-territory-work-review-baseline-v1.json"
      - "tests/test_thesis_boundary_work_review_queue.py"
      - "docs/THESIS_URBAN_TERRITORY_WORK_REVIEW_QUEUE_V1.md"
      - ".github/workflows/thesis-urban-territory-work-review-t2bc.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_boundary_work_review_queue.py" -v

      - name: Compile builder
        run: |
          python -m py_compile scripts/thesis/build_boundary_work_review_queue_v1.py

      - name: Download frozen full corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-t2bc artifacts/thesis-urban-territory-work-review
          mkdir -p /tmp/thesis-t2bc artifacts/thesis-urban-territory-work-review
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-t2bc.zip
          unzip -q /tmp/thesis-t2bc.zip -d /tmp/thesis-t2bc

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-t2bc/canonical-corpus.json.gz \
            --source-records /tmp/thesis-t2bc/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-urban-territory-work-review/canonical-confidence.json \
            --output-report artifacts/thesis-urban-territory-work-review/confidence-report.json

      - name: Build boundary work review queue
        run: |
          python scripts/thesis/build_boundary_work_review_queue_v1.py \
            --canonical-corpus artifacts/thesis-urban-territory-work-review/canonical-confidence.json \
            --reference-year 2026 \
            --output-dir artifacts/thesis-urban-territory-work-review/queue

      - name: Validate full T2BC contract under current shared policy
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("artifacts/thesis-urban-territory-work-review")
          queue = json.loads(
              (root / "queue/boundary-work-review-queue.json").read_text()
          )
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "urban-territory-work-review-baseline-v1.json"
              ).read_text()
          )
          policy = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "boundary-work-review-policy-v1.json"
              ).read_text()
          )
          scope = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "scope-boundary-matrix-v1.json"
              ).read_text()
          )
          confidence = json.loads(
              (root / "confidence-report.json").read_text()
          )
          registry = json.loads(
              Path(
                  "scripts/thesis/config/program-authority-v1.json"
              ).read_text()
          )
          expected = baseline["expected"]
          dcts_ref = baseline["programRef"]
          cognition_ref = "program:udg:doc-cognicion-aprendizaje"

          # Preserve the historical T2BC baseline while testing it against the
          # current registries/policies.
          assert baseline["programAuthorityRevision"] == "2026-11-02.v34"
          assert baseline["scopePolicyRevision"] == "2026-11-02.v4"
          assert baseline["programMetadataEvidenceRevision"] == "2026-11-02.v4"
          assert baseline["workReviewPolicyRevision"] == "2026-11-02.urban-v1"

          assert registry["registryRevision"] == "2026-11-03.v47"
          assert scope["policyRevision"] == "2026-11-02.v5"
          assert (
              confidence["programMetadataEvidenceRevision"]
              == "2026-11-02.v5"
          )
          assert policy["policyRevision"] == "2026-11-03.boundary-v4"
          assert queue["policyRevision"] == policy["policyRevision"]
          assert queue["decisionConstraint"] == (
              "boundary-work-review-does-not-change-admission"
          )
          assert {
              item["programRef"] for item in policy["programs"]
          } == {dcts_ref, cognition_ref, "program:udg:doc-derechos-humanos", "program:udg:mae-estudios-genero"}

          dcts_authority = next(
              p for p in registry["programs"] if p["id"] == dcts_ref
          )
          cognition_authority = next(
              p for p in registry["programs"] if p["id"] == cognition_ref
          )
          assert dcts_authority["admissionState"] == "review"
          assert dcts_authority["observedCount"] == expected["works"]
          assert cognition_authority["admissionState"] == "review"
          assert cognition_authority["observedCount"] == 4

          # The shared queue now has two REVIEW programs, but the historical
          # DCTS cohort contract remains exact.
          metrics = queue["metrics"]
          assert metrics["programs"] == 4
          assert metrics["workItems"] == expected["works"] + 29
          assert metrics["projectedAdmission"] == {
              "review": expected["works"] + 28
          }
          assert metrics["pendingPrimarySourceReview"] == (
              expected["pendingPrimarySourceReview"] + 28
          )
          assert metrics["automaticAdmissionDecisions"] == 0
          assert metrics["admissionChanges"] == 0

          dcts_items = [
              item for item in queue["items"]
              if item["programRef"] == dcts_ref
          ]
          assert len(dcts_items) == expected["works"]
          assert Counter(
              item["projectedAdmissionStatus"] for item in dcts_items
          ) == Counter(expected["projectedAdmission"])
          assert Counter(
              item["programMetadataEvidence"]["authorityApplicability"]
              for item in dcts_items
          ) == Counter({"allowed": expected["allowedWorks"]})
          assert Counter(
              item["programMetadataEvidence"]["confidenceState"]
              for item in dcts_items
          ) == Counter({"unassessed": expected["unassessedWorks"]})
          assert Counter(
              item["academicUnitRaw"] for item in dcts_items
          ) == Counter(expected["academicUnits"])

          abstract_available = sum(
              item["supportingEvidenceAvailability"]["abstract"]
              for item in dcts_items
          )
          keywords_available = sum(
              item["supportingEvidenceAvailability"]["keywords"]
              for item in dcts_items
          )
          handles_available = sum(
              bool(item["handle"]) for item in dcts_items
          )
          contributors_available = sum(
              item["supportingEvidenceAvailability"]["contributors"]
              for item in dcts_items
          )
          date_quality = Counter(
              item["date"]["quality"] for item in dcts_items
          )
          assert abstract_available == expected["abstractAvailable"]
          assert len(dcts_items) - abstract_available == expected["missingAbstract"]
          assert keywords_available == expected["keywordsAvailable"]
          assert handles_available == expected["handleAvailable"]
          assert contributors_available == expected["contributorsAvailable"]
          assert date_quality == Counter({
              "suspicious": expected["suspiciousDateWorks"],
              "valid": expected["validDateWorks"],
          })

          assert all(
              item["workReviewState"] == "pending-primary-source-review"
              for item in dcts_items
          )
          assert all("abstract" not in item for item in dcts_items)
          assert all("keywords" not in item for item in dcts_items)

          prohibited = {
              "title", "abstract", "keywords", "semantic-similarity",
              "embedding", "language-model-classification",
          }
          assert all(
              prohibited.issubset(set(item["prohibitedAsSoleDecisionBasis"]))
              for item in dcts_items
          )

          suspicious = [
              item for item in dcts_items
              if item["date"]["quality"] == "suspicious"
          ]
          valid = [
              item for item in dcts_items
              if item["date"]["quality"] == "valid"
          ]
          assert {
              item["date"]["value"] for item in suspicious
          } == {expected["suspiciousDateValue"]}
          valid_years = sorted(
              int(str(item["date"]["value"])[:4])
              for item in valid
              if str(item["date"]["value"])[:4].isdigit()
          )
          assert valid_years[0] == expected["observedValidYears"]["min"]
          assert valid_years[-1] == expected["observedValidYears"]["max"]

          cognition_items = [
              item for item in queue["items"]
              if item["programRef"] == cognition_ref
          ]
          assert len(cognition_items) == 4
          assert len([i for i in queue["items"] if i["programRef"] == "program:udg:doc-derechos-humanos"]) == 24
          assert len([i for i in queue["items"] if i["programRef"] == "program:udg:mae-estudios-genero"]) == 1
          assert all(
              item["projectedAdmissionStatus"] == "review"
              for item in cognition_items
          )
          assert all(
              item["workReviewState"] == "pending-primary-source-review"
              for item in cognition_items
          )

          summary = {
              "phase": "T2BC-regression-under-T2BQ",
              "historicalBaseline": {
                  "programAuthorityRevision": baseline["programAuthorityRevision"],
                  "scopePolicyRevision": baseline["scopePolicyRevision"],
                  "programMetadataEvidenceRevision": baseline[
                      "programMetadataEvidenceRevision"
                  ],
                  "workReviewPolicyRevision": baseline["workReviewPolicyRevision"],
              },
              "current": {
                  "programAuthorityRevision": registry["registryRevision"],
                  "scopePolicyRevision": scope["policyRevision"],
                  "programMetadataEvidenceRevision": confidence[
                      "programMetadataEvidenceRevision"
                  ],
                  "workReviewPolicyRevision": queue["policyRevision"],
                  "workReviewPrograms": metrics["programs"],
                  "workReviewWorks": metrics["workItems"],
              },
              "dctsWorks": len(dcts_items),
              "cognitionWorks": len(cognition_items),
              "admissionChanges": metrics["admissionChanges"],
          }
          (root / "t2bc-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload T2BC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-urban-territory-work-review-t2bc
          path: artifacts/thesis-urban-territory-work-review/
          if-no-files-found: error
          retention-days: 14
