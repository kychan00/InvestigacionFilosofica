name: Thesis MCA Conservación Authority V40

on:
  pull_request:
    paths:
      - "scripts/thesis/config/program-authority-v1.json"
      - "scripts/thesis/config/mca-conservacion-authority-v40-baseline-v1.json"
      - "scripts/thesis/config/scope-boundary-matrix-v1.json"
      - "scripts/thesis/config/boundary-closure-contract-v5.json"
      - "scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py"
      - "scripts/thesis/audit_program_coverage_v1.py"
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/build_scope_boundary_matrix_v1.py"
      - "scripts/thesis/audit_boundary_closure_v1.py"
      - "tests/test_thesis_mca_conservacion_authority_v40.py"
      - "tests/test_thesis_canonical_corpus.py"
      - "tests/test_thesis_conservacion_patrimonio_edificado_authority_v35.py"
      - "tests/test_thesis_mca_historia_arquitectura_authority_v37.py"
      - "tests/test_thesis_historia_arte_authority_v39.py"
      - "docs/THESIS_MCA_CONSERVACION_AUTHORITY_V40.md"
      - ".github/workflows/thesis-mca-conservacion-authority-v40.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_thesis_mca_conservacion_authority_v40.py" -v
          python -m unittest discover -s tests -p "test_thesis_canonical_corpus.py" -v
          python -m unittest discover -s tests -p "test_thesis_conservacion_patrimonio_edificado_authority_v35.py" -v
          python -m unittest discover -s tests -p "test_thesis_mca_historia_arquitectura_authority_v37.py" -v
          python -m unittest discover -s tests -p "test_thesis_historia_arte_authority_v39.py" -v

      - name: Download frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-full-baseline artifacts/thesis-mca-conservacion-v40
          mkdir -p /tmp/thesis-full-baseline artifacts/thesis-mca-conservacion-v40
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-full-baseline.zip
          unzip -q /tmp/thesis-full-baseline.zip -d /tmp/thesis-full-baseline

      - name: Reproject Metadata Confidence V4
        run: |
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-full-baseline/canonical-corpus.json.gz \
            --source-records /tmp/thesis-full-baseline/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-mca-conservacion-v40/canonical-confidence.json \
            --output-report artifacts/thesis-mca-conservacion-v40/confidence-report.json

      - name: Reproject Program Authority V40 and Humanities queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation

          root = Path("artifacts/thesis-mca-conservacion-v40")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-full-baseline/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()

          projected, projection = coverage.reproject_corpus(
              corpus,
              registry,
              reference_year=2026,
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed,
              projection["programDimensions"],
          )
          queue = curation.build_queue(
              projected_observed,
              projected,
              registry,
          )

          for name, value in (
              ("canonical-v40.json", projected),
              ("observed-v40.json", projected_observed),
              ("projection-v40.json", projection),
              ("queue-v40.json", queue),
          ):
              (root / name).write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
              )
          PY

      - name: Build Scope Boundary Matrix V5
        run: |
          python scripts/thesis/build_scope_boundary_matrix_v1.py \
            --observed-authorities artifacts/thesis-mca-conservacion-v40/observed-v40.json \
            --canonical-corpus artifacts/thesis-mca-conservacion-v40/canonical-v40.json \
            --output-dir artifacts/thesis-mca-conservacion-v40/scope

      - name: Build Boundary Closure V5
        run: |
          python scripts/thesis/audit_boundary_closure_v1.py \
            --scope-report artifacts/thesis-mca-conservacion-v40/scope/scope-boundary-matrix.json \
            --contract scripts/thesis/config/boundary-closure-contract-v5.json \
            --output-dir artifacts/thesis-mca-conservacion-v40/boundary

      - name: Validate V40 full-corpus invariants
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "scripts/thesis")
          import build_canonical_corpus_v1 as canonical

          root = Path("artifacts/thesis-mca-conservacion-v40")
          baseline = json.loads(
              Path(
                  "scripts/thesis/config/"
                  "mca-conservacion-authority-v40-baseline-v1.json"
              ).read_text()
          )
          registry = canonical.load_program_registry()
          corpus = json.loads((root / "canonical-v40.json").read_text())
          projection = json.loads((root / "projection-v40.json").read_text())
          queue = json.loads((root / "queue-v40.json").read_text())
          confidence = json.loads((root / "confidence-report.json").read_text())
          scope = json.loads(
              (root / "scope" / "scope-boundary-matrix.json").read_text()
          )
          boundary = json.loads(
              (root / "boundary" / "boundary-closure-audit.json").read_text()
          )
          expected = baseline["expected"]

          assert baseline["registryRevision"] == "2026-11-02.v40"
          assert int(registry["registryRevision"].rsplit(".v", 1)[1]) >= 40
          assert scope["policyRevision"] == baseline["scopePolicyRevision"]
          assert baseline["programMetadataEvidenceRevision"] == "2026-11-02.v4"
          assert confidence["programMetadataEvidenceRevision"] == "2026-11-02.v5"
          assert len(corpus["works"]) == 27576

          authority = next(
              p for p in registry["programs"]
              if p["id"] == baseline["programRef"]
          )
          base = next(
              p for p in registry["programs"]
              if p["id"] == baseline["baseProgramRef"]
          )
          historical = next(
              p for p in registry["programs"]
              if p["id"] == baseline["historicalStandaloneRef"]
          )
          history_orientation = next(
              p for p in registry["programs"]
              if p["id"] == baseline["historyOrientationRef"]
          )

          assert authority["admissionState"] == "include"
          assert authority["observedCount"] == expected["works"]
          assert base["admissionState"] == "include"
          assert base["observedCount"] == 34
          assert historical["admissionState"] == "include"
          assert historical["observedCount"] == expected["historicalStandaloneWorks"]
          assert history_orientation["admissionState"] == "include"
          assert history_orientation["observedCount"] == expected["historyOrientationWorks"]

          selected = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["programRef"]
          ]
          base_works = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["baseProgramRef"]
          ]
          historical_works = [
              w for w in corpus["works"]
              if w.get("programRef") == baseline["historicalStandaloneRef"]
          ]

          assert len(selected) == expected["works"]
          assert len(base_works) == 34
          assert len(historical_works) == expected["historicalStandaloneWorks"]
          assert Counter(
              w.get("admissionStatus") for w in selected
          ) == Counter(expected["admissionStatuses"])
          assert Counter(
              w.get("admissionStatus") for w in base_works
          ) == Counter({"include": 27, "quarantine": 7})
          assert Counter(
              w.get("academicUnitRaw") for w in selected
          ) == Counter(expected["academicUnits"])
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("confidenceState")
              for w in selected
          ) == Counter({"unassessed": expected["unassessedWorks"]})
          assert Counter(
              (w.get("programMetadataEvidence") or {}).get("authorityApplicability")
              for w in selected
          ) == Counter({"allowed": expected["allowedWorks"]})
          assert sum(
              1 for w in selected
              if (w.get("programMetadataEvidence") or {}).get(
                  "authorityApplicability"
              ) == "blocked"
          ) == expected["blockedWorks"]

          assert Counter(
              w.get("programRaw") for w in selected
          ) == Counter(expected["rawProgramVariants"])
          assert Counter(
              canonical.normalize_key(w.get("programRaw") or "")
              for w in selected
          ) == Counter(expected["normalizedProgramGroups"])

          quality = Counter(
              (w.get("date") or {}).get("quality") for w in selected
          )
          assert dict(quality) == expected["dateQuality"]
          valid_years = sorted(
              int(str((w.get("date") or {}).get("value"))[:4])
              for w in selected
              if (w.get("date") or {}).get("quality") == "valid"
          )
          assert valid_years[0] == expected["observedYears"]["min"]
          assert valid_years[-1] == expected["observedYears"]["max"]

          suspicious = [
              w for w in selected
              if (w.get("date") or {}).get("quality") == "suspicious"
          ]
          assert len(suspicious) == 1
          assert (suspicious[0].get("date") or {}).get("value") == "0000"

          expected_global = dict(expected["globalProjectedAdmission"])
          # V41: generic MCA safe-era records resolve; ambiguous items quarantine.
          expected_global["review"] -= 34
          expected_global["include"] += 27
          expected_global["quarantine"] += 7
          # V42: Didáctica de las Artes / Artes Visuales REVIEW -> EXCLUDE.
          expected_global["review"] -= 16
          expected_global["exclude"] += 16
          # V43: historical MCA Urbanismo y Desarrollo REVIEW -> EXCLUDE.
          expected_global["review"] -= 8
          expected_global["exclude"] += 8
          # V44: historical MCA Edificación Arquitectónica REVIEW -> EXCLUDE.
          expected_global["review"] -= 5
          expected_global["exclude"] += 5
          # V45: Didáctica de las Artes / Artes Escénicas REVIEW -> EXCLUDE.
          expected_global["review"] -= 3
          expected_global["exclude"] += 3
          # V46: Educación y Expresión para las Artes REVIEW -> EXCLUDE.
          expected_global["review"] -= 27
          expected_global["exclude"] += 27
          # V47: MCA Teoría y Crítica de la Arquitectura REVIEW -> INCLUDE.
          expected_global["review"] -= 1
          expected_global["include"] += 1
          assert projection["projectedAdmission"] == expected_global
          assert sum(projection["projectedAdmission"].values()) == 27576

          resolved = set(expected["normalizedProgramGroups"])
          assert all(
              item["normalizedKey"] not in resolved
              for item in queue["items"]
          )
          assert all(
              item["normalizedKey"] not in resolved
              for item in queue["humanitiesActionItems"]
          )
          assert queue["metrics"]["humanitiesActionQueueItems"] == 6
          assert queue["metrics"]["humanitiesActionWorks"] == 14
          assert queue["metrics"]["workReviewQueueItems"] == 3
          assert queue["metrics"]["workReviewWorks"] == 180
          next_action = queue["nextHumanitiesAction"]
          assert expected["nextHumanitiesActionKey"] == "maestria en ciencias de la arquitectura"
          assert next_action["normalizedKey"] == "maestria en arquitectura orientacion arte y comunicacion"
          assert next_action["count"] == 7

          assert boundary["closureState"] == "closed"
          assert boundary["policyRevision"] == baseline["scopePolicyRevision"]
          assert boundary["metrics"]["boundaryRows"] == expected[
              "boundaryReviewRows"
          ]
          assert boundary["metrics"]["boundaryProgramKeys"] == expected[
              "boundaryReviewProgramKeys"
          ]
          assert boundary["metrics"]["authorityObservedWorks"] == expected[
              "boundaryReviewWorks"
          ]
          assert boundary["metrics"]["admissionStates"] == expected[
              "boundaryReviewStates"
          ]
          assert boundary["metrics"]["violations"] == 0

          summary = {
              "registryRevision": registry["registryRevision"],
              "scopePolicyRevision": scope["policyRevision"],
              "programMetadataEvidenceRevision": confidence[
                  "programMetadataEvidenceRevision"
              ],
              "mcaConservacionWorks": len(selected),
              "mcaConservacionAdmission": dict(
                  Counter(w.get("admissionStatus") for w in selected)
              ),
              "mcaConservacionDateQuality": dict(quality),
              "baseMcaWorks": len(base_works),
              "baseMcaAdmission": dict(
                  Counter(w.get("admissionStatus") for w in base_works)
              ),
              "historicalStandaloneWorks": len(historical_works),
              "globalProjectedAdmission": projection["projectedAdmission"],
              "boundaryReviewWorks": boundary["metrics"][
                  "authorityObservedWorks"
              ],
              "humanitiesActionQueueItems": queue["metrics"][
                  "humanitiesActionQueueItems"
              ],
              "humanitiesActionWorks": queue["metrics"][
                  "humanitiesActionWorks"
              ],
              "workReviewQueueItems": queue["metrics"][
                  "workReviewQueueItems"
              ],
              "workReviewWorks": queue["metrics"]["workReviewWorks"],
              "nextHumanitiesAction": next_action,
          }
          (root / "v40-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload V40 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-mca-conservacion-authority-v40
          path: artifacts/thesis-mca-conservacion-v40/
          if-no-files-found: error
          retention-days: 14
