name: Sincronía · restore five source-verified historical work titles

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-verified-index-titles.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-five-verified-work-identities
  cancel-in-progress: false

jobs:
  verified-work-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable source-bibliography mapping
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_verified_index_titles
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly five verified article titles and bylines
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/cucsh-five-before.json
          python3 -m scripts.cucsh.restore_sincronia_verified_index_titles \
            --input /tmp/cucsh-five-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Verify strict corpus integrity and no metadata loss
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-five-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-five-historical-quality.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-five-pending-authors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("/tmp/cucsh-five-before.json").read_text())
          a=json.loads(Path("src/data/cucsh-filosofia.json").read_text())
          old={r["id"]:r for r in b["records"]}
          new={r["id"]:r for r in a["records"]}
          assert len(old)==len(new)==1845
          assert list(old)==list(new)
          changed=[rid for rid in old if old[rid]!=new[rid]]
          assert len(changed)==5,changed
          permitted={
              "title","titleVariants","authors",
              "legacyIndexMislabelEvidence","legacyAuthorEvidence"
          }
          for rid in changed:
              before=old[rid]; after=new[rid]
              assert before["journal"]==after["journal"]=="Sincronía"
              assert not before.get("authors") and len(after["authors"])==1
              for field in set(before)|set(after):
                  if field not in permitted:
                      assert before.get(field)==after.get(field),(rid,field)
              assert (after["legacyIndexMislabelEvidence"]["sourceArticleUrl"]
                      ==before["urls"]["canonical"])
              assert before["legacyAccessStatus"]==after["legacyAccessStatus"]
          pending=json.loads(Path("/tmp/sincronia-five-pending-authors.json").read_text())
          assert pending["pendingAuthorRecords"]==110
          assert pending["totalSincroniaRecords"]==1454
          assert pending["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FIVE_VERIFIED_IDENTITIES_PASS",len(changed),110)
          PY
      - name: Run full search and app regression tests
        run: |
          npm ci
          npm test
      - name: Commit verified dataset only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected files changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore five source-verified Sincronía early article titles"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Save post-repair review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-five-work-identities-${{ github.run_id }}
          path: |
            /tmp/sincronia-five-historical-quality.json
            /tmp/sincronia-five-pending-authors.json
          retention-days: 30
          if-no-files-found: warn
