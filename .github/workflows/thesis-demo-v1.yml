name: Thesis UdeG public demo V1

on:
  pull_request:
    paths:
      - "tesis.html"
      - "index.html"
      - "js/thesis-demo.js"
      - "css/thesis-demo.css"
      - "src/core/thesis-demo-search.js"
      - "scripts/qa/thesis-demo-smoke.mjs"
      - "scripts/thesis/build_thesis_demo_index_v1.py"
      - "scripts/thesis/build_philosophy_public_index_v1.py"
      - "scripts/thesis/config/philosophy-curated-content-v1.json"
      - "scripts/thesis/config/philosophy-official-supplement-v1.json"
      - "scripts/thesis/config/philosophy-external-corroboration-v1.json"
      - "tests/test_thesis_demo_index_v1.py"
      - "tests/test_thesis_philosophy_public_index_v1.py"
      - "tests/thesis-demo.test.mjs"
      - "docs/THESIS_DEMO_SEARCH_V1.md"
      - "docs/THESIS_PHILOSOPHY_PUBLIC_VIEW_T2CI.md"
      - "docs/THESIS_PUBLIC_CORROBORATION_T2CT.md"
      - ".github/workflows/thesis-demo-v1.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test V2 demo and Philosophy public builders
        run: |
          python -m py_compile \
            scripts/thesis/build_thesis_demo_index_v1.py \
            scripts/thesis/build_philosophy_public_index_v1.py \
            scripts/thesis/merge_philosophy_cucsh_inventory_t2cu.py \
            scripts/thesis/probe_cucsh_thesis_catalog_v1.py
          python -m unittest \
            tests.test_thesis_demo_index_v1 \
            tests.test_thesis_philosophy_public_index_v1 \
            tests.test_thesis_philosophy_cucsh_public_t2cu -v
          node --test tests/thesis-demo.test.mjs

      - name: Full browser-search regression suite
        run: |
          npm ci
          npm test

      - name: Download and verify immutable Effective Corpus V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/thesis-demo-v2
          mkdir -p /tmp/thesis-demo-v2
          gh release download thesis-effective-corpus-v2 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "effective-corpus.json.gz" \
            --pattern "effective-corpus.json.sha256" \
            --pattern "effective-corpus.json.gz.sha256" \
            --pattern "effective-corpus-report.json" \
            --pattern "manifest.json" \
            --dir /tmp/thesis-demo-v2

          python scripts/thesis/build_effective_corpus_release_manifest_v2.py \
            verify-release \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --release-dir /tmp/thesis-demo-v2 \
            --root-release-manifest release-manifest.json

      - name: Generate V2 demo and public Philosophy indexes
        run: |
          rm -rf artifacts/thesis-demo-v2 artifacts/philosophy-public-v1
          mkdir -p artifacts/thesis-demo-v2 artifacts/philosophy-public-v1

          python scripts/thesis/build_thesis_demo_index_v1.py \
            --corpus-gzip /tmp/thesis-demo-v2/effective-corpus.json.gz \
            --contract scripts/thesis/config/effective-corpus-release-t2cg-v2.json \
            --registry scripts/thesis/config/program-authority-v1.json \
            --output artifacts/thesis-demo-v2/index.json

          python scripts/thesis/build_philosophy_public_index_v1.py \
            --demo-index artifacts/thesis-demo-v2/index.json \
            --curated-config scripts/thesis/config/philosophy-curated-content-v1.json \
            --supplement-config scripts/thesis/config/philosophy-official-supplement-v1.json \
            --corroboration-config scripts/thesis/config/philosophy-external-corroboration-v1.json \
            --output artifacts/philosophy-public-v1/base-index.json

          python scripts/thesis/probe_cucsh_thesis_catalog_v1.py \
            --output artifacts/philosophy-public-v1/cucsh-report.json

          python scripts/thesis/merge_philosophy_cucsh_inventory_t2cu.py \
            --base-index artifacts/philosophy-public-v1/base-index.json \
            --cucsh-report artifacts/philosophy-public-v1/cucsh-report.json \
            --output artifacts/philosophy-public-v1/index.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          demo_path=Path("artifacts/thesis-demo-v2/index.json")
          demo=json.loads(demo_path.read_text(encoding="utf-8"))
          rows=demo["records"]

          assert demo["schemaVersion"]=="thesis-demo-index-v1"
          assert demo["sourceRelease"]=="thesis-effective-corpus-v2"
          assert demo["referenceOnly"] is True
          assert demo["totalIncluded"]==len(rows)==566
          assert demo["totalCanonical"]==27580
          assert len({row["id"] for row in rows})==566
          assert all(row["id"].startswith("thesis:work:") for row in rows)
          assert all(len(row["abstractExcerpt"])<=460 for row in rows)
          assert all(row["degree"] in {"licenciatura","maestria","doctorado"} for row in rows)
          assert all(row["program"] and row["programRef"] for row in rows)
          assert all(
              not any(key in row for key in [
                  "pdf","pdfBytes","fullText","rawText","sourceRecords","rawFields",
              ])
              for row in rows
          )
          assert demo_path.stat().st_size <= 2_500_000

          philosophy_path=Path("artifacts/philosophy-public-v1/index.json")
          philosophy=json.loads(philosophy_path.read_text(encoding="utf-8"))

          assert philosophy["schemaVersion"]=="thesis-philosophy-public-index-v1"
          assert philosophy["revision"]=="2026-11-04.t2cu-v1"
          assert philosophy["sourceRelease"]=="thesis-effective-corpus-v2"
          assert philosophy["referenceOnly"] is True
          assert philosophy["canonicalAdmissionMutation"] is False
          assert philosophy["preserveActualProgram"] is True
          assert philosophy["metrics"]["records"]==len(philosophy["records"])==233
          assert philosophy["metrics"]["byStatus"]=={"include":231,"review":2}
          assert philosophy["metrics"]["byRole"]=={
              "curated-manual-classification":1,
              "philosophical-content":6,
              "program-core":224,
              "program-core-candidate":2,
          }
          assert philosophy["metrics"]["actualProgramsRepresented"]==10
          assert philosophy["metrics"]["corroboratedReviewRecords"]==2
          assert len(philosophy["documentedPhilosophyPrograms"])==3
          assert philosophy["doctoralPolicy"]["exactDoctorateProgramPresent"] is False

          forbidden=(".pdf","/bitstream","/download")
          for row in philosophy["records"]:
              url=(row.get("sourceUrl") or "").lower()
              assert not any(token in url for token in forbidden), url
              if row.get("externalCorroboration"):
                  assert row["philosophyStatus"]=="review"
                  assert row["externalCorroboration"]["identityConfirmed"] is False
                  assert row["externalCorroboration"]["physicalLocationConfirmed"] is False

          assert Path("tesis.html").is_file()
          assert Path("js/thesis-demo.js").is_file()

          print(json.dumps({
              "demo_records":len(rows),
              "demo_source_release":demo["sourceRelease"],
              "philosophy_records":philosophy["metrics"]["records"],
              "philosophy_status":philosophy["metrics"]["byStatus"],
              "philosophy_programs":len(philosophy["documentedPhilosophyPrograms"]),
              "pdf_copies":0,
              "status":"PR artifact only, not published",
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload reference-only search evidence
        uses: actions/upload-artifact@v4
        with:
          name: thesis-search-v2-and-philosophy-t2cu
          path: |
            artifacts/thesis-demo-v2/index.json
            artifacts/philosophy-public-v1/index.json
            artifacts/philosophy-public-v1/cucsh-report.json
          if-no-files-found: error
          retention-days: 14
