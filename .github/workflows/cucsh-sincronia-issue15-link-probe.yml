name: Sincronía issue 15 article-link probe

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-issue15-links.txt"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inspect archived issue 15 article pages and sibling links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          candidates=[
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/goya.htm",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/macias.htm",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/desnudez.htm",
              "http://sincronia.cucsh.udg.mx/desnudez.htm",
              "http://sincronia.cucsh.udg.mx/cineus.htm",
              "http://sincronia.cucsh.udg.mx/cineus.html",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/joon.htm",
              "http://sincronia.cucsh.udg.mx/joon.htm",
              "http://fuentes.csh.udg.mx/CUCSH/Sincronia/historieta.htm",
              "http://sincronia.cucsh.udg.mx/historieta.htm",
          ]

          def req(url,timeout=12):
              request=urllib.request.Request(
                  url,
                  headers={"User-Agent":"Mozilla/5.0 InvestigacionFilosofica/0.1"},
              )
              with urllib.request.urlopen(request,timeout=timeout) as response:
                  return response.read()

          def snapshot(url):
              api="https://archive.org/wayback/available?"+urllib.parse.urlencode({"url":url})
              payload=json.loads(req(api,10).decode("utf-8","replace"))
              closest=(payload.get("archived_snapshots") or {}).get("closest") or {}
              if not closest.get("available"):
                  return None
              snap=closest.get("url")
              if not snap:
                  return None
              snap=snap.replace("http://web.archive.org/","https://web.archive.org/")
              snap=re.sub(r"/web/(\d{14})/",r"/web/\1id_/",snap,count=1)
              return closest.get("timestamp"),snap

          class P(HTMLParser):
              def __init__(self,base):
                  super().__init__(convert_charrefs=True)
                  self.base=base
                  self.href=None
                  self.parts=[]
                  self.links=[]
                  self.title=[]
                  self.in_title=False
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="a":
                      self.href=dict(attrs).get("href")
                      self.parts=[]
                  if tag.lower()=="title":
                      self.in_title=True
              def handle_data(self,data):
                  if self.href is not None:
                      self.parts.append(data)
                  if self.in_title:
                      self.title.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=="a" and self.href is not None:
                      self.links.append((
                          urllib.parse.urljoin(self.base,self.href),
                          " ".join(self.parts).strip(),
                      ))
                      self.href=None
                      self.parts=[]
                  if tag.lower()=="title":
                      self.in_title=False

          def inspect(url):
              try:
                  snap=snapshot(url)
                  if not snap:
                      return url,None,None,[],"no-snapshot"
                  timestamp,snapshot_url=snap
                  data=req(snapshot_url,15)
                  parser=P(url)
                  parser.feed(data.decode("latin-1","replace"))
                  parser.close()
                  siblings=[]
                  for href,text in parser.links:
                      parsed=urllib.parse.urlparse(href)
                      low=href.lower()
                      if (
                          "sincronia" in low
                          and parsed.path.lower().endswith((".htm",".html"))
                      ):
                          siblings.append((href,html.unescape(text)))
                  return url,timestamp," ".join(parser.title).strip(),siblings,None
              except Exception as exc:
                  return url,None,None,[],repr(exc)

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for item in ex.map(inspect,candidates):
                  results.append(item)

          union={}
          for url,timestamp,title,siblings,error in results:
              print("PAGE",url,"TIMESTAMP",timestamp,"TITLE",repr(title),"ERROR",error)
              for href,text in siblings:
                  key=href.split("#",1)[0]
                  union.setdefault(key,set()).add(text)
                  print("SIBLING",repr(key),repr(text))

          print("UNION_START")
          for href,texts in sorted(union.items()):
              print("UNION",repr(href),repr(sorted(texts)))
          print("UNION_END")
          PY
