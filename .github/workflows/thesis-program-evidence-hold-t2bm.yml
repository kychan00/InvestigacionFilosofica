name: Thesis Program Evidence HOLD T2BM

on:
  pull_request:
    paths:
      - "scripts/thesis/build_program_curation_queue_v1.py"
      - "scripts/thesis/config/program-evidence-holds-v1.json"
      - "tests/test_thesis_program_evidence_hold_ready_queue_t2bm.py"
      - "docs/THESIS_PROGRAM_EVIDENCE_HOLD_T2BM.md"
      - ".github/workflows/thesis-program-evidence-hold-t2bm.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile and unit tests
        run: |
          python -m py_compile scripts/thesis/build_program_curation_queue_v1.py
          python -m unittest discover -s tests -p "test_thesis_program_evidence_hold_ready_queue_t2bm.py" -v

      - name: Fetch frozen full baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/thesis-t2bm-full
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13099541204/zip" \
            > /tmp/thesis-t2bm-full.zip
          unzip -q /tmp/thesis-t2bm-full.zip -d /tmp/thesis-t2bm-full

      - name: Reproject Metadata Confidence V5
        run: |
          mkdir -p artifacts/thesis-t2bm
          python scripts/thesis/reproject_program_metadata_confidence_snapshot_v1.py \
            --canonical-corpus /tmp/thesis-t2bm-full/canonical-corpus.json.gz \
            --source-records /tmp/thesis-t2bm-full/source-records.jsonl.gz \
            --output-corpus artifacts/thesis-t2bm/canonical-confidence.json \
            --output-report artifacts/thesis-t2bm/confidence-projection.json

      - name: Reproject V41 and queue
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/thesis")
          import audit_program_coverage_v1 as coverage
          import build_canonical_corpus_v1 as canonical
          import build_program_curation_queue_v1 as curation
          root = Path("artifacts/thesis-t2bm")
          corpus = json.loads((root / "canonical-confidence.json").read_text())
          observed = json.loads(
              Path("/tmp/thesis-t2bm-full/observed-authorities.json").read_text()
          )
          registry = canonical.load_program_registry()
          projected, projection = coverage.reproject_corpus(
              corpus, registry, reference_year=2026
          )
          projected_observed = coverage.reproject_observed_authorities(
              observed, projection["programDimensions"]
          )
          queue = curation.build_queue(projected_observed, projected, registry)
          (root / "canonical-v41.json").write_text(
              json.dumps(projected, ensure_ascii=False)
          )
          (root / "queue-v41.json").write_text(
              json.dumps(queue, ensure_ascii=False)
          )
          PY

      - name: Assert full-snapshot evidence HOLD without admission changes
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path("artifacts/thesis-t2bm")
          corpus = json.loads((p / "canonical-v41.json").read_text())
          queue = json.loads((p / "queue-v41.json").read_text())
          assert len(corpus["works"]) == 27576
          counts = dict(Counter(w["admissionStatus"] for w in corpus["works"]))
          assert counts == {
              "include": 559, "review": 254, "quarantine": 18971,
              "exclude": 7790, "reject-source": 2
          }, counts
          m = queue["metrics"]
          expected = {
              "humanitiesActionQueueItems": 22, "humanitiesActionWorks": 102,
              "evidenceHoldQueueItems": 5, "evidenceHoldWorks": 13,
              "humanitiesReadyQueueItems": 17, "humanitiesReadyWorks": 89,
              "workReviewQueueItems": 1, "workReviewWorks": 152
          }
          for name, value in expected.items():
              assert m[name] == value, (name, m[name], value)
          ref = "program:udg:mae-ciencias-arquitectura-arte-comunicacion"
          held = queue["evidenceHoldItems"]
          assert {x["authority"]["id"] for x in held} == {ref}
          assert all(x["authority"]["admissionState"] == "review" for x in held)
          ready = queue["nextHumanitiesReadyAction"]
          assert ready and (ready.get("authority") or {}).get("id") != ref
          assert queue["nextHumanitiesAction"]["authority"]["id"] == ref
          report = {
              "phase": "T2BM", "decision": "research-scheduling-hold-only",
              "globalAdmission": counts,
              "metrics": expected,
              "nextHumanitiesReadyAction": {
                  k: ready.get(k) for k in (
                      "normalizedKey", "count", "authority",
                      "observedYears", "observedUnits", "evidenceNeeds"
                  )
              },
          }
          (p / "evidence-ready-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\\n"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload evidence-ready audit (no raw corpus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-evidence-hold-t2bm
          path: artifacts/thesis-t2bm/evidence-ready-report.json
          if-no-files-found: warn
          retention-days: 14
