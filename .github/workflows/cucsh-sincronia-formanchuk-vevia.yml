name: Sincronía · restore Formanchuk and Vevia originals

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-formanchuk-vevia.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronia-formanchuk-vevia-primary
  cancel-in-progress: false

jobs:
  restore-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test signed source identities and unchanged historical catalogue
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_formanchuk_vevia_primary
          python3 -m unittest tests.test_cucsh_validate_update
      - name: Restore exactly two archived-original signatures
        shell: bash
        run: |
          set -euo pipefail
          cp src/data/cucsh-filosofia.json /tmp/sincronia-fv-before.json
          python3 -m scripts.cucsh.restore_sincronia_formanchuk_vevia_primary \
            --input /tmp/sincronia-fv-before.json \
            --output src/data/cucsh-filosofia.json
      - name: Audit unchanged source records and two documented bylines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/sincronia-fv-before.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-fv-history.json
          python3 -m scripts.cucsh.audit_sincronia_pending_authors \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-fv-pending.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.cucsh.restore_sincronia_formanchuk_vevia_primary import SOURCES

          baseline=json.loads(Path("/tmp/sincronia-fv-before.json").read_text(encoding="utf-8"))
          updated=json.loads(Path("src/data/cucsh-filosofia.json").read_text(encoding="utf-8"))
          old={r["id"]:r for r in baseline["records"]}
          new={r["id"]:r for r in updated["records"]}
          assert len(old)==len(new)==1845
          assert list(old)==list(new)
          delta=[rid for rid in old if old[rid]!=new[rid]]
          assert len(delta)==2 and set(delta)==set(SOURCES),delta

          for rid in delta:
              before,after=old[rid],new[rid]
              src=SOURCES[rid]
              assert before["journal"]==after["journal"]=="Sincronía"
              for f in ("title","issueNumber","year","urls","legacyOriginal","legacyAccessStatus"):
                  assert before[f]==after[f],(rid,f)
              assert before.get("legacyTitleEncodingEvidence")==after.get("legacyTitleEncodingEvidence")
              assert {f for f in set(before)|set(after)
                      if before.get(f)!=after.get(f)}=={"authors","legacyAuthorEvidence"}
              assert after["authors"]==[{"name":src["author"],"sourceName":src["author"]}]
              ev=after["legacyAuthorEvidence"]
              assert ev["sourceUrl"]==src["snapshot"]
              assert ev["sourceArticleUrl"]==src["url"]
              assert ev["sourcePrintedByline"]==src["printedByline"]
              assert ev["sourceArticleTitle"]==src["sourceArticleTitle"]
              assert ev["matchedIndexedIssue"]==src["issue"]
              assert ev["matchedIndexedYear"]==src["year"]
              assert ev["originalAvailabilityPreserved"]
              assert ev["titleIdentityCaveat"]

          report=json.loads(Path("/tmp/sincronia-fv-pending.json").read_text(encoding="utf-8"))
          assert report["totalSincroniaRecords"]==1454
          assert report["pendingAuthorRecords"]==36
          assert report["authorlessArticleCandidatesExcludingEditorialNavigation"]==34
          assert report["highConfidenceEditorialNavigationCount"]==2
          assert report["bibliographicConflictCount"]==1
          assert report["titlesWithUnicodeReplacementCharacter"]==0
          print("SINCRONIA_FORMANCHUK_VEVIA_PASS",len(delta),36)
          PY
      - name: Full application regression
        run: |
          npm ci
          npm test
      - name: Commit only verified historical corpus modifications
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short)" = " M src/data/cucsh-filosofia.json" || {
            git status --short
            echo "Unexpected worktree modifications"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          git commit -m "Restore signed Formanchuk and Vevia Sincronía original works"
          git push origin HEAD:feature/cucsh-sincronia
      - name: Upload archival quality and remaining author audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-formanchuk-vevia
          path: |
            /tmp/sincronia-fv-history.json
            /tmp/sincronia-fv-pending.json
          retention-days: 30
          if-no-files-found: warn
