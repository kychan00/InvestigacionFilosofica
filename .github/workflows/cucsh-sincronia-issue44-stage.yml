name: Sincronía · stage eight verified issue-44 articles

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-issue44-stage.txt"

permissions:
  contents: write

concurrency:
  group: sincronia-issue44-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cucsh-sincronia
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify issue-44 backfill is safe and idempotent
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_issue44_backfill
          cp src/data/cucsh-filosofia.json /tmp/cucsh-before-44.json
          python3 -m scripts.cucsh.backfill_sincronia_44 \
            --before /tmp/cucsh-before-44.json \
            --after src/data/cucsh-filosofia.json \
            --report /tmp/sincronia-issue44-backfill.json
          python3 scripts/cucsh/validate_update.py \
            --before /tmp/cucsh-before-44.json \
            --after src/data/cucsh-filosofia.json
          python3 -m scripts.cucsh.audit_sincronia_historical \
            --input src/data/cucsh-filosofia.json \
            --output /tmp/sincronia-historical-after44.json
      - name: Test search engine and federation with eight new articles
        run: |
          npm ci
          npm test
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { searchCucshRecords } from "./src/sources/cucsh-filosofia.js";
          const dataset=JSON.parse(readFileSync("src/data/cucsh-filosofia.json","utf8"));
          const sincronia=dataset.records.filter(r=>r.journal==="Sincronía");
          assert.equal(sincronia.length,1450);
          assert.equal(dataset.records.length,1841);
          assert.equal(sincronia.filter(r=>r.issueNumber===44).length,10);
          const expected=[
            "Génesis de un personaje teatral",
            "Una aproximación sistémica a la realidad política"
          ];
          for(const title of expected){
            assert.ok(sincronia.some(r=>r.title===title));
            const results=searchCucshRecords(dataset.records,title,{rows:60});
            assert.ok(results.some(r=>r.journal==="Sincronía" && r.title===title));
            console.log("ISSUE44_SEARCH_OK",title);
          }
          JS
      - name: Commit only the validated snapshot on the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cucsh-filosofia.json
          test "$(git diff --cached --name-only)" = "src/data/cucsh-filosofia.json"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Already staged"
          else
            git commit -m "Backfill eight verified Sincronía issue 44 articles"
            git push origin HEAD:feature/cucsh-sincronia
          fi
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronia-issue44-backfill-${{ github.run_id }}
          path: |
            /tmp/sincronia-issue44-backfill.json
            /tmp/sincronia-historical-after44.json
          if-no-files-found: warn
          retention-days: 30
