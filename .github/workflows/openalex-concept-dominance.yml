name: Audit OpenAlex philosophy concept dominance

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb huggingface_hub

      - name: Audit concept dominance
        run: |
          python scripts/openalex/sample_philosophy_concept_dominance.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: openalex-philosophy-concept-dominance
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/openalex/philosophy-concept-dominance.parquet
