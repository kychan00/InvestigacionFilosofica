name: Sincronía legacy · fast offline verification

on:
  push:
    branches:
      - feature/cucsh-sincronia
    paths:
      - ".github/triggers/cucsh-sincronia-legacy-v3.txt"
      - ".github/workflows/cucsh-sincronia-legacy-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep the existing group: the new, short job supersedes old long-running pushes.
concurrency:
  group: sincronia-legacy-v3
  cancel-in-progress: true

jobs:
  verified-fallbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify pinned historical metadata without network access
        run: |
          python3 -m unittest tests.test_cucsh_sincronia_dialnet tests.test_cucsh_sincronia_legacy
          python3 - <<'PY'
          from scripts.cucsh.sincronia_dialnet import verified_issue_payload, build_record

          expectations = {49: 21, 51: 9}
          for issue_number, expected_articles in expectations.items():
              payload = verified_issue_payload(issue_number)
              assert payload is not None, f"Missing verified fallback: {issue_number}"
              issue, articles = payload
              assert issue["number"] == issue_number
              assert len(articles) == expected_articles
              records = [build_record(article, issue) for article in articles]
              assert len({record["id"] for record in records}) == expected_articles
              assert all(record["issueNumber"] == issue_number for record in records)
              assert all(record["urls"]["canonical"].startswith("https://dialnet.unirioja.es/") for record in records)
              print(f"OFFLINE_FALLBACK_OK issue={issue_number} articles={len(records)}")
          PY
      - name: Explain full audit policy
        run: echo "Live full 1-51 harvest is intentionally separate; it is not a routine push check."
