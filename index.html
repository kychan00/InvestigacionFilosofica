<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Investigación Filosófica
  </title>

  <link
    rel="stylesheet"
    href="./css/app.css"
  >
</head>

<body>

  <main class="app">

    <header class="hero">

      <div class="eyebrow">
        Motor federado de investigación
      </div>

      <h1>
        Investigación Filosófica
      </h1>

      <p class="lead">
        Busca literatura filosófica en múltiples
        fuentes académicas y ordénala por relevancia.
      </p>

    </header>


    <section class="search-panel">

      <form
        id="search-form"
        class="search-form"
      >

        <label
          for="search-input"
          class="sr-only"
        >
          Consulta filosófica
        </label>

        <input
          id="search-input"
          name="q"
          type="search"
          autocomplete="off"
          placeholder="Ej. libertad en Kant"
          required
        >

        <select
          id="search-depth"
          aria-label="Profundidad de búsqueda"
        >
          <option value="6">
            Rápida
          </option>

          <option
            value="12"
            selected
          >
            Amplia
          </option>

          <option value="20">
            Profunda
          </option>
        </select>

        <button type="submit">
          Buscar
        </button>

      </form>


      <div
        id="status"
        class="status"
        aria-live="polite"
      ></div>

    </section>


    <section
      id="interpretation"
      class="interpretation hidden"
    ></section>


    <section
      id="stats"
      class="stats hidden"
    ></section>


    <section
      id="filters"
      class="filters hidden"
    ></section>


    <section
      id="results"
      class="results"
    ></section>

  </main>


  <div
    id="record-modal"
    class="record-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="record-modal-title"
  >
    <div
      class="record-modal-backdrop"
      data-close-record
    ></div>

    <div class="record-modal-panel">

      <button
        type="button"
        class="record-modal-close"
        data-close-record
        aria-label="Cerrar"
      >
        ×
      </button>

      <div
        id="record-modal-content"
      ></div>

    </div>
  </div>


  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>
</html>
